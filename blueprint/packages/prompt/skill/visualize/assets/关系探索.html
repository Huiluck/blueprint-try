<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>探索一条关系</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#17362c;font-family:system-ui,sans-serif}main{max-width:940px;margin:auto;padding:48px 28px}h1{font-size:36px;margin:12px 0}p{line-height:1.7;color:#496157}.kicker{color:#277b5f;font-size:14px}section{padding:24px;background:white;border:1px solid #d4e2d8;border-radius:20px;margin-top:24px}label{display:block;font-weight:600}input{width:100%;margin:20px 0;accent-color:#277b5f}svg{display:block;width:100%;height:auto}output{font-weight:650;color:#277b5f;font-variant-numeric:tabular-nums}.grid{fill:none;stroke:#dce7df;stroke-width:1}.curve{fill:none;stroke:#277b5f;stroke-width:4}text{font-size:16px;fill:#496157}.note{font-size:14px}</style></head>
<body><main><div class="kicker">示意模型 · 参数探索</div><h1>同样的输入，可以有不同的变化速度</h1><p>移动参数观察曲线如何变化。这个例子展示交互方法，曲线没有现实数据含义；替换为实际问题的关系、单位和来源。</p>
<section><label for="rate">变化参数 k：<output id="rate-value">2.0</output></label><input id="rate" type="range" min="0.2" max="5" step="0.1" value="2"><svg viewBox="0 0 820 380" role="img" aria-labelledby="chart-title"><title id="chart-title">关系 y = 1 − exp(−kx)</title><path class="grid" d="M60 25V320H780M60 172H780M420 25V320"/><path id="curve" class="curve"/><text x="53" y="347">0</text><text x="770" y="347">1</text><text x="26" y="33">1</text><text x="26" y="323">0</text><text x="350" y="376">输入 x（示意单位）</text></svg><p>x = 1 时，y = <output id="result"></output>。公式：y = 1 − exp(−k x)。</p></section>
<p class="note">选择参数范围时，要保证它对当前任务有意义；真实数据与模型估计应能在作品中区分。</p></main>
<script>const input=document.getElementById('rate');function update(){const k=Number(input.value);document.getElementById('rate-value').textContent=k.toFixed(1);document.getElementById('result').textContent=(1-Math.exp(-k)).toFixed(3);const points=Array.from({length:101},(_,i)=>{const x=i/100,y=1-Math.exp(-k*x);return `${i?'L':'M'}${60+720*x},${320-295*y}`});document.getElementById('curve').setAttribute('d',points.join(' '));window.visualizationState={k,result:1-Math.exp(-k)}}input.addEventListener('input',update);update();</script></body></html>
