<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

  <main>
    <header><div><p class="eyebrow">SPATIAL EXHIBIT</p><h1>__作品标题__</h1></div><button id="镜头复位" type="button">镜头复位</button></header>

        <p class="label">展品配色</p><div id="颜色列表" aria-label="配色选择"></div>
        <p id="场景状态" role="status" aria-live="polite">正在载入空间…</p>
      </aside>
    </div>
  </main>
  <script type="module" src="空间场景.mjs"></script>
