/* ================= 坐标:几根横条 =================
   每一根是**同一个量的几个停点**,一行一根:带框的分段条 ＋ 右边那一句话(样式见 .np-dial 那一段)。
   **这些话是用户的原话,一个字都不许改写**:它直接进第一句话里给 Blueprint 看,
   改写它就是替用户重新表态一次。
   品质选项在这张表，协作选项由 prompt 包的协作模式目录提供。
   HTML 里留两个空壳(壳子按 id 找,加条要补一个 <div class="np-dial" id="np-dial-X">)。
   ⚠️ `名` 一处三用:小标题 · 壳子 id 的后半截 · 第一句话里那段坐标。
   改名字就得连 HTML 里那个 id 一起改,不然 造条() 找不到壳子。
   `档` ＝ 这个项目的全局思考强度(reasoningEffort)。2026-10-02 品质改为 high / max / ultra：
   high 沿用原有标准；max 与 ultra 默认启用最高思考档，模型区可手动选择其他支持的档位。
   品质名不直接冒充供应商的思考档位。建完之后树上「全局」那一行照样能再改。 */
const 坐标表 = [
  {名:'Quality', key:'studio-quality-4', 默认:1,
   迁移:[
     {key:'studio-quality-3', 挡:{high:'high', ultra:'max', max:'ultra'}},
     {key:'studio-坐标-品质', 挡:['high', 'high', 'ultra']},
   ], 挡:[
    {名:'high', 档:'high', get 说(){ return 译('消耗中等、以行业一般水平为标准'); }},
    {名:'max', 档:'max', get 说(){ return 译('以顶级品质为标准，优先投入关键环节，追求最高性价比'); }},
    {名:'ultra', 档:'max', get 说(){ return 译('在宽松但有限的预算下，以人类世界顶级品质为标准'); }},
  ]},
  /* 协作频率目录由后端从 prompt 包读取：spark、build、solo（十 55），默认第一项。旧选择按含义迁移（co-create 改名 build）。 */
  {名:'Mode', key:'studio-mode-5', 默认:0, 挡:[], 迁移:[]},
];

/** 把一根条长在 宿主 里。返回 () => 当前那一挡。
    `随` ＝ 拨动时还带动了什么(每次画都叫一遍,开场也叫)。
    **所有条共用这一个函数** —— 加第四根条不许在这儿加一行 if:
    「这一挡还带动什么」是挡自己身上的事(比如 引导),不是这个函数认得的事。 */
function 造条(宿主, 条, 随){
  宿主.innerHTML = `
    <span class="np-k">${条.名}</span>
    <div class="np-seg" role="radiogroup" aria-label="${条.名}">
      ${条.挡.map((m,i)=>`<label><input type="radio" name="np-${条.名}" value="${i}"${i===条.默认?' checked':''}><span>${m.显示名 || m.名}</span></label>`).join('')}
    </div>
    <p class="np-say"></p>`;
  const 钮们 = [...宿主.querySelectorAll('input')];
  const 话 = 宿主.querySelector('.np-say');
  const 当前 = () => 条.挡[Number((钮们.find(x => x.checked) || {}).value)] || 条.挡[条.默认];
  const 画 = () => {
    话.textContent = 当前().说;
    if(随) 随(当前());
  };
  /* 按挡名记住选择。品质更名时按原投入含义迁移：有限资源 → max，不限投入 → ultra；
     协作模式按原参与含义迁移，兼容旧下标后也改存挡名。无记录或无效记录保留默认值。 */
  let 记 = mem.get(条.key);
  if(记 == null && 条.迁移){
    for(const 来源 of 条.迁移){
      const 旧 = mem.get(来源.key);
      if(旧 == null) continue;
      记 = Object.hasOwn(来源.挡, 旧) ? 来源.挡[旧] : null;
      break;
    }
  }
  const 记钮 = 钮们.find(x => 条.挡[Number(x.value)].名 === 记)
    || (!条.迁移 && 记 != null && /^\d+$/.test(记) ? 钮们[Number(记)] : null);
  if(记钮){ 记钮.checked = true; mem.set(条.key, 当前().名); }
  宿主.onchange = () => { mem.set(条.key, 当前().名); 画(); };
  画();
  return 当前;
}

(async function wireNewProject(){
  const form = document.getElementById('np-card');
  const name = document.getElementById('np-name');
  const desc = document.getElementById('np-desc');
  const go   = document.getElementById('np-go');
  const effortSel = document.getElementById('np-effort');
  const projectReasoning = window.BlueprintProjectReasoning(effortSel, {
    hint: document.getElementById('np-effort-hint'), memory: mem,
  });
  const projectSkills = window.BlueprintProjectSkills(document.getElementById('np-skills'), {
    withTypes: true, initialType: 'custom',
  });
  const projectAttachments = window.BlueprintProjectAttachments({
    host: document.getElementById('np-brief'), input: desc,
    picker: document.getElementById('np-files'), add: document.getElementById('np-attach'),
    tray: document.getElementById('np-attachments'), note: document.getElementById('np-attachment-note'),
  });
  window.npLoadSkills = projectSkills.load;
  if(S.at.在 === 'draft') void projectSkills.load();
  go.disabled = true;
  document.getElementById('np-cancel').onclick = closeNewProject;
  const 目录 = await fetch('api/collaboration-modes').then(r => r.json());
  if(!目录.ok || !Array.isArray(目录.modes) || !目录.modes.length) throw new Error(译('协作频率目录读不出来'));
  const 模式条 = 坐标表.find(x => x.名 === 'Mode');
  模式条.挡 = 目录.modes.map(m => ({名:m.id, 显示名:m.label, 说:m.description, 引导:m.guide}));
  const 旧模式 = Object.fromEntries(目录.modes.flatMap(m => (m.aliases || []).map(a => [a,m.id])));
  旧模式.solo = 'solo';
  for(const [i,name] of ['execute','co-create','solo'].entries()) 旧模式[i] = 旧模式[name];
  模式条.迁移 = [{key:'studio-mode-4', 挡:旧模式}, {key:'studio-mode-3', 挡:旧模式}];
  /* 坐标那几根条:一根一个空壳,内容全由 造条() 生。
     加第四根条 ＝ 坐标表 里加一行 + HTML 里补一个空壳,这儿不用动。
     **带 引导 的那一挡顺手换掉描述框的提示** —— 这里不问「是哪根条」,
     只问「这一挡带不带 引导」。哪天品质那根条也想管这句提示,给它的挡加一行就行。 */
  document.getElementById('np-dials').style.gridTemplateColumns = 坐标表.map(条 => 条.挡.length + 'fr').join(' ');
  const 各挡 = 坐标表.map(条 => 造条(document.getElementById('np-dial-' + 条.名), 条,
    挡 => { if(挡.引导) desc.placeholder = 挡.引导.join('\n\n'); if(挡.档) projectReasoning.setQuality(挡.档); }));
  go.disabled = false;

  /* ---- 模型选择 ----
     名单走 llm.models(主机级,不占会话 —— 表开着的时候会话还不存在,session.models 问不了)。
     每次开表现取一次:模型名单是部署的实况,不缓存一份旧的。
     选空(默认)＝一个字不送,Blueprint 会话用部署默认;选了＝建项目那一步服务端当场
     selectModel 到 Blueprint 会话上 —— 下游 assign 从父抄 provider/model,整棵树跟着它。 */
  const modelSel = document.getElementById('np-model');
  const modelHint = document.getElementById('np-model-hint');
  let 模型单 = [];
  async function 装模型单(){
    modelHint.textContent = '';
    const r = await 取目录(true);   /* 新项目与现有节点同步使用刚读到的目录 */
    if(!r.ok){ modelHint.textContent = 译('模型单读不出来（{error}）—— 还能建,用默认模型', {error: r.message || '?'}); return; }
    模型单 = [];
    modelSel.replaceChildren();
    for(const g of r.value.groups || []){
      const og = document.createElement('optgroup'); og.label = g.name || g.id;
      for(const m of g.models || []){
        const i = 模型单.push({provider: g.id, model: m.id, reasoning: m.reasoning}) - 1;
        const o = document.createElement('option');
        o.value = String(i); o.textContent = m.name || m.id;
        og.append(o);
      }
      if(og.children.length) modelSel.append(og);
    }
    /* 名单不齐要说出来 —— 少一家供应商不报,用户会以为它不存在 */
    const bad = (r.value.failures || []).map(f => f.name || f.id);
    if(bad.length) modelHint.textContent = 译('这几家的名单读不出来:{list}', {list: bad.join(译('、'))});
    /* 没有「默认」这一项(2026-08-30 用户撤的):表上站着的就是要用的那一个。
       预选顺序:上次挑的(还在名单里) → API 管理保存的部署默认 → DeepSeek Flash → 名单头一个。 */
    const 记 = mem.get('studio-新项目-模型');
    let 选 = 记 ? 模型单.findIndex(x => x.provider + '/' + x.model === 记) : -1;
    if(选 < 0 && r.value.default) 选 = 模型单.findIndex(x => x.provider === r.value.default.provider && x.model === r.value.default.model);
    if(选 < 0) 选 = 模型单.findIndex(x => /flash/i.test(x.model) && /vision/i.test(x.model));
    if(选 < 0) 选 = 0;
    if(模型单.length) modelSel.value = String(选);
    projectReasoning.setModel(模型单[+modelSel.value]);
  }
  /* 左边那个预览节点读这张表的名字（模型和档位不读 —— 那一行只摆默认文字） */
  window.npPreview = () => ({ 名字: name.value.trim(), 描述: (desc.value.trim().split('\n')[0] || '').slice(0, 40) });
  modelSel.onchange = () => {
    const pick = 模型单[+modelSel.value];
    if(pick) mem.set('studio-新项目-模型', pick.provider + '/' + pick.model);
    else mem.set('studio-新项目-模型', '');
    projectReasoning.setModel(pick);
  };
  window.npLoadModels = 装模型单;

  /* 边打字边把**真实路径**显出来 —— 「自动建好文件夹」不该是一件用户看不见的事 */
  const path = document.getElementById('np-path');
  /* 名称框保持短占位；目录说明与实时路径统一放在下方。 */
  const showPath = () => {
    const v = name.value.trim();
    path.textContent = v && S.projRoot ? 译('会建在 {path}', {path: `${S.projRoot}/${v}/`}) : 译('项目名称也是文件夹名，项目文件会保存在这个目录中。');
  };
  name.oninput = () => { showPath(); if(S.at.在 === 'draft') 画树(); };
  /* 描述就是 N1 的任务：边写边让左边那张草稿卡的第一行跟着变 */
  desc.oninput = () => { if(S.at.在 === 'draft') 画树(); };
  window.npShowPath = showPath;

  document.getElementById('np-cancel').onclick = closeNewProject;
  /* Esc 收起。**一个项目都没有时不收** —— 收起来你会对着一张空脸,
     那是「空手站着」,这张脸没有这个状态。 */
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape' || $np.hidden || go.disabled) return;
    if(!S.sessions.some(x => !x.parentSession && (!x.projectRootSession || x.projectRootSession === x.id))) return;
    closeNewProject();
  });
  /* 描述里 ⌘/Ctrl+回车 ＝ 提交。回车在描述里是换行 —— 这是一段话,不是一句话 */
  desc.onkeydown = e => { if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); form.requestSubmit(); } };

  form.onsubmit = async e => {
    e.preventDefault();
    if(go.disabled) return;
    const 名字 = name.value.trim(), 描述 = desc.value.trim();
    if(!名字){ npMsg(译('先给它起个名字 —— 这个名字就是文件夹名'), true); name.focus(); return; }
    if(!描述){ npMsg(译('描述不能空 —— 空描述等于又开了一个空对话,那正是这一版要去掉的'), true); desc.focus(); return; }
    if(!projectSkills.ready()){ npMsg(译('skill 名单尚未读取，请重新读取后创建项目'), true); return; }
    if(!projectAttachments.ready()){ npMsg(译('请等待附件读取完成，或移除读取失败的附件'), true); return; }

    const 技能 = projectSkills.values();
    const 附件 = projectAttachments.values();
    go.disabled = true; projectSkills.setBusy(true); projectAttachments.setBusy(true); projectReasoning.setBusy(true);
    const controls = [name, desc, modelSel, document.getElementById('np-cancel'), ...form.querySelectorAll('.np-seg input')];
    controls.forEach(control => control.disabled = true);
    npMsg(译('正在保存 Brief、建文件夹、开座位…'));
    /* 挡名与坐标原文一起送，服务端把原文附在初始用户要求中；各节点继承同一份选择。
       表上的说明就是给模型的要求，不另拼一份品质解释。 */
    const 挡们 = 各挡.map(f => f().名);
    const 当前挡 = 各挡.map(f => f());
    /* 描述也送:服务端拿它落 prompt-0。
       初始用户要求那条消息照旧带全文 —— 这里是给机器的那份,那里是给 Blueprint 看的那份。 */
    /* 挑了模型就带上;选着「默认」就一个字不送 —— 不替部署表态 */
    const pick = 模型单[+modelSel.value];
    const 挑的模型 = pick ? {provider:pick.provider, model:pick.model} : undefined;
    const 档 = projectReasoning.value();
    const r = await fetch('api/project', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({名字, 挡们, 描述, 技能, 附件, 日期: 今天(), 坐标行: 坐标行(当前挡),
                            ...(挑的模型 ? {模型: 挑的模型} : {}), ...(档 ? {档} : {})})}).then(x=>x.json()).catch(e=>({ok:false, message:译('后端不在：')+String(e)}));
    projectSkills.setBusy(false);
    projectAttachments.setBusy(false); controls.forEach(control => control.disabled = false);
    projectReasoning.setBusy(false);
    if(!r.ok){ go.disabled = false; npMsg(r.message || 译('没建成'), true); return; }

    const sid = String(r.value.sessionId);
    go.disabled = false;
    name.value = ''; desc.value = '';
    projectSkills.reset();
    projectAttachments.reset();

    /* 建成了 ＝ 这个坐标从「还没建」变成一个真项目。**先把视线搬过去再说话**,
       这样第一句话是在你眼前长出来的,不是从别处飞进来的。
       不走 closeNewProject —— 那是「不建了」,会把你送回上一个项目。 */
    await 切到({在:'project', 看:sid});
    paintModels();

    /* ⚠️ **这儿不发第一句话。** 2026-09-01 删的,理由是一次真跑的账（大猫超级玛丽）:
       这条 `session.prompt` 排的是 dsh 的 **next-turn** 队列,而 Blueprint 三拍
       **跑在同一个回合里** —— 于是它在队里躺了 9 分 22 秒,等三拍全交完、
       回合一收口才被投出去。Blueprint 眼里那是一条**刚下的新命令**「做一个猫的超级玛丽」,
       于是它开第二个回合把整个项目又做了一遍:执行诊断 v2、达成清单 v1、
       目标图景 v4、路径清单 v2 —— 全是它那条 Helm 带同时在做的东西。

       **删得掉是因为它本来就是第三份。** 那段描述已经两次摆在 Blueprint 眼前:
       ① 落成柜子里的《初始用户要求》,出生包的柜子索引里带着它;
       ② `描述` 原文抄进了《分工手册·0》全文,而出生包第一段就是这份手册的全文。
       所以它不给任何新信息,只贡献了一条延迟九分半的过期命令。

       **别加回来。** 真要在出生那一刻多说一句话,那句话属于**出生包**（弧拼的,
       走 next-step,当场到),不属于这儿。 */
    toast(译('项目「{name}」建好了 —— 文件夹 {cwd}', {name: 名字, cwd: r.value.cwd}));
    /* 模型没换上不拦项目,但必须说 —— 不说的话它一直用默认模型跑,你还以为换过了 */
    if(r.value.模型没换上) toast(译('模型或档位没按表上的来({detail})—— 可在树上「全局」那一行再换', {detail: r.value.模型没换上}));
  };
})().catch(error => { npMsg(译('协作频率载入失败：{error}', {error: String(error.message || error)}), true); });

function toast(msg){
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(), 4000);
}

/* 打开一块料 —— **在「读全文」那个浮层(`#reader`)里开一个标签页,原文摆出来**。
   它是浮层不是一栏:不占流的位置,看完关掉,对话一个像素都没动过。

   两处共用这一份:信息流里点一行、对话流里点一个 context 词块(2026-09-01 加的)。
   写第二份的那天就是两处开始给出不同答案的那天(禁令 10) ——
   而且第二份多半会忘了 `根=项目` 那一格,于是点开是「读不出」。

   `位` 是**相对文档夹的路径**,服务端给的,前端一个字都不拼(路径只有一个出处)。 */
async function 开块(位, 标题){
  let f = null;
  try{
    const r = await fetch('api/file?根=项目&session='+encodeURIComponent(S.at.看||'')
                          + '&位置='+encodeURIComponent(位));
    if(r.ok) f = await r.json();
  }catch(_){ /* 后端不在 —— 下面那句会说 */ }
  wsOpen('blk-'+位, 标题 || 位,
    f && f.ok ? '<pre class="mono" style="white-space:pre-wrap;margin:0">'+esc(f.文)+'</pre>'
              : '<div class="feed-note">'+esc((f&&f.message)||译('读不出'))+'</div>');
}

/* ================= 联动:档案条目 → 工作区标签页 ================= */
function wsOpen(key, title, html, materialRequest){
  const i = S.wtabs.findIndex(t=>t.key===key);
  if(i<0) S.wtabs.push({key, title, html, materialRequest});
  else { S.wtabs[i].html = html; S.wtabs[i].materialRequest = materialRequest; }
  S.wcur = key; drawWs();
}
window.wsClose = key => {
  S.wtabs = S.wtabs.filter(t=>t.key!==key);
  if(S.wcur===key) S.wcur = S.wtabs.length?S.wtabs[S.wtabs.length-1].key:null;
  drawWs();
};
/* 读全文的浮层。流不在这里 —— 流是页面本身(D1),这儿只放它的投影:
   点开的事件、产物、任务书。一个都没打开时整层收掉,流铺满。 */
function drawWs(){
  window.blueprintMaterialContext?.dispose(); window.blueprintMaterialContext = null;
  const box=document.getElementById('reader');
  const tabs=document.getElementById('ws-tabs'), body=document.getElementById('ws-body');
  if(!S.wtabs.length){ box.hidden = true; return; }
  box.hidden = false;
  if(!S.wtabs.find(t=>t.key===S.wcur)) S.wcur = S.wtabs[S.wtabs.length-1].key;
  tabs.innerHTML = S.wtabs.map(t=>`
    <div class="wtab ${t.key===S.wcur?'on':''}" data-wkey="${esc(t.key)}" role="tab" aria-selected="${t.key===S.wcur}" tabindex="${t.key===S.wcur ? 0 : -1}" onclick="S.wcur='${t.key}';drawWs()">
      ${esc(t.title)}<span class="x"
        onclick="event.stopPropagation();wsClose('${t.key}')">×</span>
    </div>`).join('');
  const cur = S.wtabs.find(t=>t.key===S.wcur);
  body.innerHTML = cur ? cur.html : '';
  if(cur?.materialRequest && 产物画廊?.materials) {
    const host = document.createElement('div'); host.className = 'context-materials';
    body.prepend(host);
    window.blueprintMaterialContext = 产物画廊.materials(host, {...cur.materialRequest, hideEmpty:true});
  }
}

/* ================= 分割条:拖动 / 双击复位 / 记在本机 ================= */
function initSplits(){
  const app = document.getElementById('app');
  /* Session 默认减半；迁移旧高度时保留侧栏宽度，随后继续保存用户自己的拖动。 */
  const desktop = window.blueprintLayout?.initial ? window.blueprintLayout : null;
  const DEF = {'--cw':'28%', '--tlh':'12%', ...(desktop?.initial.defaults || {})};
  const KEY = 'studio-split-v3';
  let vals;
  try{
    const saved = desktop ? desktop.initial.values : JSON.parse(mem.get(KEY) || 'null');
    if(saved){ vals = {...DEF, ...saved}; }
    else {
      const previous = JSON.parse(mem.get('studio-split-v2') || '{}');
      const height = parseFloat(previous['--tlh'] || '24%');
      vals = {...DEF, ...previous, '--tlh':(Number.isFinite(height) ? height/2 : 12) + '%'};
    }
  }
  catch(_){ vals = {...DEF}; }
  for(const k in vals) app.style.setProperty(k, vals[k]);
  const save = () => {
    if(desktop){
      try{ if(!desktop.save(vals)) console.warn('分栏比例未能保存'); }catch(_){ console.warn('分栏比例未能保存'); }
    }else mem.set(KEY, JSON.stringify(vals));
  };
  save();

  /* host = 这条分割条切的是谁。默认整页;时间线那条切的是轨迹页,
     比例得对着轨迹页的高算,对着整页算会拖得驴唇不对马嘴。
     变量一律写在 #app 上 —— CSS 变量往下继承,谁读谁拿得到。 */
  const bind = (el, axis, key, host) => {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      el.classList.add('on');
      const r = (host || app).getBoundingClientRect();
      const move = ev => {
        const frac = axis==='x' ? (ev.clientX - r.left)/r.width
                                : (ev.clientY - r.top)/r.height;
        const minimum = axis === 'y' ? 64/r.height*100 : 15;
        const maximum = axis === 'y' ? Math.max(minimum, Math.min(85, (r.height-180)/r.height*100)) : 85;
        vals[key] = (Math.min(maximum, Math.max(minimum, frac*100))).toFixed(1)+'%';
        app.style.setProperty(key, vals[key]);
      };
      const up = () => {
        el.classList.remove('on'); save();
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
    el.addEventListener('dblclick', () => {
      vals[key] = DEF[key]; app.style.setProperty(key, vals[key]); save();
    });
  };
  bind(document.getElementById('vsplit'), 'x', '--cw');
  bind(document.getElementById('tlsplit'), 'y', '--tlh', document.getElementById('pane-trace'));
}
initSplits();

/* 顶栏两个控件:开一个项目 · 换一个项目。**这张脸的全局操作只有这两个。**
   侧栏开关(2026-08-17~08-19 在的那个)摘掉了:左边那栏现在是「一块可以装不同页面的地」,
   节点树只是它的第一个住户 —— 没有理由给它一个关闭按钮。
   `body.side-off` 那两条 CSS 留着(收起来的能力还在,只是没有人叫它了);
   上一版存在本机的那个 off 记忆要**当场清掉**,否则老浏览器一进来就是一片空白。 */
(function initTop(){
  document.body.classList.remove('side-off');
  mem.set('studio-side-off', '');

  /* 「新项目」不直接开会话 —— 它叫出那张表。开会话是提交那一步的事,
     而提交那一步**先建文件夹**:不存在没有文件夹的空对话(2026-08-19 用户裁定)。
     座位名(blueprint)也不在前端 —— 那是组织的事,写在服务端 `blueprint座位` 那一格。 */
  document.getElementById('new-proj').onclick = () => openNewProject();

  document.getElementById('proj-pick').onclick = e => { e.stopPropagation(); 开项目单(); };
  document.getElementById('proj-menu').onclick = async e => {
    e.stopPropagation();
    const row = e.target.closest('.pj-row');
    if(!row) return;
    开项目单(false);
    /* 换项目 ＝ 视线落到那棵树的 Blueprint 上。树画出来之后,再点卡去别的座位。
       从草稿态挑一个真项目也走这一条 —— 草稿是坐标的一种,换坐标就是它 */
    await 切到({在:'project', 看:row.dataset.id});
    /* 模型是**跟着会话走的**,不是跟着页面走的 —— 换了就得重读 */
    paintModels();
  };
  /* 点别处、按 Esc 都收起。Esc 先让给它 —— 它在最上面 */
  document.addEventListener('click', () => { if(S.项目单开) 开项目单(false); });
  window.addEventListener('resize', 摆项目单);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && S.项目单开){ e.stopImmediatePropagation(); 开项目单(false); }
  }, true);
})();
window.BlueprintAPI = {
  currentProject: () => S.at.在 === 'project' ? S.sess : null,
  rememberDefault: (provider, model) => mem.set('studio-新项目-模型', provider + '/' + model),
  applyCurrent: async (provider, model) => {
    if(S.at.在 !== 'project' || !S.sess) throw new Error('请先选择一个项目');
    const result = await rpc('模型.改', { sessionId: S.sess, provider, model });
    if(!result.ok) throw new Error(result.message || '项目模型切换失败');
    await refresh();
  },
};
window.addEventListener('blueprint:apis-updated', async () => {
  目录 = null; 目录再问 = 0;
  await 取目录(true);
  if(S.at.在 === 'draft') await window.npLoadModels?.();
});
