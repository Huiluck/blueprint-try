<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLUEPRINT</title>
<link rel="icon" type="image/png" href="favicon.png?v=graphite-20261001">
<link rel="apple-touch-icon" href="favicon.png?v=graphite-20261001">
<link rel="stylesheet" href="dsh-turn-navigator.css">
<link rel="stylesheet" href="stream.css">
<link rel="stylesheet" href="artifacts.css">
<!-- 节点树的组件样式与显示逻辑＝原件那一份（mirror.html 与本页共用），一个字没改 -->
<link rel="stylesheet" href="mirror.css">
<style>
/* token 来自 DESIGN_GUIDE.md。
   2026-08-17 清场:摘掉四角色/镜像树时代的器官(见文件末尾「清场清单」注释)。
   现在这张脸只剩三样东西:骨架、流、读全文浮层。数据管道等接 dsh。 */
:root{
  --canvas:#FFFFFF; --surface:#FFFFFF; --canvas-overlay-fill:rgba(255,255,255,.72);
  /* 左侧白色画布、右侧淡灰工作底、浅灰页签；全局顶栏单独使用黑白。 */
  --workspace:#F6F6F6; --frame:#F0F0F0; --section:#E9E9E9;
  --header-fill:#000000; --header-ink:#F5F5F5; --header-muted:#B8B8B8;
  --header-line:#777777; --header-hover:#242424;
  --anchor-fill:#595959; --anchor-hover:#656565; --anchor-muted:#D5D5D5;
  --hairline:#E6E6E6; --line-strong:#CFCFCF;
  --ink:#171717; --ink-2:#626262; --ink-3:#707070;
  --sys-fill:#171717;  --sys-border:#9B9B9B;  --sys-ink:#FFFFFF;
  /* 根位置用浅灰节点顶栏与中性边线；品牌、身份边线和选中提示各自取值。 */
  --sys-head:#F0F0F0; --sys-muted:#C7C7C7;
  --brand-border:#171717; --selection-line:#171717;
  --topbar-h:44px; --tabs-h:32px; --trace-head-h:32px;
  /* ===== 节点状态的七组令牌（「节点状态灯」定稿 · 2026-08-28）=====
     色相只有三个：翡翠族＝系统自己在推进 · 暖族＝要你动手 · 碳黑＝结束了；
     中性族无色相。实色只出现在 20px 的状态条上，纸面全都离白不远 ——
     一屏看过去仍然是白的，但每一块颜色都是干净的。
     **身份不再有色相**：色相从「不变的身份」手里收回来，全给了「会变的状态」。 */
  --st-run-rail:#14A177;  --st-run-paper:#FFFFFF;  --st-run-line:#171717;
  --st-done-rail:#62B294; --st-done-paper:#EAF4EF; --st-done-line:#C9E0D6;
  --st-wait-rail:#E9A100; --st-wait-paper:#FFF7E2; --st-wait-line:#EFC24E;
  --st-idle-rail:#B4B4B4; --st-idle-paper:#E4E4E4; --st-idle-line:#B4B4B4;
  --st-ask-rail:#F2601C;  --st-ask-paper:#FFF0E6;  --st-ask-line:#F59A66;
  --st-stop-rail:#D64535; --st-stop-paper:#FFF0EE; --st-stop-line:#F0897C;
  --st-dead-rail:#3C424A; --st-dead-paper:#22252A; --st-dead-line:#363B41;
  /* ===== 家具自己的「坏了 / 要你看一眼」—— **无色相** =====
     颜色是节点状态的，家具一分不占。它靠明度、线宽说话：
     正常文字 --ink-2，坏了的 --bad-ink（墨到底）；正常边线 --hairline，坏了的
     --bad-line（重三档）；--bad-solid 是整块反白的错误卡。
     2026-08-28：这一组是从 `--hold-*` 手里换下来的 —— 那是四角色时代节点身份的
     粉色，被界面借去当"出错"，**一个颜色两个意思**，连同 --plan-* / --go-* /
     --rise-* / --stop-card 一起删干净了。 */
  --bad-fill:#F5F5F5; --bad-line:#707070; --bad-ink:#171717;
  --bad-solid:#333333; --bad-solid-ink:#FFFFFF;
  /* 轨迹表那几种 tag：靠**明度**分，不靠色相（原来借的是三种节点身份色）。 */
  --tag-ctx:#EDEDED; --tag-msg:#F5F5F5; --tag-tool:#E0E0E0; --tag-line:#CFCFCF;
  --pass:#2E7D43; --pass-tint:#E3F0E6;
  --chip:#F5F5F5;
  --edge-live:#B8B8B8; --edge-plan:#C8C8C8; --edge-dead:#4F4F4F;
  --edge-goal:#8A8A8A;
  --grid-minor:rgba(23,23,23,.035); --grid-major:rgba(23,23,23,.075);
  --font-ui:-apple-system,system-ui,"PingFang SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  /* stream.css 要的四个别名(对话流渲染器用的那几个)。
     色令牌两边同名,只有纸、两族字面、基线律在这边叫别的名字。 */
  --paper:var(--canvas);
  --font-text:var(--font-ui);
  --font-mach:var(--font-mono);
  --base:24px;    /* 一切竖向尺寸是它的整数倍或半数 */
}
*{box-sizing:border-box}
button,input,select,textarea{border-radius:0}
:where(button,input,select,textarea,a,[role="button"],[role="tab"],summary):focus-visible{outline:2px solid var(--selection-line);outline-offset:2px}
.ptab.pin:focus-visible{outline-color:var(--header-ink);outline-offset:-3px}
#np-name:focus-visible,#np-desc:focus-visible,#np-model:focus-visible{outline:2px solid var(--selection-line);outline-offset:2px}
body{margin:0;background:var(--canvas);color:var(--ink);
     font:13px/1.5 var(--font-ui);font-variant-numeric:tabular-nums;overflow:hidden}
.mono{font-family:var(--font-mono)}

/* ================= 骨架:流是页面(STREAM-02 D1) =================
   主位是一条流,通栏可读;**右列一个字不动** —— 它就是对话(以及轨迹/信息流/身份)。
   流不可收起,它是地基,不是一个视图。

   **左列 2026-08-20 改成一块「可以装不同页面的地」**(用户裁定):
   顶上一条页签栏,点哪个页签,左列就整块显示哪个。节点树的页签**钉在最左、
   关不掉**,但可以被切走 —— 它只是不下岗。以后的文件树、md 阅读都进这块地,
   **加一个 = `左住户` 那张表里加一行**,别处一个字不改(协议 0.4)。

   **右列 2026-08-26 也变成同一种表**(`右住户`:对话/轨迹/信息流/身份)。
   在这之前那三个页签是硬写在 buildFlow 的 innerHTML 里的,加第四个要改三处。

   **切页签只藏不擦**:住户的 DOM 一直挂着,切换只改 hidden。

   position:fixed 而不是 height:100vh —— 嵌入式预览面板里 vh 可能被虚报,
   fixed+inset 始终贴住真实可视区,普通浏览器行为一致。
   顶栏通栏一行;左列是那块地,右列是流,中间 6px 分割条。
   拖动写 localStorage,每台电脑记自己的;双击分割条恢复默认。 */
#app{display:grid;position:fixed;inset:0;
     grid-template-columns:minmax(200px,var(--cw,28%)) 6px minmax(360px,1fr);
     grid-template-rows:var(--topbar-h) minmax(0,1fr)}
#topbar{grid-column:1 / span 3;grid-row:1;display:flex;align-items:center;gap:14px;
        padding:0 16px;background:var(--header-fill);color:var(--header-ink);
        border-bottom:1px solid var(--header-fill);overflow:hidden}
/* macOS controls occupy the first 80px of the app's existing brand row. */
html.desktop-mac #topbar{padding-left:94px;-webkit-app-region:drag}
html.desktop-mac #topbar :is(button,select,input,a,#proj-menu){-webkit-app-region:no-drag}
@media (min-width:901px){
  html.desktop-mac #app{grid-template-columns:minmax(200px,calc(var(--cw,50%) - 3px)) 6px minmax(360px,1fr)}
}
/* overflow:hidden 是兜底:里面任何一块长过左列宽度,都必须自己滚,不许溢到流上面去 */
#side{grid-column:1;grid-row:2;display:flex;flex-direction:column;
      min-height:0;min-width:0;overflow:hidden;background:var(--canvas)}
/* 住户同住这一格,靠 hidden 露一个。min-*:0 —— flex 子项默认 min-size:auto,内容会撑破它 */
#leftbody{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0}
#tree-pane{flex:1;position:relative;overflow:hidden;min-width:0}
#tree-pane[hidden]{display:none}
/* 左列打开的一页(文件正文等):跟节点树平级的一块地 */
.leftpage{flex:1;overflow:auto;min-height:0;padding:12px 14px;background:var(--surface)}
.leftpage[hidden]{display:none}
.lp-head{display:flex;align-items:baseline;gap:10px;
         padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid var(--hairline)}
.lp-path{flex:1;min-width:0;font:11px var(--font-mono);color:var(--ink-3);word-break:break-all}
/* 保存:就在标题行右端(用户 2026-08-21 指的位置)。家具,无色 */
.lp-save{flex:none;font:11px var(--font-mono);padding:3px 9px;cursor:pointer;
         background:transparent;border:1px solid var(--line-strong);color:var(--ink-2)}
.lp-save:hover:not([disabled]){color:var(--ink);border-color:var(--ink-2)}
.lp-save[disabled]{opacity:.4;cursor:default}
.lp-msg{flex:none;font:11px var(--font-mono);color:var(--ink-3);
        max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-note{font:11px var(--font-mono);color:var(--ink-3);line-height:1.7}
/* ================= 摆出来那扇窗（2026-09-03） =================
   跟隔壁读文件那一页**是同一种住户**,只是它不排版:里面是一个活的 iframe。
   所以它借的是 `.leftpage`,只加一个 `frame` 把留白和滚动让出去 ——
   页里那一屏自己会滚,外面再滚一层就是框中框。
   判据(协议 0.4):以后要摆的不是 html 而是一张图、一份 pdf,要不要改这儿?不要。 */
/* ⚠️ `:not([hidden])` 不是装饰：`.leftpage[hidden]{display:none}` 跟 `.leftpage.frame`
   **权重一模一样**(两个都是"一类一属性/两类")，谁写在后面谁赢 —— 这条在后面，
   于是藏着的那一页照样 display:flex，摞在节点树底下(2026-09-03 实机撞见)。 */
.leftpage.frame:not([hidden]){padding:0;overflow:hidden;display:flex;flex-direction:column}
.leftpage.frame .lp-head{padding:8px 12px;margin:0}
/* 白底是**故意的**:摆出来的是用户的产物,不该跟着这张脸的皮肤走 ——
   他要看的是它自己在浏览器里长什么样,不是它在我们这儿长什么样。 */
.leftpage.frame iframe{flex:1;min-height:0;width:100%;border:0;background:#fff;display:block}
.leftpage.frame .lp-video{flex:1;min-height:0;width:100%;object-fit:contain;background:#171717}
.leftpage.frame .lp-audio{width:calc(100% - 32px);margin:32px 16px}
.leftpage.frame .lp-img{flex:1;min-height:0;width:100%;object-fit:contain;background:#fff}
.leftpage.frame .lp-preview-error{padding:12px;margin:0;flex:none}
/* 标题行右端那两个:一个按钮一个链接,长一个样(家具,无色) */
a.lp-save{text-decoration:none;line-height:1.6}
/* 不是 md 的:原文照打,不排版、不美化 —— 它是文件,不是文章 */
.lp-raw{margin:0;white-space:pre-wrap;word-break:break-word;
        font:11.5px/18px var(--font-mono);color:var(--ink)}
/* 可以改的那种:**它就是一页普通文档**,不是一个表单 ——
   没有框、没有底色、没有等宽字,跟隔壁读文件那一页同一副字面(15px/24px)。
   高度跟着内容长,不自己滚(整页滚) —— 一个会滚的框中框读起来最难受。
   给的仍是**原文**:模型读到的就是这些字符,排一次版再让你改,
   你改的就不是它读的那份了(暗层)。 */
.lp-doc{display:block;width:100%;resize:none;overflow:hidden;padding:0;margin:0;
        font:15px/24px var(--font-ui);color:var(--ink);background:transparent;border:none;
        white-space:pre-wrap;word-break:break-word}
.lp-doc:focus{outline:none}
.lp-doc:focus-visible{outline:2px solid var(--selection-line);outline-offset:-2px}
#tree-scroll{position:absolute;inset:0;overflow:auto}
#flow{grid-column:3;grid-row:2;display:flex;flex-direction:column;
      min-height:0;min-width:0;background:var(--workspace)}
/* 侧栏收起:流铺满。左列是投影,收起来不丢任何东西 —— 流里全都有 */
body.side-off #app{grid-template-columns:0 0 1fr}
body.side-off #side,body.side-off #vsplit{display:none}

/* 顶栏:项目计量 + 等你几件 + 授权台账。全是家具,无色 */
#topbar .brand{display:inline-flex;align-items:center;height:32px;
  background:transparent;color:var(--header-ink);border:1px solid transparent;
  padding:0 9px;flex:none}
.brand-wordmark{width:162px;height:28px;display:block;flex:none}
.brand-mark{width:15px;height:20px;display:block;flex:none}
#topbar .meta{font:11px var(--font-mono);color:var(--header-muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;cursor:default}
/* 顶栏的项目费用提亮一档。它是仪表，状态色仍只用于节点当前状态。 */
#topbar .meta b{font-weight:400;color:var(--header-ink)}
/* 算不出钱时那个「—」用虚线下划线说明另有信息。 */
#topbar .meta b.void{border-bottom:1px dotted var(--header-muted)}
#topbar .spacer{flex:1}
#topbar button{font:11px/18px var(--font-mono);letter-spacing:.5px;min-height:28px;padding:4px 10px;
  cursor:pointer;background:transparent;border:1px solid var(--header-line);
  color:var(--header-muted);flex:none}
/* 辅助工具用亮字、600 字重和清楚的 1px 边线保持可发现性。 */
#topbar :is([data-root],[data-api-open]){font-weight:600;color:var(--header-ink)}
#topbar button:hover{color:var(--header-ink);border-color:var(--header-muted);background:var(--header-hover)}
#topbar button:active{border-color:var(--header-ink);background:var(--header-hover)}
#topbar :is(button,select):focus-visible{outline-color:var(--header-ink)}
/* 项目与 API 入口采用白底黑字，品牌与其他辅助工具融入黑底。 */
#topbar :is(#new-proj,#api-manage){background:var(--surface);border-color:var(--surface);color:var(--ink)}
#topbar :is(#new-proj,#api-manage):hover{background:var(--header-ink);border-color:var(--header-ink)}
#topbar :is(#new-proj,#api-manage):active{background:var(--hairline);border-color:var(--hairline)}
/* 项目列表。按钮跟旁边按钮同一套家具；点是唯一有色的一笔 —— 它说的是状态（在跑），不是身份。
   空心＝停着；实心呼吸＝整棵树里有一格在跑。呼吸借「live」那颗点的 rnpulse，不另开动效。 */
#proj-wrap{position:relative;flex:none}
#topbar #proj-pick{display:inline-flex;align-items:center;gap:7px;width:183px;max-width:300px;
  letter-spacing:0;padding:3px 8px;background:var(--surface);border-color:var(--surface);color:var(--ink)}
#topbar #proj-pick:hover{background:var(--header-ink);border-color:var(--header-ink)}
#topbar #proj-pick:active{background:var(--hairline);border-color:var(--hairline)}
#proj-pick .pj-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
#proj-pick .pj-caret{flex:none;color:var(--ink-2);font-size:8px}
.pj-dot{flex:none;width:7px;height:7px;border-radius:50%;box-sizing:border-box;
  border:1px solid var(--ink-3);background:transparent}
.pj-dot.run{border-color:var(--st-run-rail);background:var(--st-run-rail);
  animation:rnpulse 1.8s ease-in-out infinite}
#proj-pick .pj-dot:not(.run){border-color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){ .pj-dot.run{animation:none} }
/* **fixed，不是 absolute**：顶栏是 `overflow:hidden`（挡住里面任何长过左列的东西），
   贴在它里面的浮层会被整个剪掉（09-18 实机：弹出来卡在后面）。位置开的时候按按钮量，
   跟抽屉、读全文浮层同一套 —— 浮层一律浮在页面上层，不待在家具里面。 */
#proj-menu{position:fixed;z-index:30;
  min-width:320px;max-width:min(460px,80vw);max-height:70vh;overflow:auto;padding:4px 0;
  background:var(--surface);border:1px solid var(--line-strong);
  box-shadow:0 4px 16px rgba(23,23,23,.10)}
#proj-menu[hidden]{display:none}
.pj-row{display:flex;align-items:center;gap:9px;padding:5px 12px;cursor:pointer;
  font-size:12px;color:var(--ink-2);white-space:nowrap}
.pj-row:hover{background:var(--chip);color:var(--ink)}
.pj-row.cur{background:var(--chip);color:var(--ink)}
.pj-row .pj-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.pj-row .pj-t{flex:none;font:11px var(--font-mono);color:var(--ink-3)}
.pj-empty{padding:8px 12px;font:11px var(--font-mono);color:var(--ink-3)}
/* 顶栏下拉:跟按钮同一套家具语言 —— 家具无色(DESIGN_GUIDE 第四章) */
#topbar select{font:11px var(--font-mono);padding:3px 6px;cursor:pointer;max-width:280px;
  background:var(--header-fill);border:1px solid var(--header-line);color:var(--header-muted);flex:none;color-scheme:dark}
#topbar select:hover{color:var(--header-ink);border-color:var(--header-muted)}

/* 读全文:浮层。点开的事件、产物、任务书都落这儿 —— 不占流的位置 */
#reader{position:fixed;right:0;top:var(--topbar-h);bottom:0;width:min(560px,52vw);z-index:12;
        display:flex;flex-direction:column;background:var(--surface);
        border-left:1px solid var(--line-strong);
        box-shadow:-2px 0 12px rgba(23,23,23,.08)}
#reader[hidden]{display:none}

/* ================= 右抽屉:顶栏「文件」点开的那一列 =================
   贴右、通高、左缘一条实线、一层浅影。**它盖在工作区上面** ——
   抽屉是"我看一眼",不是一块常驻的脸,所以它不进 #app 那张网格,不推别人,
   也不占页签栏上的一格(占了就该做成住户,那是另一件事)。
   家具无色(DESIGN_GUIDE 一之 1)、直角(禁令)。 */
#drawer{position:fixed;right:0;top:var(--topbar-h);bottom:0;width:min(320px,30vw);z-index:11;
        display:flex;flex-direction:column;background:var(--surface);
        border-left:1px solid var(--line-strong);
        box-shadow:-2px 0 12px rgba(23,23,23,.08)}
#drawer[hidden]{display:none}
#dw-head{flex:none;display:flex;align-items:center;height:28px;padding:0 6px 0 12px;
         border-bottom:1px solid var(--hairline);background:var(--frame)}
#dw-title{font-size:11px;letter-spacing:1px;color:var(--ink);flex:1;min-width:0;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dw-head button{font:11px/1 var(--font-mono);padding:3px 7px;cursor:pointer;flex:none;
        background:transparent;border:1px solid transparent;color:var(--ink-3)}
#dw-head button:hover{color:var(--ink);border-color:var(--hairline)}
#dw-body{flex:1;overflow:auto;min-width:0;padding-bottom:10px}
/* 顶栏展开的工具用深灰底与亮字标出当前状态。 */
#topbar button.on{color:var(--header-ink);border-color:var(--header-muted);background:var(--header-hover)}

/* 文件树:一行一个,缩进靠 padding-left(深度 × 14px),没有连线 ——
   连线是装饰,缩进已经把层级说清楚了 */
.fz-abs{padding:7px 12px 6px;border-bottom:1px solid var(--hairline);
        font:11px var(--font-mono);color:var(--ink-3);word-break:break-all}
.fz-row{display:flex;align-items:center;gap:5px;padding:3px 12px;font-size:12px;
        color:var(--ink-2);white-space:nowrap;cursor:pointer}
.fz-row.dir{color:var(--ink)}
/* 已经在左边开着的那个文件:标出来,不然点了没反应会以为坏了 */
.fz-row.open{color:var(--ink);background:var(--chip)}
.fz-row:hover{background:var(--chip)}
.fz-tw{flex:none;width:10px;font:9px/1 var(--font-mono);color:var(--ink-3);text-align:center}
.fz-n{min-width:0;overflow:hidden;text-overflow:ellipsis}
.fz-note{padding:10px 12px;font:11px var(--font-mono);color:var(--ink-3);line-height:1.7}

/* 文件浏览器：头部固定，目录树独立滚动；每行 24px，供视口绘制准确定位。 */
#dw-body.fz-body{display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
.fz-body > .fz-abs,.fz-body > .fz-note,.fz-root{flex:none}
.fz-root{display:flex;align-items:center;gap:7px;padding:10px 12px 2px;font-size:12px}
.fz-root strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fz-ico{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linejoin:round}
#dw-tree{flex:1;min-height:0;overflow:auto;overflow-anchor:none}
#dw-tree .fz-row,#dw-tree .fz-status{height:24px;box-sizing:border-box;padding-top:0;padding-bottom:0}
#dw-tree .fz-row:focus-visible{outline:1px solid var(--ink-3);outline-offset:-1px}
.fz-status{display:flex;align-items:center;padding-right:12px;font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fz-status[data-retry]{cursor:pointer}

/* 工具开关那一列。开关无色（家具），关着的那一行整行退到三档墨 */
.tb-row{gap:8px}
.tb-row:not([data-f]){cursor:default}
.tb-sw{flex:none;margin:0;width:13px;height:13px;cursor:pointer;accent-color:var(--ink)}
.tb-sw:disabled{cursor:default;opacity:.45}
.tb-row.off .fz-n{color:var(--ink-3)}
.skill-status{padding:0 12px 8px 33px;font-size:12px;line-height:1.5;color:var(--ink-3);overflow-wrap:anywhere}
.skill-state{margin-left:auto;flex:none;font-size:11px;color:var(--ink-3)}
.skill-cards{display:grid;gap:10px;padding:0 12px 12px}
.skill-card{padding:12px;border:1px solid var(--hairline);background:var(--canvas);min-width:0}
.skill-card:has(input:checked){border-color:var(--ink-2);background:var(--chip)}
.skill-card-heading{display:flex;align-items:center;gap:8px;min-width:0}
.skill-card .skill-card-name{padding:0;min-height:0;white-space:normal;text-align:left;border:0;background:none;font:600 13px/20px var(--font-ui);color:var(--ink)}
.skill-card-name:hover{text-decoration:underline}
.skill-card .skill-state{margin:0;font:11px/17px var(--font-ui)}
.skill-card-id{margin:3px 0;font:10px/16px var(--font-mono);color:var(--ink-3)}
.skill-card-description{font:12px/18px var(--font-ui);color:var(--ink-2);overflow-wrap:anywhere}
.skill-card .skill-status{margin-top:8px;padding:8px 0 0;border-top:1px solid var(--hairline);font:11px/17px var(--font-ui)}
.tb-tag{flex:none;margin-left:auto;font:9px/1 var(--font-mono);color:var(--ink-3);
        border:1px solid var(--hairline);padding:2px 4px}

/* 「在跑」那个钮左侧的圆点常驻：空着时白色空心，运行时翡翠实心呼吸。
   数字只在后台有任务时出现，不显示常驻的「0」。
   动效:只动 opacity 的连续插值,1.8s ease-in-out(DESIGN_GUIDE 四·3,
   2026-09-08 用户点名要的第三份动效,理由和形态写在那一节)。 */
#dw-run{display:inline-flex;align-items:center;gap:6px}
#dw-run .rn-live{flex:none;width:7px;height:7px;border-radius:50%;
        border:1px solid var(--header-muted);background:transparent}
#dw-run .rn-live.run{border-color:var(--st-run-rail);background:var(--st-run-rail);
        animation:rnpulse 1.8s ease-in-out infinite}
@keyframes rnpulse{0%,100%{opacity:.22} 50%{opacity:1}}
#dw-run .rn-num{flex:none;color:var(--header-ink);font-variant-numeric:tabular-nums}
/* 关掉动效的机器上:点还在(它说的是"有东西在跑",那是信息),只是不呼吸了 */
@media (prefers-reduced-motion: reduce){ #dw-run .rn-live.run{animation:none;opacity:.85} }

/* 「在跑」那一列:一行一件东西。跟文件树同一副骨架(一行就是一行),
   多的只有右边那个「停」—— 这一列的全部意义就是那一下点得着。 */
.rn-row{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 12px;font-size:12px;
        color:var(--ink-2);white-space:nowrap;border-bottom:1px solid var(--hairline)}
.rn-row:hover{background:var(--chip)}
.rn-k{flex:none;font:9px/1 var(--font-mono);letter-spacing:1px;color:var(--ink-3)}
.rn-n{flex:none;color:var(--ink);max-width:38%;overflow:hidden;text-overflow:ellipsis}
.rn-d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink-3);font-size:11px}
.rn-t{flex:none;font:11px var(--font-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.rn-x{flex:none;font-size:11px;padding:1px 7px;color:var(--ink-2);cursor:pointer;
      background:var(--surface);border:1px solid var(--hairline)}
.rn-x:hover{background:var(--bad-fill);border-color:var(--bad-ink);color:var(--bad-ink)}
.rn-x:disabled{cursor:default;opacity:.5}

/* 分割条:家具。静息是 1px 发丝线,悬停/拖动加重 */
.split{position:relative;z-index:6;background:var(--frame)}
#vsplit{grid-column:2;grid-row:2;cursor:col-resize}
#vsplit::after{top:0;bottom:0;left:2px;width:1px}

/* 面板页签行:家具,无色。**左右各有一条,共用这一套样式**(左:住户;右:对话/轨迹/信息流/身份)。
   左列窄(28%),这一行只准占一行 —— 挤不下就自己横滚,不换行(换行会把下面那块地顶走)。 */
.paneltabs{display:flex;align-items:center;height:var(--tabs-h);flex:none;overflow-x:auto;
           border-bottom:1px solid var(--hairline);background:var(--frame)}
.ptab{padding:0 14px;height:100%;display:flex;align-items:center;font-size:11px;
      letter-spacing:.5px;color:var(--ink-3);cursor:pointer;white-space:nowrap;flex:none;
      border-right:1px solid var(--hairline)}
.ptab:hover{color:var(--ink);background:var(--chip)}
.ptab.on{color:var(--ink);background:var(--canvas);
         box-shadow:inset 0 -2px 0 var(--selection-line)}
/* 节点树是常驻工作区入口，用中灰底与 B 标识；选中时增加白色短线。
   横向滚动文件页签时入口仍留在左侧，其他页签保持原有切换与关闭行为。 */
.ptab.pin{position:sticky;left:0;z-index:1;border-right:0;margin-right:8px;
          padding:0 14px;width:110px;min-width:110px;justify-content:center;gap:8px;
          font-size:11px;font-weight:600;letter-spacing:1px;
          background:var(--anchor-fill);color:var(--header-ink)}
.ptab.pin .brand-mark{width:12px;height:16px}
.ptab.pin:hover{color:var(--header-ink);background:var(--anchor-hover)}
.ptab.pin.on{background:var(--anchor-fill);color:var(--header-ink);box-shadow:none}
.ptab.pin.on::after{content:'';position:absolute;bottom:0;left:calc(50% - 14px);
                   width:28px;height:2px;background:var(--header-ink)}

/* ---- 右列页签行最左那块铭牌:**右边这一列此刻装的是哪一格** ----
   2026-09-10 用户要的:右边这一列翻着翻着就不知道在看谁了(树在左边,眼睛要跑一趟
   去数哪张卡带着选中框)。所以把答案钉在它自己头上,**永久驻扎、切页签不动**。

   它**不是页签**(没有 data-tab；Sub 的父节点编号可点击返回) —— 页签是"给你一块地的几种排法",
   而这块牌子回答的是"这些排法排的是谁",不同的一类东西。
   中灰铭牌标出当前节点，浅色页签表示正在阅读的页面。

   三格:号 · 类型 · 名字。号与名字用白字，类型用浅灰字；细竖线分开各字段。
   名字长了自己兜省略号 —— 牌子不许把后面那几个页签挤出屏幕。 */
.nplate{flex:0 1 auto;display:flex;align-items:center;height:100%;
        padding:0 12px;min-width:0;overflow:hidden;cursor:default;
        background:var(--anchor-fill);color:var(--header-ink)}
.nplate > :not(:first-child){border-left:1px solid rgba(255,255,255,.24);
                           padding-left:10px;margin-left:10px}
.nplate i{font:600 11px/14px var(--font-mono);letter-spacing:1px;
          color:var(--header-ink);flex:none;text-transform:uppercase}
.nplate em{font:11px/14px var(--font-mono);letter-spacing:.5px;font-style:normal;
           color:var(--anchor-muted);flex:none;text-transform:uppercase}
.nplate b{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.5px;
          min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nplate.sub{padding:0 8px}
.nplate.sub > :not(:first-child){padding-left:6px;margin-left:6px}
.nplate .nplate-parent{flex:none;max-width:80px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;border:0;padding:0;background:transparent;color:var(--header-ink);
  font:600 11px/14px var(--font-mono);cursor:pointer;text-transform:uppercase}
.nplate-parent .arrow{margin-left:4px;font-weight:400;color:var(--header-muted)}
.nplate-parent:hover{text-decoration:underline;text-underline-offset:3px}
.nplate-parent:focus-visible{outline:1px solid var(--header-ink);outline-offset:3px}
.nplate-parent:disabled{cursor:default;text-decoration:none}
/* 说不清的时候(还没建项目 / 这个会话不在树上):**照实说,不留空牌子** ——
   空着跟"根本没有这块牌子"看起来一样,而这两件事不一样。 */
.nplate.void{color:var(--anchor-muted)}
.nplate.void b{font-weight:400;letter-spacing:0}
/* 当前节点身份与用量在左边相接，身份深灰底、用量白底；页签靠右。 */
.paneltabs .tabgap{flex:1;min-width:8px}
.ptab .x{margin-left:6px;color:var(--ink-3);font-size:12px;padding:0 2px}
.ptab .x:hover{color:var(--ink)}
.paneltabs .who{margin-left:auto;padding:0 10px;font:11px var(--font-mono);color:var(--ink-3);
           min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split::after{content:'';position:absolute;background:var(--hairline);
              transition:background 140ms ease-out}
.split:hover::after,.split.on::after{background:var(--line-strong)}


/* ================= 左上:节点树 =================
   **组件样式全在 mirror.css，显示逻辑全在 mirror-render.js**（都是原件那一份）。
   这里只写页面家具:白板的网格底与画布工具 —— 照旧版 mirror.html
   的 #stage。卡片长什么样、怎么排、虚实生死，一个字都不在这一页里。 */
/* 画板**至少铺满这一栏**:白板是底,不是内容的影子。
   不加这两行,stage 的尺寸就等于内容尺寸(渲染器按树算的),于是网格只有上面
   薄薄一条,整棵树贴着顶 —— 2026-08-19 用户指出的那个"鬼样子"。 */
/* 画布层:网格画在这儿,**四周留出大片空白** —— 无限画布的"无限"就是这片留白,
   树在哪儿都能把它拖到眼前。网格随缩放一起放大,不然缩放起来像在换分辨率。 */
#tree-canvas{position:relative;background-color:var(--canvas);
  background-image:
    linear-gradient(to right,  var(--grid-major) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-major) 1px, transparent 1px),
    linear-gradient(to right,  var(--grid-minor) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-minor) 1px, transparent 1px)}
#tree-scroll{cursor:grab}
#tree-scroll.panning{cursor:grabbing}
#tree-scroll.panning .card,#tree-scroll.panning .goal{pointer-events:none}
/* 放大用 zoom 清晰绘字；缩小用 transform，避免最小字号限制挤坏卡片。 */
#tree-stage{position:absolute;transform-origin:0 0}
/* 空态时舞台没有宽度（砖才撑得开它），那句话会被挤成一行两个字 —— 让它铺满画布 */
#tree-stage:has(> .stage-empty){inset:0}
#tree-wires{position:absolute;inset:0;pointer-events:none}
.stage-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:0 18px;color:var(--ink-3);font-size:12px;text-align:center;line-height:2}

/* 画布控制条：钉在树栏左下角竖排。缩放读数居中，回中单独成组；
   半透明白底、灰边与直角沿用界面家具，文字保持实色，平移缩放时位置固定。 */
#tree-tools{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;align-items:center;
  padding:2px;z-index:5;background:var(--canvas-overlay-fill);border:1px solid var(--line-strong);
  box-shadow:0 2px 8px rgba(23,23,23,.06)}
#tree-tools button{display:flex;align-items:center;justify-content:center;flex:none;
  width:34px;height:26px;padding:0;background:transparent;border:0;
  font:500 11px/1 var(--font-mono);color:var(--ink-2);cursor:pointer}
#tree-tools button:hover{background:var(--frame);color:var(--ink)}
#tree-tools button:active{background:var(--section)}
#tree-tools button:focus-visible{outline-offset:-2px}
#tree-tools svg{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;
  stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
#tree-tools #tz-pct{color:var(--ink);font-variant-numeric:tabular-nums}
#tree-tools .tree-tools-separator{width:22px;height:1px;margin:2px 0;
  background:var(--hairline)}
#tree-tools #tz-home{height:30px;flex-direction:column;gap:3px;
  font:500 10px/1 var(--font-ui)}
/* 计数牌：贴着树栏的左上角（2026-09-16 用户定），整棵树一眼的状况。
   家具（半透明白底细边），文字保持实色，颜色只在每项前面那颗小方块上，跟砖的状态条同一套令牌。
   不接鼠标 —— 它压在画布上，不许挡拖动。 */
/* 竖着排（2026-09-16 用户：横着不好看）：一项一行，名字靠左、数字靠右对齐成一列；
   「总节点」那行在最上面，底下一道细线隔开五个状态。 */
#tree-stats{position:absolute;left:8px;top:8px;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;gap:3px;width:112px;padding:6px 10px;
  background:var(--canvas-overlay-fill);border:1px solid var(--hairline);
  font:11px/14px var(--font-ui);color:var(--ink-2);white-space:nowrap}
#tree-stats span{display:flex;align-items:center}
#tree-stats span:first-child{padding-bottom:4px;margin-bottom:1px;border-bottom:1px solid var(--hairline);color:var(--ink)}
#tree-stats b{margin-left:auto;font:600 11px/14px var(--font-mono);color:var(--ink)}
#tree-stats i{display:inline-block;width:8px;height:8px;margin-right:6px;flex:none}
#tree-stats .zero{color:var(--ink-3)}
#tree-stats .zero b{color:var(--ink-3);font-weight:400}
/* 两栏空态:座位还没跑起来,这里如实为空 —— 不猜、不造、不放假数据 */
.pane-empty{position:absolute;inset:0;display:flex;align-items:center;
            justify-content:center;padding:0 18px;
            color:var(--ink-3);font-size:12px;
            text-align:center;line-height:2}

/* 读全文浮层用的几条(原左下档案区留下的,那一栏 2026-08-20 拆了) */
.d-empty{color:var(--ink-3);font-size:12px;padding:20px 0;text-align:center}
.d-sec{font-size:11px;letter-spacing:1px;color:var(--ink-3);margin:12px 0 4px;
       text-transform:uppercase}
.d-raw{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.65;
       background:var(--canvas);border:1px solid var(--hairline);border-radius:0;
       padding:8px 10px}

/* ================= 右侧工作区 ================= */
#ws-body{flex:1;overflow:auto;padding:24px}
#ws-tabs{display:flex;align-items:center;height:var(--tabs-h);flex:none;overflow-x:auto;
         border-bottom:1px solid var(--hairline);background:var(--frame)}
.wtab{padding:0 12px;height:100%;display:flex;align-items:center;gap:6px;
      font-size:11px;color:var(--ink-2);cursor:pointer;white-space:nowrap;
      border-right:1px solid var(--hairline)}
.wtab:hover{color:var(--ink);background:var(--chip)}
.wtab.on{color:var(--ink);background:var(--canvas);
         box-shadow:inset 0 -2px 0 var(--selection-line)}
.wtab .x{color:var(--ink-3);font-size:12px;padding:0 2px}
.wtab .x:hover{color:var(--ink)}

/* ================= 对话页(工作区常驻页) =================
   流的身体由 stream-render.js 建、stream.css 管 ——
   这里只管它在工作区里的容器:骨架、任务头、输入条。流内部一档都不碰。
   这一页的 DOM 常驻(切页签只藏不擦):流是有状态的,擦一次就全没了。 */
/* 度量:流内 15px,纸面 728px 含两侧 24px 留白，正文仍最多 680px。
   再宽读不动,再窄多滚一屏 —— 两头都是密度的敌人。 */
.chat-log{flex:1;overflow:auto;padding:24px;background:var(--workspace);scrollbar-width:none}
.chat-log::-webkit-scrollbar{display:none;width:0;height:0}
#pane-chat:has(.turn-nav-slot:not([hidden])) .chat-log{padding-right:42px}
#chat-stream{max-width:728px;min-height:100%;margin:0 auto;padding:20px 24px;
  background:var(--workspace)}
/* 分割线通栏、内容居中对齐流的度量:横向内边距吃掉两边多出来的地方 */

/* 输入区：文字与附件在一张纸上，下沿左侧添加附件，右侧选择模型并发送。 */
.composer{flex:none;background:var(--workspace);padding:12px max(24px,calc(50% - 364px))}
.composer-shell{border:1px solid var(--line-strong);background:var(--surface);padding:12px}
.composer [hidden]{display:none!important}
.composer-shell:focus-within{border-color:var(--ink)}
.composer-shell:has(textarea:focus-visible){outline:2px solid var(--selection-line);outline-offset:2px}
.composer-shell.dragover{outline:2px solid var(--selection-line);outline-offset:2px;background:var(--chip)}
.composer textarea{display:block;width:100%;min-height:48px;max-height:160px;resize:none;
  border:0;background:transparent;color:var(--ink);font:15px/24px var(--font-ui);
  padding:0 4px 8px;overflow-y:auto}
.composer textarea:focus-visible{outline:none}
.composer .crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.goal-panel{margin-top:6px;color:var(--ink-2);font:12px/1.5 var(--font-ui)}
.goal-panel summary{cursor:pointer;width:fit-content}
.goal-panel .goal-body{padding-top:8px}
.goal-panel .goal-state{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:6px}
.goal-panel label{display:block;margin:6px 0}
.goal-panel input{width:100px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);padding:4px}
.goal-panel .goal-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.goal-panel .goal-error{color:var(--bad-ink);white-space:pre-wrap}
.features-panel .features-body{padding-top:8px}
.features-panel input[type="checkbox"]{width:auto;margin-right:4px}
.composer .crow .gap{flex:1;min-width:4px}
.composer :is(select,button){font:12px/18px var(--font-ui);color:var(--ink-2);background:transparent;
  border:1px solid transparent;min-height:32px;padding:6px 8px;max-width:190px;cursor:pointer}
.composer :is(select,button):hover:not(:disabled){background:var(--chip);color:var(--ink)}
.composer :is(select,button):active:not(:disabled){background:var(--hairline)}
.composer :is(select,button):disabled{color:var(--ink-3);cursor:default}
.composer .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;padding:6px;flex:none}
.composer svg{width:18px;height:18px;display:block;flex:none}
.composer-models{display:flex;align-items:center;gap:2px;max-width:100%;margin-left:auto;min-width:0}
.composer #pick-model{max-width:180px;min-width:80px}
.composer #pick-effort{max-width:78px;padding-left:2px}
.composer select.bad{color:var(--bad-ink);border-color:var(--bad-line);background:var(--bad-fill)}
.composer .send{background:var(--sys-fill);border-color:var(--sys-fill);color:var(--sys-ink)}
.composer .send:hover:not(:disabled){background:#333333;color:var(--sys-ink)}
.composer .send:active:not(:disabled){background:var(--ink-2)}
.composer .send:disabled{background:var(--chip);border-color:var(--chip);color:var(--ink-3)}
.composer .stop{color:var(--ink-2)}
.composer .stop.pressed{animation:composer-stop-press 240ms ease-out}
@keyframes composer-stop-press{
  0%,25%{transform:scale(.88);background:var(--hairline);border-color:var(--line-strong);color:var(--ink)}
  100%{transform:scale(1);background:transparent;border-color:transparent;color:var(--ink-2)}
}
@media (prefers-reduced-motion:reduce){
  .composer .stop.pressed{animation:none;background:var(--hairline);border-color:var(--line-strong);color:var(--ink)}
}
.composer-status{display:flex;align-items:center;gap:4px;color:var(--ink-2);margin-right:4px}
.composer-status .ld-wave{flex-direction:row;width:auto;gap:2px}
.composer-info{display:flex;align-items:center;gap:8px;min-width:0;min-height:18px;margin-top:6px;
  font:11px/18px var(--font-mono);color:var(--ink-3)}
.composer-note{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer-note.bad{color:var(--bad-ink)}
.composer-attachments{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.composer-attachment{display:flex;align-items:center;gap:8px;padding:6px 8px;min-width:0;max-width:100%;

.composer-attachment .attachment-label{min-width:0;max-width:180px}
.composer-attachment .attachment-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.composer-attachment .attachment-state{display:block;color:var(--ink-3);font-size:11px}
.composer-attachment.error{border-color:var(--bad-line)}
.composer-attachment .attachment-remove{width:24px;min-height:24px;padding:2px;flex:none}
.user-attachments{display:flex;flex-wrap:wrap;gap:8px;max-width:100%;margin:8px 0 4px}
.user-attachment{display:flex;flex-direction:column;gap:4px;max-width:200px;padding:8px;
  border:1px solid var(--line-strong);background:var(--surface);font:11px/18px var(--font-ui);overflow-wrap:anywhere}
.user-attachment img{display:block;width:auto;max-width:100%;max-height:160px;object-fit:contain}

@media(max-width:600px){
  .composer-models{gap:0} .composer #pick-model{max-width:150px;font-size:11px}
  .composer #pick-effort{max-width:64px;font-size:11px} .composer-shell{padding:10px}
}
/* ================= 新项目:对话框的一种特殊形态 =================
   2026-08-19 用户裁定两条:
     ① **不存在没有文件夹的空对话** —— 所以第一句话只有一个入口,就是这张表;
        原来长在输入条上的那排坐标因此撤掉(同一件事不许有两个入口)。
     ② **它不是另开一张脸,它是右边那条流的一种形态** —— 一块砖。
   砖是全场唯一带框的内容,框即身份,而"这里要你出面"正是砖的本意
   (stream.css 第 161 行;渲染器文件头「事件砖」那一节)。所以它长在 .s2stream 里,
   用的是砖族的框与排印 —— **不是浮层,没有遮罩,不盖住任何东西**。
   开着的时候流与输入条让位:你不是在看一场对话,你正在开一场。 */
#np-host{padding:12px 0 24px;width:100%;max-width:680px;margin:0 auto;container:project-form / inline-size}
#np-host[hidden]{display:none}
/* 2026-08-22 用户裁定:这一块整体放大一档(约 ×1.15)。
   它跟流里那些砖不一样 —— 别的砖是「读」,这一块是「填」,填的东西还决定整个项目。
   所以只放大它自己(全部收在 #np-host 里),不碰砖族基准。 */
#np-host .brick.np{display:flex;flex-direction:column;gap:20px;padding:24px;min-width:0}
#np-host .np-heading{margin:0;font:600 18px/24px var(--font-ui);color:var(--ink)}
#np-host .np-f{display:flex;flex-direction:column;gap:8px;min-width:0}
#np-host .np-k{font:11px/16px var(--font-mono);letter-spacing:1px;text-transform:uppercase;color:var(--ink-2)}
#np-host .np-hint{font:11px/18px var(--font-mono);color:var(--ink-3);overflow-wrap:anywhere}
#np-host .np-hint:empty{display:none}
/* 名字是标识符(它就是文件夹名)—— 标识符一律等宽(DESIGN_GUIDE 五) */
#np-name{width:100%;min-width:0;font:15px/20px var(--font-mono);padding:10px 12px;background:var(--canvas);
  border:1px solid var(--line-strong);color:var(--ink);outline:none}
#np-name:focus{border-color:var(--ink-2)}
/* 提示是一张多行的单子(见 坐标表 里的 引导),九行高是按它算的,别再压 */
#np-desc{width:100%;min-width:0;font:15px/24px var(--font-ui);padding:12px;background:var(--canvas);resize:vertical;
  border:1px solid var(--line-strong);color:var(--ink);outline:none}
#np-desc:focus{border-color:var(--ink-2)}
#np-brief.dragover #np-desc{border-color:var(--ink);background:var(--chip)}
#np-host .np-brief-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#np-host #np-attachments{margin:0}
#np-host #np-attachments[hidden],#np-host #np-attachment-note[hidden]{display:none}
#np-host #np-attachments .attachment-remove{min-height:24px;padding:2px}
#np-host #np-attachment-note{font:12px/18px var(--font-ui);color:var(--ink-3)}
#np-host #np-attachment-note.bad{color:var(--bad-ink)}
/* 模型与坐标属于项目设置；创建操作独立在底部，不混在同一行。 */
#np-host .np-settings{display:flex;flex-direction:column;gap:16px;padding-top:16px;border-top:1px solid var(--hairline)}
#np-host .np-settings:has(>.np-skills-header){gap:8px}
#np-host .np-skills-header{display:flex;align-items:center}
#np-host .np-skills-summary{cursor:pointer;color:var(--ink-2);font:12px/20px var(--font-ui)}
#np-host .np-skills-panel[open]{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px}
#np-host .np-skills-panel[open]::details-content{display:contents}
#np-host .np-skills-panel[open]>.np-skills-summary{display:list-item;margin-right:12px}
#np-host .np-skills-panel[open]>:not(summary):not(.np-skills-actions){grid-column:1/-1}
#np-host .np-skills-count{margin-left:12px;font:11px/18px var(--font-mono);color:var(--ink-3)}
#np-host .np-skills-hint{margin:0;font:12px/18px var(--font-ui);color:var(--ink-3)}
#np-host .np-skills-hint:empty{display:none}
#np-host .np-skills-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;margin:0}
#np-host .np-skills-actions button{min-height:28px;padding:3px 8px;font-size:11px}
#np-host .np-skills-group{margin-top:4px}
#np-host .np-skills-group-heading{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:600 12px/20px var(--font-ui);color:var(--ink-2)}
#np-host .np-skills-group-count{font:11px/18px var(--font-mono);color:var(--ink-3)}
#np-host .np-skills-empty{margin:0;padding:12px;border:1px dashed var(--hairline);font:12px/18px var(--font-ui);color:var(--ink-3)}
#np-host .np-skills-empty[hidden]{display:none}
#np-host .np-skills-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:6px}
#np-host .np-skill-row{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--hairline);background:var(--canvas);cursor:pointer;min-width:0}
#np-host .np-skill-row:hover{border-color:var(--ink-3)}
#np-host .np-skill-row:has(input:checked){border-color:var(--ink-2);background:var(--chip)}
#np-host .np-skill-row:has(input:focus-visible){outline:2px solid var(--selection-line);outline-offset:-2px}
#np-host .np-skill-row input{flex:none;margin:3px 0 0;accent-color:var(--ink)}
#np-host .np-skill-copy{display:flex;flex:1;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
#np-host .np-skill-heading{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px}
#np-host .np-skill-name{font:600 13px/20px var(--font-ui);color:var(--ink)}
#np-host .np-skill-id{font:10px/16px var(--font-mono);color:var(--ink-3)}
#np-host .np-skill-description{font:12px/18px var(--font-ui);color:var(--ink-2)}
#np-host .np-skill-condition{margin-top:5px;padding-top:6px;border-top:1px solid var(--hairline);font:11px/17px var(--font-ui);color:var(--ink-3)}
#np-host .np-skill-types{display:flex;flex-wrap:wrap;gap:8px}
#np-host .np-skill-type{min-height:32px;padding:5px 10px;font:600 13px/20px var(--font-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong)}
#np-host .np-skill-type[aria-pressed="true"]{color:var(--surface);background:var(--ink);border-color:var(--ink)}
#np-host .np-skill-type:focus-visible{outline:2px solid var(--selection-line);outline-offset:-2px}
#np-host .np-model-row{display:flex;align-items:center;gap:8px;min-width:0}
#np-host .np-model-row button{flex:none}
#np-host #np-model,#np-host #np-effort{-webkit-appearance:none;appearance:none;border-radius:0;
  flex:1;min-width:0;min-height:36px;font:12px/20px var(--font-mono);padding:7px 28px 7px 10px;
  width:100%;max-width:none;background:var(--surface);border:1px solid var(--line-strong);
  color:var(--ink-2);outline:none;cursor:pointer;
  /* 原生下拉是圆角加双箭头,跟方角按钮不是一族 —— 自己画一个 ▾ */
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(-45deg,transparent 50%,currentColor 50%);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
  background-position:calc(100% - 15px) 50%,calc(100% - 11px) 50%}
#np-host #np-effort{flex:0 0 124px;width:124px;max-width:40%}
#np-host #np-model:hover,#np-host #np-effort:hover{color:var(--ink);border-color:var(--ink-2)}
#np-host #np-model:focus,#np-host #np-effort:focus{color:var(--ink);border-color:var(--ink-2)}
#np-host #np-effort:disabled{color:var(--ink-3);border-color:var(--hairline);cursor:not-allowed}
/* 焦点描在控件内部，避免边框外再套一圈黑框。 */
#np-name:focus-visible,#np-desc:focus-visible,#np-host #np-model:focus-visible,#np-host #np-effort:focus-visible{outline:2px solid var(--selection-line);outline-offset:-2px}
/* 取向坐标那几根条(Quality · Mode)。2026-09-17 用户:要「优雅、有设计感、一体」——
   所以它们**不自成一派**,跟整张表说同一种话:
   · 小标题跟 Name / Brief 同一个 .np-k;
   · 框跟输入框同一套(--canvas 底、--line-strong 边、方角),选中那格墨底反白 —— 全表唯一的实心块;
   · 几根条并排一行,格子等分铺满整宽,左右边跟上下的输入框对齐。
   **并排的列宽按挡数分**(3 挡 : 4 挡 → 3fr 4fr,由 造条 那边从 坐标表 算出来写上),
   于是每一格一样宽 —— 加第三根条、加一挡,这里一个字不改。
   打底是真的 radio(同名一组):点、方向键、无障碍全是浏览器白送的,本体藏起来,显形的是 <span>。 */
#np-host .np-dials{display:grid;gap:0 16px}
#np-host .np-dial{display:flex;flex-direction:column;gap:8px;min-width:0}
#np-host .np-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:36px;
  background:var(--canvas);border:1px solid var(--line-strong)}
#np-host .np-seg label{position:relative;display:flex;min-width:0;cursor:pointer}
#np-host .np-seg label + label{border-left:1px solid var(--hairline)}
#np-host .np-seg input{position:absolute;opacity:0;width:0;height:0;margin:0}
#np-host .np-seg span{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;
  font:12px var(--font-mono);letter-spacing:.5px;color:var(--ink-3);
  transition:background 140ms ease-out,color 140ms ease-out}
#np-host .np-seg label:hover span{color:var(--ink)}
/* 选中那格往外吃掉 1px 边 —— 墨块盖住框线,不留一道浅缝 */
#np-host .np-seg input:checked + span{background:var(--ink);color:var(--surface);margin:-1px}
#np-host .np-seg input:focus-visible + span{outline:1.5px solid var(--ink);outline-offset:2px}
/* 拨到哪儿,底下就说哪一句；并排区按最长说明自然撑高。 */
#np-host .np-say{margin:0;font:12px/18px var(--font-ui);color:var(--ink-2)}
#np-host .np-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
#np-host .np-actions{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
#np-host .np-msg{flex:1 1 160px;min-width:0;font:12px/18px var(--font-ui);color:var(--ink-3);overflow-wrap:anywhere}
#np-host .np-msg:empty{display:none}
#np-host .np-msg.bad{color:var(--bad-ink)}
#np-host button{font:12px/20px var(--font-ui);min-height:36px;padding:7px 14px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2)}
#np-host button:hover:not(:disabled){color:var(--ink);border-color:var(--ink-2);background:var(--chip)}
#np-host button:active:not(:disabled){background:var(--hairline);border-color:var(--ink)}
#np-host button:disabled{color:var(--ink-3);border-color:var(--hairline);cursor:not-allowed}
#np-host button.send{background:var(--sys-fill);border-color:var(--sys-fill);color:var(--sys-ink)}
#np-host button.send:hover:not(:disabled){background:#333333;border-color:#333333}
#np-host button.send:disabled{background:var(--chip);border-color:var(--hairline);color:var(--ink-3)}

/* toast:动作回执。140ms 透明度,预算内 */
.toast{position:fixed;right:14px;bottom:14px;z-index:30;background:var(--sys-fill);
       color:var(--sys-ink);font-size:12px;padding:8px 14px;max-width:420px;
       word-break:break-all}

/* 对话流的身体:样式全在 stream.css。
   这里只管它在工作区里的容器 —— 单列度量与呼吸,不碰流内部任何一档。 */
#chat-stream{padding:4px 2px 8px}

/* 节点标记(D2):一条流装全项目,节点身份是流里的一个标记,不是一个容器。
   等宽小字,同一节点连续的块只有第一块带 —— 换节点才出现一次,不逐行挂。
   **用 ::before 而不是插一个元素**:流里的块结构是渲染器的地盘(fuseTail
   靠 firstElementChild / lastElementChild 认路),外人多塞一个子节点就会认错。 */

/* 流顶「更早的几轮先没画」—— 中性家具，不是坏了（不用 --bad-*）；整行可点 */
.fold-note{display:block;width:100%;text-align:left;cursor:pointer;
  font:11px var(--font-mono);color:var(--ink-2);background:var(--chip);
  border:1px dashed var(--line-strong);padding:4px 8px;margin-bottom:calc(var(--base) / 2)}
.fold-note:hover{color:var(--ink);border-color:var(--ink-3)}

/* ================= 主区页签 + 会话选择 =================
   对话 / 轨迹 两页。**流不是页签之一** —— 流是这一页(D1),轨迹是它的另一种排法。
   两页共存于 DOM,切换只切 hidden:流是有状态的,重建一次就全没了。 */
#flowtabs{flex:none;overflow:visible;--node-metrics-width:206px;--node-info-min-width:24px}
#flowtabs:has(.flow-metrics:not([hidden])){--node-info-min-width:calc(var(--node-metrics-width) + 24px)}
.flow-node-info{display:flex;align-items:center;height:100%;flex:0 1 auto;
  min-width:var(--node-info-min-width)}
.flowtab-strip{display:flex;align-items:center;height:100%;flex:1 0 auto;min-width:0;
  max-width:calc(100% - var(--node-info-min-width));overflow-x:auto}
/* 页签是一组视图选择：去掉逐项竖线，靠字重、白底与墨色底线识别当前页。 */
#flowtabs .ptab{border-right:0;padding:0 12px;font-size:12px;letter-spacing:0;color:var(--ink-2)}
#flowtabs .ptab:hover{color:var(--ink);background:var(--surface)}
#flowtabs .ptab.on{font-weight:600;color:var(--ink);background:var(--surface);
  box-shadow:inset 0 -3px 0 var(--selection-line)}
.flow-metrics{display:grid;grid-template-columns:52px 64px minmax(0,1fr);align-items:center;gap:8px;
  flex:none;width:var(--node-metrics-width);height:100%;padding:0 8px;border:0;border-left:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.flow-metrics:hover:not(:disabled),.flow-metrics[aria-expanded="true"]{background:var(--chip)}
.flow-metrics:disabled{cursor:default}
.flow-metrics:focus-visible{outline:1px solid var(--ink);outline-offset:-3px}
.flow-metrics[hidden]{display:none}
.flow-metrics .metric{display:flex;flex-direction:column;align-items:flex-end;min-width:0;gap:0}
.flow-metrics .metric-label{font:11px/13px var(--font-ui);color:var(--ink-2);white-space:nowrap}
.flow-metrics .metric-value{display:block;max-width:100%;font:12px/14px var(--font-mono);color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flow-metrics .metric-value b{font-weight:400}
.flow-metrics .metric-value .void{border-bottom:1px dotted var(--line-strong)}
#flowtabs select{margin-left:8px;font:11px var(--font-mono);color:var(--ink-2);
  background:var(--surface);border:1px solid var(--hairline);padding:2px 4px;max-width:280px}
/* display:flex 会盖掉浏览器给 [hidden] 的 display:none —— 两页都要自己写一条 */
#pane-chat{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
#pane-chat[hidden]{display:none}
/* Session 分支图 → DSH 操作概览 → Trace 记录。分支图仍用原来的拖动分割条。 */
#pane-trace{flex:1;min-height:0;display:grid;
            grid-template-rows:minmax(64px,var(--tlh,12%)) 6px auto minmax(0,1fr)}
#pane-trace[hidden]{display:none}
#tl{grid-row:1;position:relative;overflow:auto;background:var(--surface);
    border-bottom:1px solid var(--line-strong)}
#tlsplit{grid-row:2;cursor:row-resize;background:var(--frame)}
#tlsplit::after{left:calc(50% - 16px);width:32px;top:2px;height:2px;
  border-radius:1px;background:var(--line-strong)}
#tlsplit:hover::after,#tlsplit.on::after{background:var(--ink-3)}
#trace-overview{grid-row:3;min-width:0;
  --dsh-trajectory-toolbar-height:32px;
  --dsw-alias-bg-layer-1:var(--surface);--dsw-alias-bg-layer-2:var(--workspace);
  --dsw-alias-border-l1:var(--hairline);--dsw-alias-border-l2:var(--line-strong);
  --dsw-alias-border-l4:var(--line-strong);
  --dsw-alias-label-primary:var(--ink);--dsw-alias-label-secondary:rgb(97,102,107);
  --dsw-alias-label-tertiary:var(--ink-3);--dsw-alias-label-caption:var(--ink-3);
  --dsw-alias-label-dimmed:var(--ink-3);--dsw-alias-interactive-bg-hover:var(--chip);
  /* DSH 0.1.5-rc.2 的原色，来自 ui-theme/styles/design-platform.css。
     记录类型的混色、透明度和计时渐变继续由 DSH 原组件负责。 */
  --dsw-alias-state-business-primary:rgb(65,118,230);--dsw-alias-state-success-primary:rgb(34,197,94);
  --dsw-alias-state-error-primary:rgb(236,19,19);--dsw-alias-state-error-secondary:rgb(242,90,90);
  --dsw-alias-state-warn-label:rgb(221,134,41);
  --dsw-alias-brand-primary-new-colorprimary-new-color:rgb(65,118,230);
  --dsw-alias-tooltip-bg:var(--ink);--dsw-static-neutral-bluish-00:var(--surface);
  --dsw-font-xs-13:13px/1.4 var(--font-ui);--dsw-font-xxs-12:12px/1.4 var(--font-ui);
  --dsw-font-xxxs-11:11px/1.4 var(--font-ui);--ds-font-family-code:var(--font-mono);
  --ds-ease-in-out:cubic-bezier(.4,0,.2,1)}
/* 浅色界面里增强焦点的轮廓，保留 DSH 各种事件的原色。 */
#trace-overview ._1p9O6q_span[data-selected="true"]{
  opacity:1;filter:saturate(1.2);z-index:2;
  box-shadow:0 0 0 1px var(--dsw-alias-state-business-primary)}
#trace-overview ._1p9O6q_span[data-current="true"]{
  min-width:6px;height:10px;margin-top:-1px;opacity:1;filter:saturate(1.2);z-index:3;
  box-shadow:0 0 0 1px var(--surface),0 0 0 3px var(--dsw-alias-state-business-primary)}
#trace-overview ._1p9O6q_selection{background:rgba(65,118,230,.2)}
#trace-overview ._1p9O6q_selectionEdges::before,
#trace-overview ._1p9O6q_selectionEdges::after{width:4px}
#tj{grid-row:4;overflow:auto;min-height:0;background:var(--surface);
  --trace-cols-height:28px;
  --trace-columns:56px 84px minmax(180px,1fr)}
#tj .tj-cols,#tj .tj-row{display:grid;grid-template-columns:var(--trace-columns);
  min-width:344px;gap:0;padding:0 12px;align-items:stretch}
#tj .tj-cols{position:sticky;top:0;z-index:4;height:var(--trace-cols-height);
  border-bottom:1px solid var(--line-strong);background:var(--frame);
  color:var(--ink-2);font:10px/27px var(--font-ui)}
#tj .tj-cols>span{padding:0 8px;text-align:right;white-space:nowrap}
#tj .tj-cols>span:nth-child(2){text-align:center}
#tj .tj-cols>span:nth-child(3){text-align:left}
#tj .tj-cols>span:first-child{border-right:1px solid var(--line-strong)}
#tj .tj-cols>span:nth-child(n+3){border-left:1px solid var(--line-strong)}
#tj .tj-turn,#tj .tj-group{min-width:344px}
#tj .tj-turn{top:var(--trace-cols-height);display:flex;align-items:center;gap:6px;
  min-height:32px;border-bottom:1px solid var(--line-strong);background:var(--frame);
  font-weight:500;letter-spacing:.25px}
#tj .tj-turn .tj-acts{margin-left:auto}
#tj .tj-group{top:calc(var(--trace-cols-height) + var(--trace-head-h));min-height:26px;
  background:var(--workspace);border-bottom:1px solid var(--line-strong)}
#tj .tj-row{min-height:32px;background:var(--surface);border-bottom:1px solid var(--hairline)}
#tj .tj-row:hover,#tj .tj-row.lit{background:var(--workspace)}
#tj .tj-row>.ix{width:auto;padding:0 8px;line-height:31px}
#tj .tj-row>.ix{border-right:1px solid var(--hairline)}
#tj .tj-row>.tag{width:auto;margin:0 6px;align-self:center;border-radius:2px}
#tj .tj-row>.tx{padding:0 44px 0 8px;line-height:31px}
#tj .tj-row>.tx{border-left:1px solid var(--hairline)}
#tj .tj-calls-summary{min-width:344px}
#tj .tj-fold,#tj .tj-call-fold{border:0;background:transparent;color:var(--ink-3);
  cursor:pointer;font:11px/18px var(--font-ui);padding:0 4px;margin-right:4px}
#tj .tj-fold:hover,#tj .tj-call-fold:hover{color:var(--ink);background:var(--chip)}
#tj .tj-calls-summary{display:block;width:100%;padding:5px 12px 5px 64px;
  text-align:left;border:0;border-bottom:1px solid var(--hairline);background:var(--workspace);
  color:var(--ink-3);font:11px/18px var(--font-ui);cursor:pointer}
#tj .tj-calls-summary:hover{background:var(--chip);color:var(--ink-2)}

/* ================= 节点时间线 =================
   一根条一轮,等长(用户裁定 2026-08-17)。主线居中,分叉出去的线上下交替偏一格 ——
   这是 08-03 那版死路的画法,换了个用途。
   分叉点之前那几轮两条线**物理上是同一批事件**,所以条只画一次,从分叉那根才叉开。
   这张图只读:上面不放分叉按钮。动手在对话页的轮尾行和轨迹表的轮头上。 */
#tl-stage{position:relative;min-width:100%}
.tl-head{position:sticky;top:0;left:0;z-index:3;display:flex;align-items:center;
  height:24px;background:var(--frame);border-bottom:1px solid var(--line-strong);
  color:var(--ink-2);font:10px/1 var(--font-ui)}
.tl-head-label{display:flex;align-items:center;flex:none;width:128px;height:100%;
  padding:0 12px;border-right:1px solid var(--line-strong);font-weight:600;letter-spacing:.4px}
.tl-head-caption{padding-left:12px}
.tl-head-count{margin-left:auto;padding:0 12px;font:10px var(--font-mono);color:var(--ink-3)}
.tl-lane{position:absolute;left:0;right:0;height:36px;
  background:var(--surface);border-bottom:1px solid var(--hairline)}
.tl-lane::after{content:'';position:absolute;left:127px;top:0;bottom:0;
  width:1px;background:var(--hairline)}
#tl .pane-empty{padding:10px 12px;font:11px/1.5 var(--font-ui)}
/* ---- 主线 / 副线 ----
   **副线不是废线。**(2026-08-17 用户裁)分出去的每条线可能都在做有用的事,
   只是此刻你不站在它上面。所以这里不许出现「作废」的语言 ——
   不降透明度、不打虚线、不打叉。两者都是实实在在的轨道,区别只有两处:
     ① 主线填底、墨色字、杆实一档   ② 副线不填底、退一档字色、杆细一档
   而且主副是**相对的**:从哪条线进来,哪条就是主线。位置结构一格不动。 */
.tlbar{position:absolute;z-index:1;height:24px;display:flex;align-items:center;gap:6px;
  padding:0 8px;border-radius:3px;cursor:pointer;overflow:hidden;white-space:nowrap;
  text-align:left;font:10.5px var(--font-mono);
  transition:border-color 140ms ease-out,color 140ms ease-out}
.tlbar.main{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.tlbar.sub {background:var(--workspace);color:var(--ink-2);border:1px solid var(--line-strong)}
.tlbar:hover{color:var(--ink);border-color:var(--ink-2);background:var(--chip)}
.tlbar:focus-visible{outline:2px solid var(--selection-line);outline-offset:2px}
.tlbar.bad{border-color:var(--bad-line);background:var(--bad-fill);color:var(--bad-ink)}
/* 桩:这条线分出去了但一轮都没跑过。虚线在这儿的意思是**还没发生**,
   不是「废了」—— 这一处的虚线语义是对的,留着。 */
.tlbar.stub{border-style:dashed}
/* 轨道杆:一条线是一条轨,不是一堆孤立的格子 */
.tlrail{position:absolute;height:1px;background:var(--line-strong)}
.tlrail.main{height:1px;background:var(--ink-3)}
/* 名牌:这条轨是谁。左槽里,几条线并排时靠它认人 */
.tltag{position:absolute;left:0;width:128px;height:24px;display:flex;align-items:center;
  padding:0 12px;
  font:10px var(--font-mono);letter-spacing:.25px;overflow:hidden;white-space:nowrap}
.tltag.main{color:var(--ink);font-weight:600}
.tltag.sub {color:var(--ink-3)}
.tlbar .n{flex:none;color:var(--ink-3)}
.tlbar .steps{flex:none;font:9px var(--font-mono);color:var(--ink-3)}
.tlbar .w{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 还没跑过的桩之类,淡斜体 */
.tlbar .w.void{color:var(--ink-3);font-style:italic}
/* 分叉的接头:从父线那一根到子线第一根,一竖一横 */
.tlwire{position:absolute;background:var(--edge-plan)}
.tl-note{position:absolute;left:8px;top:4px;font:11px var(--font-mono);color:var(--ink-3)}
.tl-note.warn{color:var(--bad-ink)}

/* ================= 轨迹:移植自 dsh 的 TrajectoryTable =================
   一轮一节(粘头)→ 分组(Message / Step N / Compaction seq)→ 一行一条记录。
   一行保留 #序号 · 种类标签 · 内容，内容占满剩余空间。
   **左边那条时间线轴刻意没有** —— 用户已明确要去掉。
   这里仍是「一个 agent 一次会话内部」的坐标系;最终要的「一群座位之间」是后面的事。 */
#pane-trace{padding:0}
/* ---- 身份那一页 ----
   它回答一个问题:**这个座位出生那一刻,上级给了他什么。**
   排法就是到达顺序(他的经历),不是重要性 —— 重要性是判断,顺序是事实。
   机器事实走等宽(号/座位/字数/返程路),人写的话走正文体。 */
#pane-id{flex:1;min-height:0;background:var(--workspace);overflow:auto;padding:0}
#pane-id[hidden]{display:none}
.id-head{position:sticky;top:0;z-index:2;background:var(--frame);
         border-bottom:1px solid var(--line-strong);padding:12px 18px 11px}
.id-head .n{font:600 15px/1.3 var(--font-ui);color:var(--ink)}
.id-head .n .no{font-family:var(--font-mono);color:var(--ink-3);margin-right:8px;font-weight:400}
.id-head .m{margin-top:5px;font:11px/1.8 var(--font-mono);color:var(--ink-3)}
.id-head .m b{color:var(--ink-2);font-weight:600}
.id-sec{border-bottom:1px solid var(--hairline);padding:13px 18px 15px}
.id-sec > h4{margin:0 0 9px;font:11px var(--font-mono);letter-spacing:2px;color:var(--ink-3);
             font-weight:400;display:flex;align-items:baseline;gap:8px}
.id-sec > h4 .why{letter-spacing:0;font-family:var(--font-ui);color:var(--ink-3);font-size:11px}
.id-f{display:flex;gap:12px;padding:4px 0;align-items:baseline}
.id-f > .k{flex:none;width:52px;font:11px var(--font-mono);letter-spacing:1px;color:var(--ink-3);
           text-align:right;padding-top:2px}
.id-f > .v{flex:1;min-width:0;font:12px/1.8 var(--font-ui);color:var(--ink);
           white-space:pre-wrap;word-break:break-word}
.id-f > .v.mono{font:11px/1.8 var(--font-mono)}
.id-f > .v.none{color:var(--ink-3)}
.id-more{margin-top:7px}
.id-more > summary{cursor:pointer;font:11px var(--font-mono);letter-spacing:1px;
                   color:var(--ink-3);list-style:none}
.id-more > summary::-webkit-details-marker{display:none}
.id-more > summary::before{content:'▸ ';color:var(--line-strong)}
.id-more[open] > summary::before{content:'▾ '}
.id-more > summary:hover{color:var(--ink-2)}
.id-more > pre{margin:8px 0 0;padding:10px 12px;background:var(--surface);
               border:1px solid var(--hairline);max-height:340px;overflow:auto;
               font:11px/1.8 var(--font-mono);white-space:pre-wrap;word-break:break-word}
.id-path{font:11px var(--font-mono);color:var(--ink-3);word-break:break-all;margin-top:6px}
.id-void{color:var(--ink-3);font:12px/2 var(--font-ui);padding:16px 18px;white-space:pre-wrap}
/* 反复出现的轮标题和类型标签用灰阶，让品牌与主动作保留视觉重量。 */
.tj-turn{position:sticky;top:0;z-index:2;background:var(--section);color:var(--ink);
  min-height:var(--trace-head-h);font:11px/20px var(--font-mono);letter-spacing:1px;padding:5px 12px;
  border-top:1px solid var(--line-strong)}
.tj-group{display:flex;align-items:baseline;gap:10px;padding:4px 12px 3px;
  background:var(--frame);border-bottom:1px solid var(--hairline);position:sticky;top:var(--trace-head-h);z-index:1}
.tj-group .gt{font:11px var(--font-mono);letter-spacing:1px;color:var(--ink-2)}
.tj-group .gd{font:11px var(--font-mono);color:var(--ink-3);
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tj-row{display:flex;align-items:baseline;gap:8px;padding:3px 12px;cursor:pointer;
  border-bottom:1px solid var(--hairline)}
.tj-row:hover{background:var(--chip)}
/* DSH TrajectoryTable 原规则：范围外的事件变灰，仍能点击。 */
#tj .tj-row{transition:opacity 120ms cubic-bezier(.4,0,.2,1)}
#tj .tj-row[data-timeline-focus="outside"]{opacity:0.24}
.tj-row .ix{font:11px var(--font-mono);color:var(--ink-3);width:44px;flex:none;text-align:right}
.tj-row .tag{font:11px var(--font-mono);letter-spacing:.5px;padding:1px 5px;flex:none;
  width:74px;text-align:center;border:1px solid var(--hairline);color:var(--ink-2)}
/* 七种种类各一格颜色。这是 dsh 那七个 tag 的位置,配色换成我们自己的三通道 */
.tag.k-system{background:var(--tag-ctx);color:var(--ink);border-color:var(--tag-line);font-weight:600}
.tag.k-compacted{background:var(--tag-tool);color:var(--ink);border-color:var(--tag-line);font-weight:600}
.tag.k-user{background:var(--chip);color:var(--ink)}
.tag.k-context{background:var(--tag-ctx);border-color:var(--tag-line);color:var(--ink-2)}
.tag.k-message{background:var(--tag-msg);border-color:var(--tag-line);color:var(--ink-2)}
.tag.k-tool{background:var(--tag-tool);border-color:var(--tag-line);color:var(--ink-2)}
.tj-row .tx{flex:1;min-width:0;font-size:11.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* 调用与结果同一行:调用退一档,结果那半靠箭头领起(dsh 的 resultPreview 同款) */
.tj-row .rs{color:var(--ink-3);margin-left:8px}
.tj-row .rs.bad{color:var(--bad-ink)}
.tj-row .tag{font-family:var(--font-mono)}
/* 从对话里「查看轨迹」跳过来时停在的那一行。 */
.tj-row.lit{background:var(--chip);box-shadow:inset 2px 0 0 var(--selection-line)}
.tj-turn.lit{box-shadow:inset 3px 0 0 var(--selection-line)}
/* 行尾的对话入口沿用输入区的无框线性图标，内容预留位置，悬停时行不跳。 */
.tj-row{position:relative}
.tj-jump{position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:0;
  display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  padding:5px;cursor:pointer;background:transparent;border:0;color:var(--ink-2);
  transition:opacity 140ms ease-out,background-color 140ms ease-out,color 140ms ease-out}
.tj-jump svg{display:block;width:18px;height:18px;flex:none}
.tj-row:hover .tj-jump,.tj-row:focus-within .tj-jump{opacity:1}
.tj-jump:hover{color:var(--ink);background:var(--hairline)}
.tj-jump:active{background:var(--line-strong)}
@media (hover:none){.tj-jump{opacity:1}}
/* 从轨迹跳过来时,对话里那一块亮一下 —— 落点必须看得见,否则你不知道滚到哪了 */
.s2stream .lit{box-shadow:inset 3px 0 0 var(--selection-line);background:var(--chip)}
.tj-row.bad .tx{color:var(--bad-ink)}
.tj-row.bad .tag{background:var(--bad-fill);border-color:var(--bad-line);color:var(--bad-ink)}

/* 选中范围和当前记录共用醒目的蓝色焦点，错误记录仍保留原来的警示色。 */
#tj .tj-row[data-timeline-focus="inside"],
#tj .tj-row.lit:not([data-timeline-focus="outside"]){
  background:#E4EDFD;box-shadow:inset 4px 0 0 rgb(65,118,230);
  outline:1px solid #B7C8FE;outline-offset:-1px;opacity:1}
#tj .tj-row[data-timeline-focus="inside"]>.tx,
#tj .tj-row.lit:not([data-timeline-focus="outside"])>.tx{font-weight:500}
#tj .tj-row:not(.bad)[data-timeline-focus="inside"]>.tx,
#tj .tj-row.lit:not(.bad):not([data-timeline-focus="outside"])>.tx{color:var(--ink)}
#tj .tj-row[data-timeline-focus="inside"]>.ix,
#tj .tj-row.lit:not([data-timeline-focus="outside"])>.ix{color:#305BA5;font-weight:500}
#tj .tj-row[data-timeline-focus="outside"]{box-shadow:none}

/* 分叉按钮:长在轮头上。家具,无色 */
.tj-acts{margin-left:12px;display:inline-flex;gap:6px}
.tj-acts button{font:11px var(--font-mono);letter-spacing:1px;padding:1px 8px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2)}
.tj-acts button:hover{background:var(--hairline);color:var(--ink);border-color:var(--ink-2)}
.tj-acts button:focus-visible{outline-color:var(--selection-line)}


/* 读全文浮层里的机器行与坏结果 */
.d-mach{font:11px var(--font-mono);color:var(--ink-3);
  border-bottom:1px solid var(--hairline);padding-bottom:6px;margin-bottom:4px}
.d-raw.bad{border-color:var(--bad-line);background:var(--bad-fill);color:var(--bad-ink)}

/* 页签上的记号:有事等你点头。
   **它不是收件箱**(禁令 2)—— 它不装东西、点不开、没有列表。
   它只说「那边有事」,东西本身长在流里它发生的位置,一步都没挪。 */
.ptab[data-ask]:not([data-ask=""])::after{content:attr(data-ask);
  margin-left:6px;padding:0 5px;font:11px/16px var(--font-mono);
  background:var(--bad-fill);border:1px solid var(--bad-line);color:var(--bad-ink)}
/* 别的会话上等着的:顶栏那一句也得跳出来,不然它跟别的计量混成一片看不见 */
/* ================= 信息流页(右列页签,和轨迹并列 —— 2026-08-31 用户裁定) =================
   两个时态:未发生(等待)悬在头上,已发生一行一轮沉在下面,**从上往下按发生顺序**。

   **已发生那半跟轨迹表是同一套家具**(2026-08-31 用户裁定:两张表一个样、一个方向)——
   行头走 `.tj-turn`、每一块走 `.tj-row`,连一个字的样式都不重写。
   这儿只补三样轨迹表没有的:行头右边那个钟、点不开的行不装手型、块名可点。
   判据可证伪:**改轨迹表的行高／字号,信息流要不要跟着改?不要 → 共用对了。**

   家具无色、直角、零动画;死锁走 bad 族(推不出产出人的名字,当场标出来)。 */
#pane-feed{flex:1;overflow:auto;min-height:0;background:var(--workspace)}
.feed-note{color:var(--ink-3);font:11px var(--font-mono);padding:8px 12px}
.feed-h{font:11px var(--font-mono);letter-spacing:2px;color:var(--ink-3);
  padding:4px 12px 3px;background:var(--frame);border-bottom:1px solid var(--hairline)}
/* 行头右边那个钟:轮头本身是轨迹那一条,时间挂在它右缘 */
.tj-turn .when{float:right;letter-spacing:0;color:var(--ink-2)}
.tj-turn[data-行]{cursor:pointer}
/* 点不开的行(进来的料只有一句话,没有全文可读)不许装手型 —— 手型是承诺 */
.tj-row.dud{cursor:default}
.tj-row.dud:hover{background:transparent}
.tj-row .blk{text-decoration:underline;text-decoration-color:var(--hairline)}
/* 主人那一格借轨迹的 `.tm` 位置(最右、等宽)。名字比 ms 长,兜一道省略号 */
.tj-row .tm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#topbar .meta.hot{color:var(--header-ink)}

/* 当前节点统计浮在页签入口下方，关闭时不占对话或输入区的高度。 */
#node-stats{position:fixed;z-index:35;width:min(320px,calc(100vw - 24px));max-height:calc(100vh - 24px);
  overflow:auto;padding:16px;background:var(--surface);border:1px solid var(--line-strong);
  box-shadow:0 4px 16px rgba(23,23,23,.10);font:12px/1.6 var(--font-ui)}
#node-stats[hidden]{display:none}
.stats-heading{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.stats-heading h3{flex:1;min-width:0;margin:0;font-size:13px;font-weight:600}
.stats-close{flex:none;width:24px;height:24px;padding:0;border:0;background:transparent;color:var(--ink-3);font:18px var(--font-ui);cursor:pointer}
.stats-close:hover{color:var(--ink);background:var(--chip)}
.stats-caption{color:var(--ink-3);font-size:11px;overflow-wrap:anywhere}
.stats-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--hairline)}
.stats-section h4{margin:0 0 6px;color:var(--ink-2);font-size:11px;font-weight:500}
.stats-values{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.stats-values dt{color:var(--ink-2)}
.stats-values dd{margin:0;text-align:right;font-family:var(--font-mono);color:var(--ink)}
.stats-values dd b{font-weight:400}
.stats-values .void{border-bottom:1px dotted var(--line-strong)}
.stats-explain{margin:8px 0 0;color:var(--ink-3);font-size:11px}
.stats-details{margin-top:8px;color:var(--ink-2);font-size:11px}
.stats-details summary{cursor:pointer;width:fit-content}
.stats-details p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}

.node-restart-dialog{width:min(380px,calc(100vw - 32px));padding:24px;border:1px solid var(--ink);

.node-restart-dialog button:is([value="reset"],[value="clear"]){background:var(--ink);color:var(--surface);border-color:var(--ink)}

<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= 数据管道:接 dsh(2026-08-17)=================
   六个旧插座(/api/tree · /api/archive · /api/stream · /api/say · /api/note · /api/open)
   全部拆掉 —— 那是已死的 Python/Node 后端的形状。现在只有两条,都由
   `@blueprint/studio` 那个包在服务端喂:

     GET  api/history?session=<id>   一整个会话的折叠视图(条目/统计/轨迹/落点计数)
     GET  api/stream                 SSE,每帧带 session

   **翻译在服务端。** 这一页只认渲染器的形状,不认 dsh 的私有 wire 协议。
   路径是相对的:这一页挂在 /studio/ 下,'api/…' 就落在 /studio/api/…。

   **这一版是只读的眼睛。** 没有输入框 —— 说话去 dsh 自带那张脸(/)。
   往这张脸上接输入是下一件事,而且接的是「节点拿工具问你」(userQuestions),
   不是采纳/批准那一套(禁令 1)。 */

/* draft ＝ 「你正在建一个还不存在的项目」。这是这张脸的**第二个坐标**,不是一个弹窗:
   开着的时候顶栏、左栏、统计条、轨迹**全部跟着切**,否则界面会在同一时刻讲两个故事
   (顶栏说你在项目 A、右栏说你在建项目 B)—— 那是撒谎,跟暗层同族。
   prevSess 记着你从哪儿来:取消就原样回去,不把你甩到别的项目上。 */
const S = { wtabs:[], wcur:null, tab:'chat', 左页:'tree', 左开:[], sessions:[], 回哪:null,
            busy:false, turns:[], flat:[], chatOpen:new Set(),
            models:null,
            /* 还悬着的问话。refresh() 会把整条流清掉重建 —— 问话不是会话事件,
               重建捞不回来,所以它得在这儿自己活着,重建完补回流尾。 */
            asks:new Map(),
            /* 响不响。**唯一一个存在 localStorage 里的偏好** —— 声音关不掉是耍流氓,
               而它又不该占一个坐标(换项目、换节点都不该把它冲掉)。 */
            响: localStorage.getItem('blueprint.响') !== '关' };

/* ══════════════════════════════════════════════════════════════════════════
   这张脸怎么画 —— **改任何显示之前先读这 40 行**（2026-08-19 立）

   一句话：**一个坐标 → 一次画全脸**。这张脸上没有任何一块内容是"自己记着的"。

   ── 为什么立这条（三个真事故，同一个病）──────────────────────────────
   ① 「新项目」要让 5 个区域改口，我挨个改，漏了第 6 个（树栏脚注）
   ② 退出草稿态有 3 个出口，写成 3 份实现，第 2 份漏了还左栏 —— 用户当场撞见
   ③ 切项目时下拉指着旧项目 —— refresh() 里"先画下拉、后落血脉"，早就在了
   三个都是同一句话：**状态变了，某一处没跟着变**。挨个补补不完，
   因为要补的处数 ＝ 区域数 × 状态数，而两个数都在涨（Helm 一落地就再乘一次）。

   ── 三条规矩（判据可证伪）────────────────────────────────────────────
   1. **坐标只有一个**：`S.at`。改它的路只有一条：`切到()`。
      直接写 `S.sess = x` 会**当场抛异常**（下面那个 setter），不是提醒，是拦。
   2. **数据钉着它属于谁**：`D.会话`。区域画之前先问一句「这份数据是这个坐标的吗」，
      对不上就画「读取中」，**绝不拿上一个项目的数据充数**。
      这一条是整套东西的关键 —— 上面三个事故全部被它一条挡住。
   3. **切状态就画全脸**：`画脸()` 把下面那张表里每个区域都调一遍，包括空态。
      没有"上次留下的内容"这回事，所以也就不需要"用完还回去"那种代码
      （那种代码曾经存在，叫 `借左栏`，已删 —— 它还悄悄把树渲染器的 DOM 换掉过）。

   ── 加东西的时候怎么做 ──────────────────────────────────────────────
   · 加一个**区域**（界面上多一块）→ 在 `脸` 那张表里加一行，写一个函数，
     函数里把三种坐标都答一遍。**别在别处 getElementById 去戳它。**
   · 加一种**状态**（比如"这个项目正在删"、"你在看树上的一个 Helm"）→
     在 `S.at.在` 里多一个值，然后**每个区域函数都会因为缺分支而暴露**。
     判据：加一种状态要不要改 N 处？要 → 你没走这条路。
   · 要**取数据**：只有 `取数据()` 一处 fetch，它取完把 `D` 换掉再 `画脸()`。
     别在区域函数里 fetch —— 区域是纯的：看坐标与数据，画出来，不问外面。
   ══════════════════════════════════════════════════════════════════════════ */

/** 坐标：这张脸此刻站在哪儿。**唯一真源。** */
S.at = { 在: 'empty', 项目: null, 看: null };

/** 服务端给的那一份，**钉着它属于谁**。会话对不上 ＝ 这份数据不是你要的。 */
let D = { 会话: null, 载: null };

/* 右抽屉(文件)。**它不在 `S.at` 里** —— 抽屉不是"这张脸站在哪儿",
   是"你顺手拉开看一眼",跟"你在看哪个页签"同一类。坐标只有一个,别把家具塞进去。
   `S.文件.项目` 是**这份文件树属于谁** —— 跟 `D.会话` 同一个规矩:
   对不上就画「读取中」,绝不拿上一个项目的文件夹充数。 */
/* 抽屉现在装的是哪个根(null ＝ 都没开)。**一个按钮一个根**,加第三个根 ＝
   `根们` 那张表加一行 ＋ 顶栏加一个按钮,别处不改(协议 0.4)。 */
/* **抽屉是一块地，不是一棵文件树。** 三个文件根是这块地的三个住户，`在跑` 是第四个。
   一行 ＝ 一个住户：`名` 是抽屉抬头，`要项目` 说它认不认坐标，
   **`取`／`画` 只有"不是文件树"的那种才填** —— 不填就走文件树那条现成的路。
   加第五个住户 ＝ 这张表加一行 ＋ 顶栏加一个按钮，别处一个字不改（协议 0.4）。 */
const 根们 = {
  /* 键是中文、抬头是英文,跟「项目 → 文件」那一行同一个道理:
     键是内部坐标,抬头是你眼睛看见的那个词。`live` 跟旁边 `tool`／`prompt` 同族 ——
     小写名词,说的是抽屉里装着什么。**不叫 `run`**:`run` 在这套系统里是个座位名
     (卡一那句"自己做／开 run／开 Helm"),顶栏挂一个 run 会读成"开一个 run"。 */
  '在跑':   { 名:'live',   要项目:false, 取:()=>取在跑(), 画:身=>画在跑(身) },
  '项目':   { 名:'文件',   要项目:true  },
  'prompt': { 名:'prompt', 要项目:false },
  /* skill 不是文件树，是一列开关（09-29，接替原来的 tool 那一列）：勾上的模型看得见，没勾的看不见。
     点名字在左边摊开那份 SKILL.md —— 走的还是文件那条路（根＝skill）。底下几行是我们写的工具说明书（根＝tool）。 */
  'skill':  { 名:'skill',  要项目:false, 取:()=>取skill(), 画:身=>画skill(身) },
};
S.抽屉 = null;
S.文件 = 新文件状态();
/* 「在跑」那一列手上这份。它**不钉项目** —— 后台是跨项目的,
   你要问的正是"别的项目还有没有东西泡着"。 */
S.在跑 = { 载:null, 错:'', 取中:false };
/* 后台此刻在跑几件。**服务端数好了随帧送过来**(`blueprint.在跑变了` 的 `几`),
   这儿一个都不自己数 —— 那一列关着的时候前端手上根本没有那张表。 */
S.在跑几 = 0;

const dur = ms => ms < 60000 ? (Math.round(ms/100)/10)+'s'
  : Math.floor(ms/60000)+'m'+Math.round((ms%60000)/1000)+'s';
const tk = n => n < 1000 ? String(n)
  : n < 1e6 ? (n/1000 >= 100 ? Math.round(n/1000) : Math.round(n/100)/10)+'K'
            : (Math.round(n/1e5)/10)+'M';

/* 项目累计由服务端给出，页面只在两个状态帧之间推进显示；不依赖当前选中的节点。 */
function 合并工作时间(value){
  const previous = 数据在手() ? D.载.工作时间 : null;
  if(previous && value && previous.project === value.project && (previous.asOf > value.asOf
    || (previous.asOf === value.asOf && previous.sequence > value.sequence))) return previous;
  return value ? {...value, receivedAt:performance.now()} : null;
}
function 工作毫秒(value){
  return value.workedMs + (value.running && value.receivedAt != null ? Math.max(0, performance.now() - value.receivedAt) : 0);
}
function 工作时长(ms){
  const seconds = Math.floor(Math.max(0, ms) / 1000);
  return [Math.floor(seconds / 3600), Math.floor(seconds / 60) % 60, seconds % 60].map(n => String(n).padStart(2, '0')).join(':');
}
function 画工作时间(){
  const el = document.getElementById('project-work-time');
  if(!el || S.at.在 !== 'project' || !数据在手()) return;
  const value = D.载.工作时间;
  el.textContent = '已工作 ' + (value?.known ? 工作时长(工作毫秒(value)) : '—');
}
function 暂停工作时间显示(){
  const value = 数据在手() ? D.载.工作时间 : null;
  if(value){ value.workedMs = 工作毫秒(value); value.receivedAt = null; }
  画工作时间();
}
setInterval(画工作时间, 1000);

/* ---- 钱 ----
   小钱要看清小数,大钱不需要。所以位数跟着量级走,不是固定两位 ——
   固定两位的话,一条几分钱的会话会显示成「¥0.00」,那等于没显示。 */
const 钱数 = v => v >= 100 ? Math.round(v).toLocaleString('en-US')
  : v >= 1 ? v.toFixed(2) : v >= 0.01 ? v.toFixed(3) : v.toFixed(4);

/** 那一格里的「¥」。**算不出来就写「—」,永远不写 0** ——
    0 的意思是「真的没花钱」,而这儿的情况是「我不知道」,两件事不许混。 */
function 画钱(钱){
  const 币 = (钱 && 钱['币']) || '¥';
  if(!钱 || 钱['坏']) return `<b class="void">${币} —</b>`;
  if((钱['缺'] || []).length){
    /* 一部分模型没价 → 只敢说「至少」,并且照样是虚线,提醒你这不是总数 */
    return 钱['已算'] > 0 ? `<b class="void">≥${币}${钱数(钱['已算'])}</b>`
                          : `<b class="void">${币} —</b>`;
  }
  return `<b>${币}${钱数(钱['合计'] || 0)}</b>`;
}

/** 上面那一格的悬停解释。**缺价时把缺的键原样列出来** ——
    「算不出」如果不告诉你缺什么,你就只能去翻代码,那就是把活推给了用户。 */
function 钱话(钱, 谁){
  谁 = 谁 || '这条会话';
  if(!钱) return `钱：${谁}还没有可计价的用量`;
  const 币 = 钱['币'] || '¥';
  if(钱['坏']) return `钱：算不出 —— ${钱['坏']}`;
  const 缺 = 钱['缺'] || [];
  if(缺.length){
    return `钱：算不出总数 —— 下面这几个模型不在价目表里：\n  ${缺.join('\n  ')}\n`
      + '把这几个键原样填进 blueprint/packages/studio/单价.json 的「价」里'
      + '（四个数：输入／缓存读／缓存写／输出，单位是元每百万 token）。存盘即生效，不用重起。'
      + (钱['已算'] > 0
        ? `\n算得出来的那部分是 ${币}${钱数(钱['已算'])} —— **它不是总数**，所以前面写的是「≥」`
        : '');
  }
  const 分 = Object.entries(钱['分项'] || {});
  return `钱 ${币}${钱数(钱['合计'] || 0)} —— ${谁}到现在花掉的。`
    + (分.length > 1 ? `\n分模型：\n  ${分.map(([k,v]) => `${k}  ${币}${钱数(v)}`).join('\n  ')}` : '')
    + '\n价来自 单价.json，那张表是你自己填的 —— 它对不对，界面不知道。';
}

   2026-08-26 之前这三个是硬写在 buildFlow 的 innerHTML 里的,加第四个要改三处
