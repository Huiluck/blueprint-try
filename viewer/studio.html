   次序就是页签从左到右的次序。`落: true` 那一行是切不出去时的落点
   (2026-08-31 身份挪到最左之后,落点不再等于第一行 —— 落点该是对话,不该跟着排序走)。 */
const 右住户 = [
  { key:'id',     名:'Brief',
    提示:'节点接到的任务、交付要求与初始说明',
    /* 平时取数据不带身份（要扫柜子、拼壳），切进来手上没有就现取一次 */
    醒: () => { if(数据在手() && D.载.身份 === undefined) 取数据('对话'); } },
  { key:'chat',   名:'Chat', 落: true, 提示:'与当前节点对话，查看回复和工具调用' },
  { key:'artifacts', 名:'Artifacts', 提示:'查看已发布成果、素材与过程文件，点卡片打开', 醒: () => 产物画廊?.refresh() },
  { key:'terminal', 名:'Terminal', 提示:'当前节点的用户交互终端；输出不会自动发送给模型', 醒: () => 用户终端?.sync() },
  { key:'trace',  名:'Trace', 提示:'逐轮逐步的执行记录，以及撤回或分叉产生的会话分支',
    /* 平时取历史不带轨迹（太大），切进来手上没有就现取一次 */
    醒: () => { if(数据在手() && !S.turns) 取数据('对话'); } },
  { key:'feed',   名:'Feed',
    提示:'按轮查看节点收到和交出的信息、材料；点行头回到对话',
    /* `醒` ＝ 切进这一页时要现取一次数据的,在这儿声明 —— showTab 不认识具体页 */
    醒: () => 画信息流() },
];

/* ================= 左列:一块可以装不同页面的地 =================
   **右列一个字没动。** 这一节只管左边那一列(2026-08-20 用户裁定)。

   **加一个住户 ＝ 这张表里加一行 ＋ 一个 id 的 div。别处一个字都不用改** ——
   这就是「先骨架后功能」的那条判据(协议 0.4):加第二个同类要不要改代码?不要。

   `钉` ＝ 页签关不掉。节点树钉在最左:它是「这个项目有谁」的唯一去处,
   不给关闭按钮;但它**可以被切走**,它只是不下岗。 */
const 左住户 = [
  { key:'tree', 名:'节点树', id:'tree-pane', 钉:true,
    提示:'常驻 —— 关不掉,但可以切走。一个项目就是一棵树:谁开了谁,来自「开人」那把工具的回执' },
];
/* 左列**打开的页**:一行一个,可关,排在常驻的后面。
   **它不认识「文件」这个概念** —— 谁都能往左列开一页(文件正文、以后的产物预览、
   任务书…),给个 key、名字、和「怎么画身子」就行。这就是骨架那一层:
   加第二种能打开的东西,不用改这儿一个字(协议 0.4)。

   每页钉着 `项目`:换项目时 画左栏页签() 把上一个项目开的页收走(这张脸的规矩二)。

   **开一页 ＝ 当场切过去,没有第二种脾气**(2026-09-10 简回来的)。
   因为这一列里的每一页现在都是**你自己要的** —— 你点开一份文件、你按了
   工具行上那个「打开」。没有谁替你开页这回事了,所以也不需要"悄悄开"那一路:
   09-03 到 09-08 之间那两个参数(`悄悄`／`属于`)伺候的是"界面替你开窗"那个错假设,
   假设没了,参数跟着没。 */
function 左开一页(key, 名, 画身子, 提示){
  let el = document.getElementById('lp-' + key);
  if(!el){
    el = document.createElement('div');
    el.id = 'lp-' + key; el.className = 'leftpage'; el.hidden = true;
    document.getElementById('leftbody').appendChild(el);
    S.左开.push({ key, 名, 提示, 项目: S.at.项目 });
  }else{
    const t = S.左开.find(t => t.key === key);
    if(t){ t.名 = 名; t.提示 = 提示; t.项目 = S.at.项目; }
  }
  el.textContent = '';
  画身子(el);
  左切到('页:' + key);
}

/** 关掉左列一页。`静` ＝ 收拾场地时叫的(画左栏页签 自己会重画),别在那时递归回去。 */
function 左关一页(key, 静){
  const el = document.getElementById('lp-' + key);
  if(el) el.remove();
  S.左开 = S.左开.filter(t => t.key !== key);
  /* **关掉的不一定是你正在看的那一页。** 所以不能只在「关的是当前页」时才动 ——
     那样页签栏不会重画,那一格还挂在那儿(2026-08-20 实测撞见)。
     统一交给 左切到:key 没了它自己退回节点树,在了就原地不动,两种情况都会重画。 */
  if(!静) 左切到(S.左页);
}

/** 一个 key 对应左列的哪块地。打开的页 key 形如 `页:xxx`。 */
const 左住处 = key => document.getElementById(
  key.startsWith('页:') ? 'lp-' + key.slice(2)
                        : (左住户.find(z => z.key === key) || {}).id);

/** 左列切页签。**只藏不擦** —— 住户可能是有状态的,擦一次就全没了。 */
function 左切到(key){
  const 全部 = 左住户.map(z => z.key).concat(S.左开.map(t => '页:' + t.key));
  if(!全部.includes(key)) key = 左住户[0].key;
  S.左页 = key;
  for(const k of 全部){ const el = 左住处(k); if(el) { el.hidden = k !== key; if(el.hidden) el.querySelectorAll('video,audio').forEach(media => media.pause()); } }
  /* 树画在一块**有尺寸**的地上:开屏对准要读 clientWidth,藏着的地宽是 0。
     所以它藏着时画的那一次不算数(`treeFirst` 不消耗),露出来补画一次 ——
     只补这一次,之后你自己拖过缩过的位置不许被切页签冲掉。 */
  if(key === 'tree' && treeFirst) 画树();
  /* 悄悄开的那一页,src 一直吊着没装 —— **藏着的地宽是 0**,那时候装进去,
     里面那一屏是按 0×0 排的版,你切过来看到的是一团挤在角落的东西。
     所以等它真露出来这一刻再装。(跟隔壁节点树"藏着画的那次不算数"同一个道理。) */
  const 露 = 左住处(key);
  const 吊着 = 露 && 露.querySelector ? 露.querySelector('.lp-preview[data-lazy]') : null;
  if(吊着){ 吊着.src = 吊着.dataset.lazy; delete 吊着.dataset.lazy; }
  画左栏页签();
}

/** 左列那条页签栏。常驻的在前(次序 ＝ `左住户` 的次序,所以节点树永远在最左),
    打开的排在后面,各带一个 ×。 */
function 画左栏页签(){
  const bar = document.getElementById('lefttabs');
  if(!bar) return;
  /* 上一个项目开的页,换项目时收走 —— 不许拿上一个项目的东西继续摆着 */
  for(const t of S.左开.slice()) if(t.项目 !== S.at.项目) 左关一页(t.key, true);

  const 格 = (key, 名, 钉, 提示) =>
    `<span class="ptab${key === S.左页 ? ' on' : ''}${钉 ? ' pin' : ''}"`
    + ` data-left="${esc(key)}" role="tab" aria-selected="${key === S.左页}" tabindex="${key === S.左页 ? 0 : -1}"` + (提示 ? ` title="${esc(提示)}"` : '') + '>'
    + (钉 && key === 'tree' ? '<svg class="brand-mark" viewBox="0 0 335 434" fill="none" aria-hidden="true" focusable="false"><path d="M297 217V18H18V416H317V217H89" stroke="currentColor" stroke-width="36" stroke-linecap="butt" stroke-linejoin="miter"/></svg>' : '')
    + esc(名)
    + (钉 ? '' : `<span class="x" data-lclose="${esc(key)}" title="关掉">×</span>`) + '</span>';

  bar.innerHTML = 左住户.map(z => 格(z.key, z.名, true, z.提示)).join('')
    + S.左开.map(t => 格('页:' + t.key, t.名, false, t.提示)).join('');
  /* 抽屉里那份清单跟着标一下:哪个文件已经开着 */
  document.querySelectorAll('#dw-body .fz-row[data-f]').forEach(row =>
    row.classList.toggle('open', S.左开.some(t => t.key === 'file:' + (row.dataset.r || S.抽屉) + ':' + row.dataset.f)));
}

/* ================= 摆一格出来 → 左列开一扇活的窗 =================
   谁摆的:节点手上那把 `preview`。它自己看不见这一屏 —— 看见的是你。

   ## 摆 ≠ 跳（2026-09-07 用户裁定，**推翻 09-03 那条**）

   09-03 定的是「改到哪、摆到哪、你眼睛就在哪」——**在只有一格的时候是对的**。
   现在一棵树上二十格同时在干活，那条规矩的实际后果是用户原话：

   > 「我在看节点 3，然后突然节点 1 的任务完成了跳出来，我要找半天位置。」

   一格摆东西给你看，**不等于它有权抢走你正在看的那一屏**。所以现在两把工具
   一个脾气：页签悄悄长出来，你自己切过去看。跟 `look` 合并成同一条路，
   区别只剩页签上那句提示（谁摆的 vs 它自己看的）。

   **那你怎么知道有新东西？** 摆完它总要问你（`preview` 不落账、不结束那一轮，
   摆的下一步就是开口）—— 那一刻这一格在树上变成问号，**铃响一声**（见「一声提示音」）。
   声音是通知，树上那个问号是它的位置。这张脸不再另开一个收件箱。

   ⚠️ **没有"背着你看"这回事**(禁令 3 无暗层):节点摆的每一扇窗你同屏看得见。
      "后台"的意思只是**它不等你回话**,不是不让你看见。

   ## 隔离靠**换源**,不靠 sandbox(2026-09-03 改,实机撞出来的)

   原来这扇窗挂的是 `sandbox` 且不给 `allow-same-origin`。那样的页面**没有源**,
   而没有源的页面**一读 localStorage 就抛异常** —— 猫那个游戏开局第一件事就是读存档,
   于是整页黑屏,而真浏览器里好好的。看起来像"缺插件",其实是我们自己掐死的。

   窗加载 `localhost:<口>`,而这张脸自己是 `127.0.0.1:<口>` ——
   **两个不同的源**(反过来也一样,谁在外面就用另一个)。于是那一屏
   ① 有正常的 localStorage,游戏该怎么跑怎么跑;
   ② 仍然碰不到这张脸(跨源:读不了我们的 storage、拿不到我们的 DOM)。
   sandbox 那一行因此撤掉了，页面靠不同源隔离。
   桌面 App 由主进程生成仅用于该会话项目预览的凭据，放在路径里；
   网页和相对资源共用这条只读入口，无需跨站 Cookie。

   ⚠️ 顺带:studio 那条路由上的 `X-Frame-Options: SAMEORIGIN` 也必须撤,
      不撤的话它会把这个跨源的 iframe 直接挡成一片空白。 */
function 预览网址(会话, 位){
  if(window.blueprintDesktop?.previewURL) {
    const url = window.blueprintDesktop.previewURL(会话, String(位));
    if(!url) throw new Error(译('无法创建项目预览地址'));
    return url;
  }
  const 尾 = 'studio/preview/' + encodeURIComponent(会话) + '/'
           + String(位).split('/').map(encodeURIComponent).join('/');
  /* 独立 Web 服务的预览:回环有两个写法,谁在外面就用另一个。两个都不是就退回同源
     (局域网 IP 那种情况),那时候窗里存不了东西,但至少不黑屏。 */
  const 另一个 = location.hostname === '127.0.0.1' ? 'localhost'
               : location.hostname === 'localhost' ? '127.0.0.1' : null;
  return 另一个 ? `${location.protocol}//${另一个}:${location.port}/${尾}`
               : '/' + 尾;
}

async function 打开文件链接(会话, 位, 来源){
  if(来源?.pending) return toast(译('这一条还在生成，完成后可打开文件'));
  try {
    const params = new URLSearchParams({session:会话, path:位});
    if(Number.isSafeInteger(来源?.seq)) params.set('seq', String(来源.seq));
    if(来源?.callId) params.set('callId', 来源.callId);
    const response = await fetch('api/artifact-entry?' + params);
    const result = await response.json();
    if(!response.ok || !result.ok) return toast(result.message || 译('文件暂不可用'));
    const item = result.item;
    if(/\.(js|mjs|json|css|ya?ml)$/i.test(item.path)) return 开文件('项目', item.path, 会话);
    return 打开产物(item);
  } catch { toast(译('文件链接暂不可用，请确认 Blueprint 服务已更新并连接')); }
}

async function 打开产物(item, reveal = false){
  if(reveal || ['system','reveal'].includes(item.opening) || (!item.opening && ['playable','slides','office'].includes(item.kind))) {
    const locate = reveal || item.opening === 'reveal';
    try {
      const response = await fetch(locate ? 'api/artifact-reveal' : 'api/artifact-open', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({session:item.session, path:item.path})});
      const result = await response.json();
      toast(result.ok ? locate ? 译('已在 Finder 中定位') : 译('已交给系统打开') : result.message || 译('打开失败'));
    } catch { toast(译('打开失败，请确认 Blueprint 服务已更新并连接')); }
    return;
  }
  if(item.url) { window.open(item.url, '_blank', 'noopener,noreferrer'); return; }
  if(item.opening === 'browser') { window.open(预览网址(item.session, item.path), '_blank', 'noopener'); return; }
  if(item.kind === 'document') 开文件('项目', item.path, item.session);
  else 开预览(item.session, item.path);
}

function 开预览(会话, 位){
  const key = '预览:' + 位;
  左开一页(key, 位.split('/').pop(), el => {
    el.classList.add('frame');
    /* 每次都换一个 t —— 模型改一版摆一次,浏览器拿旧的那一屏就等于骗人 */
    const 址 = 预览网址(会话, 位) + '?t=' + Date.now();
    const 头 = document.createElement('div');
    头.className = 'lp-head';
    头.innerHTML = `<span class="lp-path">${esc(位)}</span>`
      + `<button class="lp-save" data-again>重开一次</button>`
      + `<a class="lp-save" href="${esc(址)}" target="_blank" rel="noopener">在浏览器里开</a>`;
    const f = window.ArtifactPreview(位);
    const 消息 = document.createElement('p'); 消息.className = 'lp-note lp-preview-error'; 消息.hidden = true;
    f.addEventListener('error', () => { 消息.textContent = '此文件暂时无法预览，可用系统应用打开。'; 消息.hidden = false; });
    const 系统 = document.createElement('button'); 系统.className = 'lp-save'; 系统.textContent = '用系统打开';
    系统.onclick = () => 打开产物({session:会话, path:位, opening:'system'});
    头.append(系统);
    /* **一律先吊着**,等你真切过去那一刻才装(见 左切到)。
       现在没有"当场跳过去"这回事了,所以也没有"现在就该装好"的那一路。 */
    f.dataset.lazy = 址;
    头.querySelector('[data-again]').onclick = () => {
      消息.hidden = true;
      f.src = 预览网址(会话, 位) + '?t=' + Date.now();
    };
    el.append(头, f, 消息);
  }, 位);
}

/* ================= 点一个文件 → 在左列摊开 =================
   项目那个根**只读**:节点碰项目文件夹只有 hands 一条路(覆盖前自动备份到 `旧/`),
   界面上再开一条就绕过了那个备份。
   prompt 那个根**可以直接改**(2026-08-21 用户裁定) —— 那是你自己改自己的座位正文,
   不是节点在动项目产物,两件事。存的时候走的仍是 hands 那把钥匙的 `盖掉()`:
   旧的先进 `旧/` 带时间戳,再原子写。 */
async function 开文件(根, 位, 来源会话 = S.sess){
  const 谁 = S.at.项目, 卡 = 根们[根] || {}, key = 'file:' + 根 + ':' + 位;
  左开一页(key, 位.split('/').pop(), el => {
    el.innerHTML = `<div class="lp-head"><span class="lp-path">${esc(位)}</span></div>`
                 + '<div class="lp-note">读取中…</div>';
  }, `${卡.名 || 根} · ${位}`);

  let d = null, 旧壳 = false;
  try{
    const r = await fetch('api/file?根=' + encodeURIComponent(根)
                          + (卡.要项目 ? '&session=' + encodeURIComponent(来源会话) : '')
                          + '&位置=' + encodeURIComponent(位));
    if(r.status === 404) 旧壳 = true; else d = await r.json();
  }catch(_){ /* 后端不在 */ }

  if(卡.要项目 && S.at.项目 !== 谁) return;        /* 你已经换项目了 */
  const el = document.getElementById('lp-' + key);
  if(!el) return;                                  /* 你已经把它关了 */

  el.innerHTML = `<div class="lp-head"><span class="lp-path">${esc(位)}</span></div>`;
  const 说 = t => { const d2 = document.createElement('div'); d2.className='lp-note'; d2.textContent=t; el.appendChild(d2); };
  if(旧壳) return 说('跑着的这个 dsh 里还没有这条路由 —— 双击 重起Blueprint.command 就有了');
  if(!d)   return 说('后端不在 —— 起 ./dsh web');
  if(!d.ok) return 说(d.message || '读不了这个文件');

  if(d.可写) return 画编辑器(el, 根, 位, d);

  /* .md 走**流里那一份**极小 markdown(硬规矩 4:全系统只有一份实现)。
     套上 .s2stream > .said 两层类,排印跟对话里的正文一模一样。 */
  if(/\.(md|markdown)$/i.test(位) && R && R.md){
    const wrap = document.createElement('div'); wrap.className = 's2stream';
    const said = document.createElement('div'); said.className = 'said';
    wrap.appendChild(said); el.appendChild(wrap);
    R.md(said, d.文);
  }else{
    const pre = document.createElement('pre'); pre.className = 'lp-raw';
    pre.textContent = d.文; el.appendChild(pre);
  }
  /* 截了就说截了 —— 少给而不说,就是暗层 */
  if(d.截了) 说(`这个文件 ${Math.round(d.字节/1000)}K,只摊开了前面一段 —— 后面还有没画出来的。`);
}

/* ---------------------------------------------- 可以改的那种
   **它就是那一页文档,只不过能往里打字。** 保存在标题行右端(用户 2026-08-21 指的位置),
   不另起一条工具条 —— 一页文档不该长出一个表单。

   给的是**原文**:模型读到的就是这些字符。排一次版再让你改,你改的就不是它读的
   那一份了(暗层)。所以 `##`、`**` 这些记号留在文里,是对的,不是没排好。 */
function 画编辑器(el, 根, 位, d){
  const 头 = el.querySelector('.lp-head');
  const 话 = document.createElement('span'); 话.className = 'lp-msg';
  const 存 = document.createElement('button'); 存.className = 'lp-save'; 存.textContent = '保存';
  /* 生效时机两边不一样,挂在按钮上 —— 不然改完 blueprint.md 看不出变化,
     你会以为没存上然后反复改(这句话是服务端那张根表给的)。 */
  存.title = d.提示 || '';
  头.append(话, 存);

  const ta = document.createElement('textarea');
  ta.className = 'lp-doc'; ta.value = d.文; ta.spellcheck = false;
  el.appendChild(ta);
  /* 高度跟着内容长,整页滚 —— 框中框滚起来最难受 */
  const 长高 = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };

  let 原 = d.文;
  const 看脏 = () => {
    const 脏 = ta.value !== 原;
    存.disabled = !脏;
    if(!话.dataset.keep) 话.textContent = 脏 ? '改过了,还没存' : '';
  };
  ta.addEventListener('input', () => { delete 话.dataset.keep; 长高(); 看脏(); });

  存.onclick = async () => {
    存.disabled = true; delete 话.dataset.keep; 话.textContent = '存…';
    let r = null;
    try{
      const resp = await fetch('api/file', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ 根, session: S.at.项目, 位置: 位, 文: ta.value }) });
      r = await resp.json();
    }catch(_){ /* 后端不在 */ }
    if(!r){ 话.textContent = '没存上 —— 后端不在'; 存.disabled = false; return; }
    if(!r.ok){ 话.textContent = '没存上 —— ' + (r.message || ''); 存.disabled = false; return; }
    原 = ta.value;
    话.dataset.keep = '1';
    话.textContent = d.提示 ? '存好了 · 旧版进了 旧/ · ' + d.提示 : '存好了 · 旧版进了 旧/';
    看脏();
  };

  /* ⌘/Ctrl+S:浏览器那个"保存网页"在这儿没有意义,顺手接管 */
  ta.addEventListener('keydown', e => {
    if((e.metaKey || e.ctrlKey) && e.key === 's'){ e.preventDefault(); if(!存.disabled) 存.click(); }
  });

  看脏();
  /* 量一次高度。**当场量,不只靠 rAF** —— 这一页此刻已经露出来了(左开一页 先切过来
     才轮到这儿),而 rAF 在标签页不可见时根本不触发,只靠它会留下一个两行高的框
     (2026-08-21 实测撞见)。rAF 那一次留着兜字体晚到的情况。 */
  长高();

}

/* ================= 一声提示音 =================
   **这张脸唯一会出声的东西**（2026-09-07 用户定）。要解决的是：一格转成
   「等你回应」时，说出这件事的三个记号 —— 页签角标、树上那块金纸、标题栏那个
   `(1)` —— 三个都要求你**正好在看**。声音不要求。

   ① **加第二声 ＝ `声表` 里加一行 ＋ 在那个事件旁边叫一次 `响()`**（协议 0.4）。
      时值三个常量全场共用 —— 一个事件配一套合成器参数是把调音台当骨架。
   ② **不带资源**：现场合成，仓库里不多一个二进制、不多一条要伺候的路由（零构建）。
   ③ 开关记在 localStorage 的 `blueprint.响`（顶栏那个「铃」按钮 2026-09-17 用户删了；默认开着）。

   ⚠️ **浏览器不许没被点过的页面出声。** 绕不开，所以第一次 `pointerdown`
      顺手把音场建起来。后果说清楚：**页面开着但你一次都没点过，第一声是哑的。** */
const 声表 = { 等你回应: [880, 1318.5] };   /* 往上走 ＝ 有事找你；下行留给以后真出事那一声 */
const 音长 = 0.20, 音隔 = 0.13, 音量 = 0.14;

let 音场 = null;
function 起音场(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC && !音场) 音场 = new AC();
    if(音场 && 音场.state === 'suspended') 音场.resume();
  }catch(_){ 音场 = null; }        /* 出不了声不该拖垮这张脸 */
  return 音场;
}
addEventListener('pointerdown', 起音场, {once:true});

function 响(名){
  const 谱 = 声表[名], ac = (S.响 && 谱) ? 起音场() : null;
  if(!ac || ac.state !== 'running') return;   /* 还没被点过:哑一次,不攒着等下次一起响 */
  谱.forEach((hz, i) => {
    const t = ac.currentTime + i * 音隔;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = hz;
    /* 起音留 12ms 斜坡:直接给值会「啪」一声(那是方波沿,不是我们要的) */
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(音量, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 音长);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + 音长 + 0.02);
  });
}


/* ================= 要你点头的那两件事 =================
   「这个我删了？」(批准) 与 「你选哪个？」(提问)。

   这两样**不是会话事件** —— 它们是 dsh 的接力链,服务端在链上挂了一环,转成
   `blueprint.ask` / `blueprint.ask_done` 发过来。答复原路回去(method 'respond',
   回的是问话那一条的 rpcId,不新开一个)。
   服务端那一环同时把问话交给 dsh 那张脸,谁先答谁算数 —— 不抢谁的位置,
   dsh 那张脸开不开都不影响(细节在 studio 包的 README「要你点头」)。 */
async function answerAsk(rpcId, kind, value){
  try {
    const r = await rpc('respond', null, {rpcId, value});
    if(!r.ok) toast(r.message || '答复没进去');
    return !!r.ok;
  } catch(error) { toast(error.message || '答复没进去'); return false; }
}

/* 你在输入框里说了别的 —— 那句问话就不该再挡着。

   **这是「发送」永远管用的那一半。** dsh 的规矩:一次问话没答复,那一轮就停在
   那儿等,排在它后面的话一句都读不到(2026-08-21 用户撞到:blueprint 发来一张问卷,
   不想填,直接打字发送,整个系统不动)。所以「发送」这一下连做两件事:
   **先把你的话放进去,再把挡路的问话撤掉** —— 顺序不能反。反了的话它可能
   在你的话到达之前就把这一轮跑完了。

   撤 ＝ 服务端那条 `cancel:true`(dsh 只认 result.ok=false + code 'cancelled')。
   模型那边看到的是「这次提问被用户撤了」,不是一个假答案 —— 不许替他编答案。

   **只撤提问,不撤批准。** 批准 dsh 只收「准/不准」两个值,替你点头是替你做决定。
   所以批准还挡着的时候,这儿说一声,不偷偷替你按。 */
async function 撤掉挡路的问话(session = S.sess){
  const 我这条 = f => !f.session || f.session === session;
  const 问卷 = [...S.asks.values()].filter(f => f.kind !== 'approval' && 我这条(f));
  for(const f of 问卷) await rpc('respond', null, {rpcId:f.rpcId, cancel:true});
  /* 落章由服务端的 ask_done(outcome:'cancelled')兜底,不在这儿抢着画 */
  if([...S.asks.values()].some(f => f.kind === 'approval' && 我这条(f)))
    toast('还有一件要你点头的事挡在前面 —— 它得先有个「准/不准」,你这句才轮得到');
}

/* 悬着的问话补回流尾。已回答的提问由账本里的工具参数与回执重建为折叠卡。 */
function drawAsks(){
  for(const f of S.asks.values()){
    if(f.session && f.session !== S.sess) continue;
    if($stream.querySelector(`[data-ask="${CSS.escape(f.rpcId)}"]`)) continue;
    R.feed(f);
  }
  paintAskBadge();
}

/* 提醒表示尚未查看；打开节点即可清除，未回答的问题仍留在对话里。 */
const 查看中 = new Set();
function 落已读(session, ids){
  for(const id of ids){
    const frame = S.asks.get(id);
    if(frame?.session === session) frame.seen = true;
  }
  paintAskBadge(); paintTop();
}
async function 看过提醒(session = S.sess){
  window.blueprintDesktop?.viewAttention?.(session || null);
  const ids = [...S.asks.values()].filter(f => f.session === session && !f.seen && !查看中.has(f.rpcId)).map(f => f.rpcId);
  if(!session || !ids.length) return;
  ids.forEach(id => 查看中.add(id));
  try{
    const r = await rpc('attention.seen', {sessionId:session, rpcIds:ids}, null, true);
    if(r.ok) 落已读(session, ids);
    else toast('提醒已读状态未保存：' + (r.message || '请重试'));
  } finally { ids.forEach(id => 查看中.delete(id)); }
}
function 查看当前提醒(){
  if(document.visibilityState === 'visible' && document.hasFocus() && 数据在手()) void 看过提醒();
}
window.addEventListener('focus', 查看当前提醒);
document.addEventListener('visibilitychange', 查看当前提醒);

function paintAskBadge(){
  const tab = document.querySelector('#flowtabs .ptab[data-tab="chat"]');
  const unread = [...S.asks.values()].filter(f => !f.seen);
  const here = unread.filter(f => !f.session || f.session === S.sess).length;
  if(tab){
    tab.dataset.ask = here ? String(here) : '';
    tab.title = here ? `有 ${here} 条未查看的提醒` : '';
  }
  document.title = (unread.length ? `(${unread.length}) ` : '') + 'BLUEPRINT';
}
/* 别的会话尚未查看的提醒；已看过但未回答的不再占顶栏。 */
function otherAsks(){
  const rows = [...S.asks.values()].filter(f => !f.seen && f.session && f.session !== S.sess);
  if(!rows.length) return null;
  const who = [...new Set(rows.map(f => shortId(f.session)))];
  return `别处 ${rows.length} 条未查看提醒（${who.join(' ')}）—— 切过去查看`;
}

/* ================= 说话:一条通道,一件能力都不自己实现 =================
   全部动作走 `POST api/rpc {method, payload}`,服务端翻译给 dsh 的 sessionController / subagents。
   我们这边不重写 prompt / cancel / create / fork 里的任何一行逻辑。 */
async function rpc(method, payload, extra, 静){
  const r = await fetch('api/rpc', {method:'POST', headers:{'Content-Type':'application/json'},
    /* extra 是给「答一句问话」用的:它没有自己的 payload,它带的是**回哪一条**
       (rpcId)和答案本身。形状不同,所以不硬塞进 payload 里假装一样。 */
    body: JSON.stringify({method, payload, ...(extra || {})})})
    .then(x=>x.json()).catch(e=>({ok:false, message:'后端不在：'+String(e)}));
  /* 静 ＝ 这一条自己会报账,别在这儿弹。给「停」那种一次连发几十条的用 ——
     不给的话后端一断就是几十个提示叠上来,真正那句总结反而被挤没了。 */
  if(!r.ok && !静) toast(r.message || (method+' 没成'));
  return r;
}

/* ---- 发送只有一种:能多快就多快（2026-08-21 用户裁定）----
   这儿原来有一个「排队 / 插话」下拉(抄的 dsh ComposerSubmissionPolicy)。**删了。**
   用户原话:「没有任何东西阻挡我对模型的及时输入，无论这个系统同时跑着 100 个节点
   还是什么，无论模型给我发来了什么，只要我在输入框内发送内容，马上就开始处理」。

   那个下拉是把一个**永远该选最快**的选择摆出来让人选 —— 它唯一的作用是让人
   选错。所以模式改成算出来的,不是选出来的。

   ⚠️ **2026-09-01:连"算"也不算了,一律 `steer`。**
   原来是「闲着 → queue、忙着 → steer」,靠 `S.busy` 分路。两处错:

   ① **`S.busy` 是采样出来的提示,不是保证**(跟树上那个 `running` 同一个性质)——
      它由服务端的帧喂过来。节点刚被弧推了一拍、帧还没到的那几百毫秒里,
      这儿会判它闲着,于是走 queue。
   ② **走错了的代价不对称,而且是灾难级的。** queue ＝ dsh 的 **next-turn** 队列,
      **只有回合边界才领,而且一次只领一条**。而这个系统里一个节点的几拍
      **跑在同一个回合里** —— 于是"等下一个回合"实际上是"等它把整摊活干完"。
      大猫超级玛丽那一跑:一句话在队里躺了 9 分 22 秒,出来的时候成了过期命令。
      反过来走错(闲着却 steer)一点代价都没有:steer 同样叫醒空闲的驱动器,
      它开一个回合、当场领走 next-step —— 跟 queue 一模一样快。

   一句话:**这两条只在"它正忙着"的时候有区别,而那正是等不得的时候。**
   出处:`参考/dsh/packages/core/agent-loop/README.md`(next-step / next-turn 的领取时机)。 */
function submitMode(){ return 'steer'; }

/* ══════════════════════════════════════════════════════════════════════════
   说话走哪条路 —— Blueprint 走一条，子节点走另一条

   2026-08-26 用户撞见：重启之后在树上一个子节点里打字，回来一句
   `agent-busy: session "4734e6fe…" is owned by subagent routing`。

   不是重启的锅。dsh 那个判定是**无条件**的
   （`参考/dsh/packages/api/remotes/src/agent-lookup.ts`）：
       if (session.header.origin === 'subagent') return true
   ——只要那个会话是子节点，`session.prompt` 就一律拒。也就是说
   **在子节点上打字发送，在这一版之前从来就没通过**，只是平时都在 Blueprint 上说话，没撞见。

   跟「停」是同一个病：这张脸只会用 `session.*`，而树上除了 Blueprint，全是 subagent。

   子节点那条路多一个前提：**它上级得活着**（dsh 拿 `ctx.agents.get(parentSessionId)`
   查，查不到就 `subagent-parent-unavailable`）。刚重启完谁都没活，所以这时候
   往子节点发必然失败 —— 那不是坏了，是得先把那条线唤醒。这句话必须说人话，
   见下面那张表：dsh 给的是英文错误码，照着弹出去等于没说。
   ══════════════════════════════════════════════════════════════════════════ */

/** 这个会话是不是 dsh 的 subagent。**这一格是账本上的durable 事实，不是猜的。**
    2026-08-26 之后开的节点都不是（seats 从根作用域开人、不打这个标记），
    所以它同时也是「老项目 / 新项目」的分界线 —— 老项目里那些还得走老路子，
    不许为了代码好看把它们弄哑。这个分支跟着老项目一起退休，别提前删。 */
function 是老节点(id){
  const r = (S.sessions || []).find(x => x.id === id);
  return !!(r && r.origin === 'subagent');
}

/** 我正看着的这个节点是谁的孩子。**Blueprint → null。**只有老节点那条路要用它。 */
function 我的父(){
  const L = S.lineage;
  if(!L || !S.sess || S.sess === L.root) return null;
  const 行 = (L.lines || []).find(x => x.id === S.sess);
  if(行 && 行.parent) return 行.parent;
  /* lines 被 LINEAGE_CAP 截掉时树上还可能有 —— 两处都问过再说没有 */
  /* 树上一张卡 ＝ 一个 Blueprint ＋ 它那个 Helm（**两个独立节点，只是画在一起** ——
     `DESIGN_GUIDE.md` 3.1）。所以按会话找卡要连 `带们` 一起认，
     不然站在 Helm 那一条上时，在树上查不到自己在哪张卡。 */
  const 砖们 = (L.tree && L.tree.nodes) || [];
  const n = 砖们.find(x => x.node_id === S.sess
    || (x.带们 || []).some(b => b.会话 === S.sess));
  return (n && n.parent) || null;
}

/* dsh 的错误码 → 一句你能照着做的话。**没列的照原样弹**，不许兜成一句"发送失败"：
   一个没见过的错被糊成"失败了"，下次就查不出来了。 */
const 递不进去 = {
  'subagent-parent-unavailable':
    '它上级现在没活着，话递不进去 —— 先去上级那张卡上说一句话，把那条线唤醒（上级要是也没活，就一路往上，到 Blueprint 为止），再回来说',
  'subagent-not-resumable':
    '这个节点起不回来了（dsh 说 not-resumable）—— 只能让上级重新派一个',
  'subagent-unauthorized':
    '这个节点不归树上画的那个上级管 —— 树和账本对不上了，别硬发，先看账',
  'subagent-delivery-unavailable':
    '它正在收摊或者换挡，这一下递不进去 —— 过几秒再说一次',
};

const 稍等 = ms => new Promise(r => setTimeout(r, ms));

/**
 * 一份**新鲜的**会话表。`session.list` 带 `parentSessionId` / `origin` / `running`，
 * 而且**零日志加载** —— 拿 `api/history` 去换太贵（那一条要把血脉上每个会话的
 * 事件全读一遍），而「停」每扫一遍都需要新鲜的：这几百毫秒里可能有孩子刚出生。
 * @returns {Promise<Map<string,{父:string|null,老:boolean,在跑:boolean}>>} 读不出就是空表
 */
async function 会话表(项目 = null){
  const r = await rpc('session.list', 项目 ? {projectSessionId: 项目} : {}, null, true);
  const m = new Map();
  if(!r.ok) return null;
  if(项目 && r.value?.projectSessionId !== 项目) return null;
  for(const x of (r.value && r.value.items) || []){
    m.set(String(x.sessionId), {
      父: x.parentSessionId ? String(x.parentSessionId) : null,
      老: x.origin === 'subagent',
      在跑: !!x.running,
    });
  }
  m.external = r.value?.external || [];
  m.canCloseAgentTerminals = r.value?.canCloseAgentTerminals === true;
  return m;
}

/**
 * 停一个节点。**两个钮共用这一份**（输入框那个「停」与树右上角那个「全停」）——
 * 写第二份的那一天，就是两个钮开始给出不同答案的那一天（禁令 10）。
 *
 * 看账本上那格 `origin` 选路：新节点（2026-08-26 起）是独立会话走 `session.cancel`；
 * 老节点是 dsh 的 subagent，`session.cancel` **明写拒绝它**，只有 `subagent.interrupt`。
 * 两条都不要求上级活着 —— 所以「停」永远按得动。
 *
 * @param {string} id 会话 id
 * @param {{父:string|null,老:boolean,在跑:boolean}} v 会话表上那一行
 * @returns {Promise<boolean>} 停住了没有。**冷会话回「找不到」不算失败** ——
 *   它本来就没在跑，没什么可停的。表说它在跑、调用又没成，那才是真没停住。
 */
async function 停一个(id, v, 项目 = null){
  const 范围 = 项目 ? {projectSessionId: 项目} : {};
  const r = (v && v.老 && v.父)
    ? await rpc('subagent.interrupt', {parentSessionId: v.父, childSessionId: id, mode: 'continuable', ...范围}, null, true)
    : await rpc('session.cancel', {sessionId: id, ...范围}, null, true);
  return !!(r.ok || !(v && v.在跑));
}

/* ══════════════════════════════════════════════════════════════════════════
   全停 —— 停点击时当前项目里的全部会话，包括辅助会话。
   输入框的「停」仍只管当前对话节点，两个按钮共用 `停一个()`。
   每遍通过带项目身份的 `session.list` 取新名单，服务端按项目目录与辅助父链收窄；
   逐条取消仍携带同一项目身份并由服务端校验，操作中切项目不会扩大或改变范围。
   第一遍取消全部项目会话，之后只追仍在跑的，封顶 8 遍；中止请求不保证立即停稳。
   ══════════════════════════════════════════════════════════════════════════ */
/* Stop 带上那格字：停着的时候写进度，平时 null（带子自己写 NOW）。渲染器每次重画都来读它。 */
let 全停字 = null;
const 写停字 = t => { 全停字 = t; document.querySelectorAll('.nkill .st').forEach(el => el.textContent = t || 'NOW');
  document.querySelectorAll('.nkill').forEach(el => el.classList.toggle('busy', !!t)); };
async function 全停(){
  if(全停字) return;   /* 正在停：再按一下不另起一遍 */
  const 项目 = S.at.在 === 'project' && S.at.项目;
  if(!项目){ toast(译('当前项目还没就绪')); return; }
  写停字('…');
  let 打了 = new Set(), 没停住 = new Set(), 剩 = 0, 遍数 = 0, 读不出 = false, 收终端 = false, 终端错误 = '';
  try{
    for(let 遍 = 1; 遍 <= 8; 遍++){
      遍数 = 遍;
      写停字(遍 === 1 ? '…' : `…${遍}`);
      const 表 = await 会话表(项目);
      if(!表){ 读不出 = true; break; }
      收终端 = 表.canCloseAgentTerminals === true;
      /* 第一遍谁都打，之后只追还在跑的 —— 理由见上面那段。 */
      const 名单 = [...表].filter(([, v]) => 遍 === 1 || v.在跑).map(([id]) => id);
      const 外部 = (表.external || []).filter(row => 遍 === 1 || ['running','stopping','settling'].includes(row.status));
      剩 = [...表.values()].filter(v => v.在跑).length + (表.external || []).filter(row => ['running','stopping','settling'].includes(row.status)).length;
      await Promise.all([...名单.map(async (id) => {
        const v = 表.get(id) || {};
        const ok = await 停一个(id, v, 项目);
        if(ok) 打了.add(id); else if(v.在跑) 没停住.add(id);
      }), ...外部.map(async row => {
        const result = await rpc('external.interrupt', { projectSessionId: 项目,
          parentSessionId: row.parentSessionId, childSessionId: row.id }, null, true);
        if(result.ok) 打了.add(row.id); else 没停住.add(row.id);
      })]);
      if(!剩) break;
      await 稍等(400);
    }
    /* 交给 Codex／Claude Code 的 run 没有会话，上面那几遍停不到它们，这里一起停（10-19：停一个只停一个，全停才是全部）。 */
    if(!读不出){
      const 外 = await rpc('project.stopExternalRuns', {projectSessionId: 项目}, null, true);
      if(外.ok) for(const id of 外.value?.stopped || []) 打了.add('外部run:' + id);
      else 没停住.add('外部run');
    }
    if(!读不出 && 收终端){
      写停字('…PTY');
      const result = await rpc('project.closeAgentTerminals', {projectSessionId: 项目}, null, true);
      if(!result.ok) 终端错误 = result.message || 译('节点终端尚未完全释放');
    }
  } finally {
    写停字(null);
  }

  if(读不出){ toast(译('读不出当前项目的会话表，停止操作未能继续')); return; }
  const 话 = [译('Stop All：已向当前项目的 {n} 个会话或外部任务发送停止', {n: 打了.size})];
  if(没停住.size) 话.push(译('其中 {n} 个**没停住**（在跑，但那一下没打进去）—— 再按一次', {n: 没停住.size}));
  if(剩) 话.push(译('扫了 {passes} 遍还有 {n} 个在跑 —— 可能只是还没停稳', {passes: 遍数, n: 剩}));
  if(终端错误) 话.push(译('节点终端关闭失败：{error}', {error: 终端错误}));
  toast(话.join(译('。')));
  refresh();
}

/* ══════════════════════════════════════════════════════════════════════════
   停 —— **停这一个对话节点。就这一个。**

   ── 语义（2026-09-01 用户定，原话）────────────────────────────────────
   「停就是停一个对话节点，就这么简单」
   「全停是停所有对话节点，就这么简单」
   两个钮的分工到此为止，**中间没有第三种强度**：一个是一个，全部是全部。

   ⚠️ **这一条推翻了 08-26 那个「向下全停」**（那天那句「我停了 A，A 的子节点
   也要停」不再成立）。它最难看的地方是砖里那道缝：Blueprint 带和 Helm 带在账本上
   是父子（helm 带的 `parentSession` 就是它自己的上带），于是「停 Blueprint」
   把正在干活的 Helm 一起带走 —— 而它俩在图上是同一格的上下两半，不是上下级。
   2026-09-01 实机撞的（大猫超级玛丽：Blueprint 跑飞了想停它，Helm 跟着断）。
   **别把连坐加回来。** 要停几个就点几下；要全停，树右上角有它自己那个闸。

   ── 一个节点一条路，看的是账本上那一格 `origin` ──────────────────────
   新节点（2026-08-26 起）是独立会话 → `session.cancel`。
   老节点是 dsh 的 subagent → `session.cancel` **明写拒绝它**，只有
   `subagent.interrupt` 一条路。老那条留着只为老项目，跟着它们一起退休。
   **不许为了代码好看把老项目弄哑。**

   ── 为什么「停」永远按得动 ────────────────────────────────────────────
   两条路都不要求上级活着 —— `subagent.interrupt` 那条是 dsh 故意的
   （注释明写：为的就是「上级下线了，孩子还能被停掉」）。
   对照：**说话**在老节点上要求上级活着。同一个系统，两条动作两套规矩。

   ── 反复扫 ────────────────────────────────────────────────────────────
   停是**发了就返回**，不保证对面已经停稳。所以再取一份会话表看它还在不在跑，
   还在就再打一次，封顶 8 遍。**每一遍扫的都只有它自己那一条** ——
   它可能刚被上级或某个交活的孩子叫醒。

   ── 两句必须说出来的话 ────────────────────────────────────────────────
   ① 这只停「当前这一轮」。**排着队的活是停放保留、不丢的**（dsh 的 keepInbox）。
   ② **只有它停了。** 它派出去的人、它同一块砖上的另一条带，全都照跑不误 ——
      报账那句必须说出来，不然你会以为这一支已经安静了。
   ══════════════════════════════════════════════════════════════════════════ */
async function 停这一个(){
  const 我 = S.sess;
  if(!我) return;
  const btn = document.getElementById('stop-btn');
  const 原题 = btn ? btn.title : '';
  if(btn) btn.disabled = true;
  let 打过 = false, 还在跑 = false, 遍数 = 0, 读不出 = false;

  try{
    for(let 遍 = 1; 遍 <= 8; 遍++){
      遍数 = 遍;
      if(btn){btn.setAttribute('aria-busy','true');btn.title = 遍 === 1 ? '正在停止…' : `正在停止…第 ${遍} 遍`;}
      const 表 = await 会话表();
      if(!表?.size){ 读不出 = true; break; }
      const v = 表.get(我) || {};
      还在跑 = !!v.在跑;
      /* 上一遍那下打进去了、这一遍它已经不跑了 —— 停稳，收工。 */
      if(!还在跑 && 遍 > 1) break;
      if(await 停一个(我, v)) 打过 = true;
      /* 第一遍就没在跑 ＝ 冷会话，本来就没什么可停的（`停一个()` 也是这么判的）。 */
      if(!还在跑) break;
      await 稍等(400);
    }
  } finally {
    if(btn){btn.disabled=false;btn.removeAttribute('aria-busy');btn.title=原题;}
  }

  if(读不出){ toast('读不出会话表 —— 没停成。后端还在吗'); return; }
  if(!打过) toast('没停住，请再试一次');
  else if(还在跑) toast(`尝试 ${遍数} 次后仍在运行，请再试一次`);
  refresh();
}

/* 长高到贴合内容,封顶 160px —— 再高就把流挤没了 */
function autosize(t){ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,160)+'px'; }

/* 附件和文字草稿按节点保存；上传回执只随原会话发送。 */
function composerExtras(say, repaint){
  const drafts = new Map(), metadata = new Map();
  const shell = document.getElementById('composer-shell');
  const tray = document.getElementById('composer-attachments');
  const note = document.getElementById('composer-note');
  const picker = document.getElementById('attach-files');
  const add = document.getElementById('attach-btn');
  const imageTypes = ['image/png','image/jpeg','image/webp','image/gif'];
  let selected, serial = 0, traySignature = '', notice = '';
  const draft = id => { if(!drafts.has(id)) drafts.set(id, {text:'', files:[]}); return drafts.get(id); };
  const errorText = r => r?.message || r?.error?.message || '附件处理失败，请重试';
  const bytes = n => n >= 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.ceil((n||0)/1024))+' KB';
  function save(){ if(selected !== undefined) draft(selected).text = say.value; }
  async function info(id, force=false){
    if(!id) return null;
    let entry = metadata.get(id);
    if(entry && !force && (entry.value || entry.pending || Date.now() < entry.retryAt)) return entry.pending || entry.value;
    entry = {value:entry?.value || null, retryAt:0}; metadata.set(id,entry);
    entry.pending = rpc('输入.信息',{sessionId:id},null,true).then(r=>{
      entry.value=r.ok ? r.value : null; entry.retryAt=Date.now()+10000; entry.pending=null;
      if(selected===id) repaint(); return entry.value;
    });
    return entry.pending;
  }
  function sync(){
    if(selected !== S.sess){
      save(); selected=S.sess; notice=''; traySignature='';
      say.value=draft(selected).text; autosize(say); void info(selected,true);
    }
    const current=draft(selected), items=current.files;
    add.disabled=!selected;
    const signature=JSON.stringify([selected,items.map(f=>[f.id,f.status,f.error])]);
    if(signature!==traySignature){
      traySignature=signature; tray.replaceChildren(); tray.hidden=!items.length;
      for(const f of items){
        const chip=document.createElement('div'); chip.className='composer-attachment'+(f.status==='error'?' error':'');
        if(f.preview){const img=document.createElement('img');img.src=f.preview;img.alt='';chip.append(img);}
        const label=document.createElement('span');label.className='attachment-label';
        const name=document.createElement('span');name.className='attachment-name';name.textContent=f.file.name;name.title=f.file.name;
        const state=document.createElement('span');state.className='attachment-state';
        state.textContent=f.status==='loading'?'正在处理…':f.status==='error'?f.error:bytes(f.file.size);
        state.title=state.textContent; label.append(name,state);chip.append(label);
        if(f.status==='error'){
          const retry=document.createElement('button');retry.type='button';retry.textContent='重试';retry.onclick=()=>void prepare(f,selected);chip.append(retry);
        }
        const remove=document.createElement('button');remove.className='attachment-remove';remove.type='button';remove.textContent='×';
        remove.setAttribute('aria-label','移除 '+f.file.name);remove.onclick=()=>{f.controller?.abort();current.files=current.files.filter(x=>x!==f);repaint();};
        chip.append(remove);tray.append(chip);
      }
    }
    const loading=items.some(f=>f.status==='loading'), error=items.find(f=>f.status==='error');
    note.textContent=loading?'正在处理附件…':error?'附件未就绪，请重试或移除':notice;
    note.title=note.textContent;note.classList.toggle('bad',!!error);
    document.getElementById('composer-info').hidden=!note.textContent;
    return {canSend:!!selected && !loading && !error && (!!say.value.trim() || items.some(f=>f.status==='ready'))};
  }
  async function prepare(item,id){
    if(!draft(id).files.includes(item)) return;
    item.status='loading';item.error='';item.controller?.abort();item.controller=new AbortController();repaint();
    try{
      if(是老节点(id) && !imageTypes.includes(item.file.type)) throw new Error('此旧节点仅支持图片附件，普通文件请发送给新节点');
      const meta=await info(id);
      if(!draft(id).files.includes(item)) return;
      const file=item.file, limits=meta?.imageLimits;
      if(imageTypes.includes(file.type)){
        if(!file.size) throw new Error('图片为空');
        if(limits?.mediaTypes && !limits.mediaTypes.includes(file.type)) throw new Error('当前节点不支持此图片格式');
        if(limits?.maxImageBytes && file.size>limits.maxImageBytes) throw new Error('图片超过单张上限 '+bytes(limits.maxImageBytes));
        const images=draft(id).files.filter(x=>imageTypes.includes(x.file.type));
        if(limits?.maxImagesPerMessage && images.length>limits.maxImagesPerMessage) throw new Error('每条消息最多 '+limits.maxImagesPerMessage+' 张图片');
        if(limits?.maxMessageImageBytes && images.reduce((n,x)=>n+x.file.size,0)>limits.maxMessageImageBytes) throw new Error('图片总大小超过上限 '+bytes(limits.maxMessageImageBytes));
        const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('图片读取失败'));reader.readAsDataURL(file);});
        const dimensions=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve({width:img.naturalWidth,height:img.naturalHeight});img.onerror=()=>reject(new Error('图片无法解码'));img.src=data;});
        if(limits?.maxImagePixels && dimensions.width*dimensions.height>limits.maxImagePixels) throw new Error('图片像素超过当前节点上限');
        if(limits?.maxImageDimension && Math.max(dimensions.width,dimensions.height)>limits.maxImageDimension) throw new Error('图片边长超过当前节点上限');
        item.preview=data;item.content={type:'image',mediaType:file.type,data:String(data).split(',')[1],name:file.name};
      }else{
        const query=new URLSearchParams({session:id,name:file.name});
        const response=await fetch('api/upload-file?'+query,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file,signal:item.controller.signal});
        const result=await response.json();if(!result.ok || !result.value?.receiptId) throw new Error(errorText(result));
        item.content={type:'file',receiptId:result.value.receiptId};
      }
      item.status='ready';
    }catch(e){
      if(item.controller.signal.aborted) return;
      item.status='error';item.error=e.message || String(e);
    }finally{if(selected===id) repaint();}
  }
  function addFiles(files){
    const id=selected;if(!id) return;
    notice='';
    for(const file of Array.from(files||[])){
      const item={id:++serial,file,status:'loading',content:null,preview:null};draft(id).files.push(item);void prepare(item,id);
    }
    repaint();
  }
  add.onclick=()=>{picker.dataset.session=selected||'';picker.click();};
  picker.onchange=()=>{if(picker.dataset.session===selected)addFiles(picker.files);else toast('节点已切换，请在当前节点重新选择附件');picker.value='';};
  say.addEventListener('paste',e=>{
    const files=Array.from(e.clipboardData?.files||[]);
    if(!files.length) return;
    e.preventDefault();addFiles(files);
    const text=e.clipboardData.getData('text/plain');
    if(text){say.setRangeText(text,say.selectionStart,say.selectionEnd,'end');say.dispatchEvent(new Event('input',{bubbles:true}));}
  });
  let dragDepth=0;
  shell.addEventListener('dragenter',e=>{if(!Array.from(e.dataTransfer?.types||[]).includes('Files'))return;e.preventDefault();dragDepth++;shell.classList.add('dragover');});
  shell.addEventListener('dragover',e=>{if(Array.from(e.dataTransfer?.types||[]).includes('Files')){e.preventDefault();e.dataTransfer.dropEffect='copy';}});
  shell.addEventListener('dragleave',()=>{if(--dragDepth<=0){dragDepth=0;shell.classList.remove('dragover');}});
  shell.addEventListener('drop',e=>{dragDepth=0;shell.classList.remove('dragover');if(e.dataTransfer?.files?.length){e.preventDefault();addFiles(e.dataTransfer.files);}});
  return {
    sync,save,edit(){save();},refreshInfo(){return info(selected,true);},
    take(){save();const id=selected,d=draft(id),batch={id,text:say.value.trim(),files:d.files.slice()};d.text='';d.files=[];say.value='';notice='';autosize(say);return batch;},
    restore(batch){for(const f of batch.files){if(f.content?.type==='file'){f.content=null;f.status='error';f.error='发送失败，请重新上传文件';}}const d=draft(batch.id);if(selected===batch.id)save();d.text=[batch.text,d.text].filter(Boolean).join('\n');d.files=[...batch.files,...d.files];if(selected===batch.id){say.value=d.text;autosize(say);notice='发送失败，内容已保留';}else toast('发送失败，草稿已保留在原节点');repaint();},
  };
}

/* 历史附件只读官方附件存储，文件名作为文本显示。 */
const attachmentReads = new Map();
function renderUserAttachments(content){
  const host=document.createElement('div');host.className='user-attachments';
  const session=S.sess;
  const imageTypes=['image/png','image/jpeg','image/webp','image/gif'];
  for(const block of content){
    if(!block || !['image','file'].includes(block.type)) continue;
    const card=document.createElement('div');card.className='user-attachment';
    const ref=block.attachment || {},name=ref.name || block.name || (block.type==='image'?'图片附件':'文件附件');
    const label=document.createElement('span');label.textContent=name;card.append(label);host.append(card);
    if(block.type!=='image') continue;
    const status=document.createElement('span');status.className='attachment-error';status.textContent='读取图片…';card.append(status);
    const show=(mediaType,data)=>{
      if(!imageTypes.includes(mediaType) || !data || !/^[A-Za-z0-9+/=\s]+$/.test(data)){status.textContent='图片无法预览';return;}
      const img=document.createElement('img');img.alt=name;img.src='data:'+mediaType+';base64,'+data;
      img.onerror=()=>{status.hidden=false;status.textContent='图片无法解码';};card.prepend(img);status.hidden=true;
    };
    if(block.data){show(block.mediaType,block.data);continue;}
    if(!ref.attachmentId || !session){status.textContent='图片没有可用的附件引用';continue;}
    const key=session+':'+ref.attachmentId;
    if(!attachmentReads.has(key)) attachmentReads.set(key,rpc('附件.读取',{sessionId:session,attachmentId:ref.attachmentId},null,true));
    attachmentReads.get(key).then(r=>{
      if(r.ok)show(r.value?.attachment?.mediaType || ref.mediaType,r.value?.data);
      else {attachmentReads.delete(key);status.textContent=r.message || r.error?.message || '图片读取失败';}
    }).finally(()=>attachmentReads.delete(key));
  }
  return host;
}

function wireComposer(){
  const say = document.getElementById('say');
  const send = document.getElementById('send-btn');
  const stop = document.getElementById('stop-btn');

  let extras;
  const paint = () => {
    const state=extras?.sync();
    window.goalView?.sync();
    window.featuresView?.sync();
    send.disabled=!state?.canSend;
    /* 忙着仍能发送；停止始终只作用于当前节点。 */
    stop.hidden=!S.sess;
    document.getElementById('composer-status').hidden=!S.busy || !S.sess;
  };
  extras=composerExtras(say,paint);
  window.goalView=globalThis.BlueprintGoal?.create({host:document.getElementById('goal-panel'),rpc,
    target:()=>S.at.在 === 'project' && S.sess && !是老节点(S.sess)
      ? {sessionId:S.sess,projectSessionId:S.at.项目 || S.lineage?.root || S.sess} : null});
  window.featuresView=globalThis.BlueprintFeatures?.create({host:document.getElementById('features-panel'),rpc,
    target:()=>S.at.在 === 'project' && S.sess && !是老节点(S.sess)
      ? {sessionId:S.sess,projectSessionId:S.at.项目 || S.lineage?.root || S.sess} : null});
  window.paintComposer=paint;
  window.refreshComposerInfo=()=>extras.refreshInfo();

  async function submit(){
    if(!extras.sync().canSend) return;
    const batch=extras.take(),session=batch.id;
    const content=[...(batch.text?[{type:'text',text:batch.text}]:[]),...batch.files.map(f=>f.content)];
    const mode=submitMode(),old=是老节点(session),parent=old?我的父():null;
    paint();
    if(old && !parent){extras.restore(batch);toast('旧节点的上级暂时读不出，消息已留在草稿');return;}
    const zone=Intl.DateTimeFormat().resolvedOptions().timeZone;
    const r=parent
      ? await rpc('subagent.prompt',{parentSessionId:parent,childSessionId:session,mode:'continuable',content,clientTimeZone:zone},null,true)
      : await rpc('session.prompt',{sessionId:session,mode,content,clientTimeZone:zone},null,true);
    if(!r.ok){extras.restore(batch);toast((parent&&递不进去[r.code]) || r.message || r.error?.message || '这条消息没递进去');return;}
    const target = r.value?.targetSessionId || session;
    if(target !== session && S.at.看 === session) await 切到({在:'project', 项目:S.at.项目, 看:target});
    const command=r.value?.command;
    if(command?.text) toast(command.text);
    if(command) void extras.refreshInfo();
    if(!command) await 撤掉挡路的问话(target);
  }

  say.addEventListener('input', () => { extras.edit(); autosize(say); paint(); });
  say.addEventListener('keydown', e => {
    if(e.key !== 'Enter' || e.shiftKey) return;
    /* isComposing:中文输入法里回车是确认候选词,不是发送 */
    if(e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    /* Cmd/Ctrl+回车原来走「另一种模式」。模式没了,它跟回车一样 —— 手记着的人不会落空 */
    submit();
  });
  send.onclick = () => submit();
  /* 程序调用 click() 不会触发 :active；Esc 与鼠标点击共用一次按压反馈。 */
  let stopPressTimer;
  stop.addEventListener('click', () => {
    if(stop.hidden || stop.disabled) return;
    clearTimeout(stopPressTimer);
    stop.classList.remove('pressed');
    void stop.offsetWidth;
    stop.classList.add('pressed');
    stopPressTimer=setTimeout(() => stop.classList.remove('pressed'),240);
  });
  stop.onclick = () => 停这一个();

  /* 节点下拉 → 写模型表上这个节点那一格（`模型.改`）。成没成都重取这个节点的数据，按后台画 ——
     不停在你点的那一格上。档位不带：后台留旧档（新模型认的话）。 */
  document.getElementById('pick-model').onchange = async e => {
    const pick = e.target.value !== '' ? 下拉单[+e.target.value] : null;
    if(pick && S.sess){
      const r = await rpc('模型.改', {sessionId:S.sess, provider:pick.provider, model:pick.model});
      if(!r.ok) toast('没换成：' + (r.message || '后台拒了'));
    }
    await refresh();
    void extras.refreshInfo();
  };
  document.getElementById('pick-effort').onchange = async e => {
    const 模 = 数据在手() ? D.载.模型 : null;
    if(模 && S.sess && e.target.value){
      const r = await rpc('模型.改', {sessionId:S.sess, provider:模.provider, model:模.model, reasoningEffort:e.target.value});
      if(!r.ok) toast('档位没换成：' + (r.message || '后台拒了'));
    }
    await refresh();
    void extras.refreshInfo();
  };
  paint();
}

/* **节点模型下拉 ＝ 模型表上这个节点那一格的显示。**（2026-09-15 用户定：显示和调用是一个接口的两个显示）
   选中哪一格**只读** `D.载.模型` —— 服务端跟这个节点的对话一起送来、从模型表查的（`archive` 的「模型表」），
   调模型那一钩查的是同一个。数据不是这个节点的（`数据在手()` 不成立）就不选任何一格。
   这里不记模型选择。可选目录由新项目、树上全局与节点选择器共用，并按需刷新；
   `routableProviders` 决定这个模型此刻有没有 adapter 在服务。 */
let 目录 = null, 目录取着 = null, 目录需刷新 = false, 目录再问 = 0, 下拉单 = [];
function 取目录(强制 = false){
  if(目录取着){
    if(强制) 目录需刷新 = true;
    return 目录取着;
  }
  if(!强制 && Date.now() < 目录再问) return Promise.resolve(目录 ? {ok:true, value:目录} : {ok:false, message:'模型目录尚未就绪，请稍后重试'});
  目录取着 = (async () => {
    let r;
    do{
      目录需刷新 = false;
      try{ r = await rpc('llm.models', {}, null, true); }
      catch(error){ r = {ok:false, message:String(error.message || error)}; }
      /* 配置更新后，正在返回的旧名单作废；同一批读取者等待新的名单。 */
      if(目录需刷新) continue;
      /* 启动时的空名单不替换已有目录；失败两秒后再试，成功名单三十秒后可重读。 */
      if(r.ok && ((r.value.groups || []).length || (r.value.removedProviders || []).length)){
        目录 = r.value; 目录再问 = Date.now() + 30000;
        画脸();
      }else{
        目录再问 = Date.now() + 2000;
        if(r.ok) r = {ok:false, message:'模型目录尚未就绪，请稍后重试'};
      }
    }while(目录需刷新);
    return r;
  })().finally(() => { 目录取着 = null; });
  return 目录取着;
}
function paintModels(){
  const sel = document.getElementById('pick-model');
  const eff = document.getElementById('pick-effort');
  if(!sel) return;
  if(!目录 || Date.now() >= 目录再问) void 取目录();
  const 模 = 数据在手() ? (D.载.模型 || null) : null;
  const 读不出 = !模;
  const cur = 模 || {};
  const routable = !!模 && !!目录 && (目录.routableProviders || []).includes(cur.provider);
  /* 下拉的 value 用**下标**,不打包字符串 —— provider 和 model 都是外部给的 id,
     任何分隔符都可能出现在里面。存下标就没有分隔符这回事。 */
  const flat = [];
  let hit = false;
  for(const g of (目录 && 目录.groups) || []) for(const m of g.models || []){
    if(cur.provider===g.id && cur.model===m.id) hit = true;
    flat.push({provider:g.id, model:m.id, name:m.name||m.id, efforts:(m.reasoning && m.reasoning.efforts) || []});
  }
  /* 当前这个没在目录里也要出现 —— 否则下拉里选中的是别人 */
  if(cur.model && !hit) flat.unshift({provider:cur.provider, model:cur.model, name:cur.model+'（不在目录里）'});
  下拉单 = flat;
  /* 读不出（数据还没到／不是这个节点的）就摆一格选中着 —— 不摆，浏览器会自动选中第一项，那就是谎 */
  sel.innerHTML = (读不出 ? '<option value="" selected>读取中…</option>' : '') + flat.map((x,i) =>
    `<option value="${i}"${cur.provider===x.provider&&cur.model===x.model?' selected':''}>${esc(x.name)}</option>`).join('');
  sel.title = 读不出 ? '这个节点的数据还没到' : routable ? '这个节点调模型发的就是这一个'
    : '这个模型没有 adapter 在服务 —— 这个节点跑不动';
  sel.classList.toggle('bad', !读不出 && !!目录 && !routable);

  /* 档位：同一格里的 `reasoningEffort`，选中的就是发出去的那一档。
     这个模型的档位表里没有它也要摆出来 —— 否则浏览器自动选中第一项（Off），又是一句谎 */
  const 这模型 = flat.find(x => x.provider===cur.provider && x.model===cur.model);
  const 档们 = (这模型 && 这模型.efforts) || [];
  const 档 = cur.reasoningEffort || '';
  const 有它 = 档们.some(x => x.id === 档);
  eff.hidden = 读不出;
  eff.disabled = 读不出 || !档们.length;
  eff.innerHTML = 读不出 ? '' : (有它 ? '' : `<option value="" selected>${esc(档 || '默认')}</option>`) +
    档们.map(x => `<option value="${esc(x.id)}"${x.id===档?' selected':''}>${esc(x.name||x.id)}</option>`).join('');
  eff.title = '这个节点调模型发的就是这一档';
}

/* 对话里的一次工具调用 → 轨迹页上它那一条记录。
   找不到不许静默 —— 说清是「这一条不在轨迹里」,不是按钮坏了。 */
function inspectCall(callId){
  showTab('trace');
  const i = S.flat.findIndex(c => c.callId === callId);
  if(i < 0){ toast('轨迹里没有这一条调用（' + callId + '）'); return; }
  traceOverview?.reveal(S.flat[i].index);
  const box = document.getElementById('pane-trace');
  const row = box.querySelector('[data-i="' + i + '"]');
  if(!row){ toast('轨迹这一行还没画出来'); return; }
  box.querySelectorAll('.tj-row.lit').forEach(n => n.classList.remove('lit'));
  row.classList.add('lit');
  row.scrollIntoView({block:'center'});
}

/* ================= 一次性取历史 ================= */
/* ================= 三个动词:切到 · 取数据 · 画脸 =================
   全页只有这三个动词能改变你看到的东西。别处一律只读。 */

/** 换坐标。**唯一入口** —— 点下拉、点树上的卡、按新项目、取消、建成、别处来的动静，全走它。 */
async function 切到(下一个){
  const 前 = S.at;
  // 同一棵树内换节点只取对话，所属项目必须保留；否则文件请求会带 session=null。
  const 同项目 = 前.在 === 'project' && (下一个.在 || 'project') === 'project' && 树里有(下一个.看);
  S.at = { 在: 下一个.在 || 'project',
           项目: 下一个.项目 !== undefined ? 下一个.项目 : (同项目 ? 前.项目 : null),
           看: 下一个.看 !== undefined ? 下一个.看 : null };
  /* 从项目进草稿:记住你从哪儿来,取消要原样送回去(不把人甩到别的项目上) */
  if(S.at.在 === 'draft' && 前.在 === 'project') S.回哪 = 前.看;
  if(S.at.在 === 'project') S.回哪 = null;
  if(S.抽屉 === 'skill') void 取skill();

  /* 先画一次:坐标已经变了,脸就得跟着变 —— 哪怕数据还没到。
     数据没到的区域会画「读取中」,那是实话;继续挂着上一个项目才是撒谎。 */
  画脸();
  /* 同一棵树上换一格：树不动，只取那一格的对话（`取数据` 里还会再核一次两格都在树上） */
  if(S.at.在 === 'project')
    await 取数据(前.在 === 'project' && 树里有(前.看) ? '对话' : '全');
  if(数据在手() && S.at.看 === 下一个.看) void 看过提醒();
  else if(S.at.在 !== 'project') window.blueprintDesktop?.viewAttention?.(null);
  return S.at;
}

/** 取数据。**全页唯一一处 fetch 历史。**取完钉上它属于谁,再画一次全脸。
    `要` 说这一趟取哪几样（2026-09-17 起三种）：
    · `全`   —— 树 ＋ 这一格的对话。换项目、刷新、这一格自己动了。
    · `树`   —— 只换树，对话留着手上这份（别的格子动了 —— 见 `软刷新()`）。
    · `对话` —— 只换这一格的对话，树留着手上这棵（同一棵树上点了另一格）。
      树是整个项目的，点哪一格它都一样；原来每点一下都整棵重算一遍。
    手上的东西不够「留着」时，自动退回 `全`。 */
let 取序 = 0, 树已落 = 0;   /* 发出去的第几次 · 已经画上去的最新一棵树是第几次取的 —— 晚回来的旧树不许盖新的 */
let 历史请求 = null;
function 取数据(要 = '全', 操作项目 = null){
  const 要的 = 操作项目 || S.at.看;
  if(!操作项目 && 要 === '树' && !数据在手()) 要 = '全';   /* 手上没有这一格的对话，就没有「留着」可言 */
  /* 只换对话的前提：手上有树、这一格就在树上画着（Sub、没画出来的支线不算 ——
     点它们时树上那一托／那一条带要跟着换，得整棵重算） */
  if(要 === '对话' && !树里有(要的)) 要 = '全';
  // 相同取数共用整趟工作，响应只落屏一次；换节点/页或补取更多内容时取消旧请求。
  if(操作项目) return 执行取数据(要, 操作项目);
  const 页 = 要 === '树' ? '' : ({trace:'轨迹',id:'身份'})[S.tab] || '';
  if(历史请求?.会话 === 要的 && (历史请求.页 === 页 || 要 === '树')
      && (历史请求.要 === 要 || 历史请求.要 === '全' && 要 === '树')) return 历史请求.工作;
  历史请求?.控制.abort();
  const 控制 = new AbortController();
  const 工作 = 执行取数据(要, null, 控制.signal).finally(() => {
    if(历史请求?.控制 === 控制) 历史请求 = null;
  });
  历史请求 = {会话:要的,要,页,控制,工作};
  return 工作;
}
async function 执行取数据(要, 操作项目 = null, signal){
  const 要的 = 操作项目 || S.at.看;
  const 起 = ++取序;
  let d = null;
  try{
    const 问 = [];
    if(要的) 问.push('session=' + encodeURIComponent(要的));
    if(要 !== '全') 问.push('要=' + encodeURIComponent(要));
    /* 轨迹、身份这两份都重，只在那一页开着时要（只取树的那一趟不带对话，也就不带它们） */
    const 页 = 要 === '树' ? '' : ({trace:'轨迹', id:'身份'})[S.tab] || '';
    if(页) 问.push('页=' + encodeURIComponent(页));
    const r = await fetch('api/history' + (问.length ? '?' + 问.join('&') : ''), {signal});
    if(r.ok) d = await r.json();
  }catch(_){ if(signal?.aborted) return; /* 后端不在 */ }
  if(signal?.aborted) return;

  /* 批量操作只取点击时项目的新名单，不把它落到已切换的界面上。 */
  if(操作项目) return d;
  /* 取的路上你已经换了一格 —— 这份是上一格的，新那一格自己的取数已经在路上了 */
  if(要的 !== S.at.看) return;
  if(!d){ live = false; S.note = '后端不在 —— 起 ./dsh web'; 画脸(); return 排补取(); }
  live = true;
  if(!d.ok){ S.note = d.message || '读不出这个会话'; 画脸(); return 排补取(); }

  if(要 === '树'){
    if(起 < 树已落 || d.session !== D.会话) return;
    /* 这一格自己开跑／收工翻了面 —— 收工那一下对话要整条对一次账，那就整份取 */
    if(!!d.busy !== S.busy) return 取数据();
    树已落 = 起;
    S.sessions = d.sessions || [];
    S.projRoot = d['项目根'] || S.projRoot || '';
    S.lineage = d.lineage || null;
    D = { 会话: D.会话, 载: { ...D.载, sessions: d.sessions, lineage: d.lineage, busy: d.busy,
      工作时间:合并工作时间(d.工作时间) } };
    画脸(树刷新区域);
    return;
  }
  const 带树 = 要 !== '对话';
  if(带树) 树已落 = 起;

  /* 服务端可能认领了另一个会话(你没指定时它自己挑最近的)——**以它说的为准**,
     并且把坐标同步过去,不然坐标与数据又是两个故事。 */
  S.at.看 = d.session;
  if(带树) S.at.项目 = (d.lineage && d.lineage.root) || d.session;
  S.sessions = d.sessions || [];
  S.projRoot = d['项目根'] || S.projRoot || '';
  S.busy = !!d.busy;
  S['busy自'] = d['busy自'] || 0;   /* 活条秒表的起点 */
  if(Number.isSafeInteger(d['busy轮']))navOpenTurns.set(d.session,d['busy轮']);
  else if(!d.busy)navOpenTurns.delete(d.session);
  /* 留着的那棵树：只把「你站在哪条线上」改过来（轨迹页的时间线从 `current` 往上认路） */
  S.lineage = 带树 ? (d.lineage || null) : (S.lineage ? { ...S.lineage, current: d.session } : null);
  S.turns = d.turns || null;   /* null ＝ 这次没要轨迹（那一页没开），不是「一步没跑」 */
  S.note = d.note || '';
  const 工作时间 = 合并工作时间(d.工作时间);
  D = { 会话: d.session, 载: { ...d, lineage: 带树 ? d.lineage : S.lineage, 工作时间 } };
  画脸();
  查看当前提醒();
  /* 认领了一条会话、血脉却没回来 ＝ 还没取齐（多半是后端刚起、sessionController 还没挂上）。 */
  if(带树 && d.session && !d.lineage) return 排补取();
  取齐了();
}

/* **重启那一刻取不齐，就过一会儿再取**（2026-09-13 修）。
   程序一起来网页就连上了，可 dsh 那几个可选服务（sessionController）还没挂齐 ——
   这一刻取历史，服务端如实说「冷会话读不出来」，模型目录也读不出。
   原来这张脸取一次就不再取了，于是停在空树上，非得手动刷新一下。
   现在没取齐就隔一会儿再取：1 秒、2 秒、4 秒……最长 10 秒一次，取齐了停。
   取齐那一下把当初没做成的两件补上：接活流、读模型目录。 */
let 补取 = null, 补取间隔 = 1000, 缺过 = false;
function 排补取(){
  缺过 = true;
  if(补取) return;
  补取 = setTimeout(() => { 补取 = null; if(S.at.在 === 'project') 取数据(); }, 补取间隔);
  补取间隔 = Math.min(补取间隔 * 2, 10000);
}
function 取齐了(){
  补取间隔 = 1000;
  if(!缺过) return;
  缺过 = false;
  connect();
  paintModels();
}

/* 老名字留着:全页几十处在叫 refresh()。它现在就是「按当前坐标再取一次」。 */
async function refresh(){ if(S.at.在 === 'project') return 取数据(); 画脸(); }

/* **合并版重取**（2026-09-05）。树是**全项目**的:任何一格动了拍子,这张树都该跟着动。
   可"动"这件事一秒能来几十帧(几十个节点同时在跑),每帧取一次数据是白烧 ——
   所以攒一小会儿,取一次。攒的这几百毫秒是故意的:界面跟得上,后端不被打死。
   `api/history` 要扫柜子和各会话的账,它不是一次便宜的取数。 */
/* `要`（2026-09-15）：**别的格子**动了只要 `树` —— 你正看着的这一格一个字都没多，
   原来每次都把它整条对话（上兆）重传一遍。这一格自己动了才要 `全`。
   攒着的这一小会儿里只要有一次要 `全`，这一趟就是 `全`。
   **上一趟没回来，不发下一趟**（2026-09-17）：几十格同时在跑时，一趟取数可能比 700ms 还长 ——
   原来到点就发，请求一趟压一趟排在后端，越排越慢。现在路上有一趟时只记一笔「欠一次」，
   它回来之后再攒 700ms 补一趟：动得再多，同一时刻路上也只有一趟。 */
let 攒着 = null, 攒着要全 = false, 软取中 = false, 欠一次 = false;
function 软刷新(要 = '全'){
  if(S.at.在 !== 'project') return;
  if(要 === '全') 攒着要全 = true;
  if(document.visibilityState === 'hidden'){ 欠一次 = true; return; }
  if(软取中){ 欠一次 = true; return; }
  if(攒着) return;
  攒着 = setTimeout(async () => {
    攒着 = null;
    if(S.at.在 !== 'project') return;
    if(document.visibilityState === 'hidden'){ 欠一次 = true; return; }
    const 这趟 = 攒着要全 ? '全' : '树'; 攒着要全 = false;
    软取中 = true;
    try{ await 取数据(这趟); } finally { 软取中 = false; }
    if(欠一次){ 欠一次 = false; 软刷新(攒着要全 ? '全' : '树'); }
  }, 700);
}

// 隐藏页只记一次待更新，回到页面再取；SSE 仍接收对话、问题和提醒。
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){
    if(攒着){ clearTimeout(攒着); 攒着 = null; 欠一次 = true; }
  }else if(欠一次){
    欠一次 = false;
    软刷新(攒着要全 ? '全' : '树');
  }
});

/* 「在跑」那一列的攒 —— 同一个道理:二十格同时开跑,取一次就够。 */
let 攒着在跑 = null;
function 攒着取在跑(){
  if(攒着在跑) return;
  攒着在跑 = setTimeout(() => { 攒着在跑 = null; if(S.抽屉 === '在跑') 取在跑(); }, 500);
}

/** 数据跟坐标对得上吗。对不上 ＝ 手上这份是别人的,不许拿它画。 */
const 数据在手 = () => S.at.在 === 'project' && D.会话 && D.会话 === S.at.看;

/* ---- 那张表:界面上每一块，一块一行。加一块就在这儿加一行 ----
   每个函数必须把 `S.at.在` 的三种值都答一遍：project / draft / empty。
   **答不出来就说明你加的那种状态没想清楚**，别让它落到 else 里蒙混过去。 */
const 脸 = [
  ['项目下拉', () => paintPicker()],
  ['顶栏那行字', () => paintTop()],
  ['在跑那个钮', () => 画在跑钮()],
  ['左栏页签', () => 画左栏页签()],
  ['树与脚注', () => 画树()],
  /* 铭牌上的字是从卡上抄的 —— **必须排在「树与脚注」后面**,卡还没画出来没得抄 */
  ['右列铭牌', () => 画右铭牌()],
  ['节点统计', () => 画统计()],
  ['轨迹', () => 画轨迹()],
  ['信息流', () => 画信息流()],
  ['身份那一页', () => 画身份()],
  ['流', () => 画流()],
  ['产物', () => 产物画廊?.sync()],
  ['用户终端', () => 用户终端?.sync()],
  ['输入条与砖', () => 画输入条与砖()],
  /* 模型下拉**跟着你看的那一格走**（2026-09-15 修：原来只在换项目时重读，
     点树上别的节点，下拉还挂着 Blueprint 的 DeepSeek，而那个节点在用智谱）。
     只在「看的那一格」跟下拉上次读的不是同一个时才问后台 —— 画脸一秒好几次，不能每次都问。
     draft／empty 没有会话，不画。 */
  ['模型下拉', () => paintModels()],
  ['右抽屉', () => 画抽屉()],
];

// 别的节点只更新树与项目状态，不反复刷新当前对话、导航、输入框和抽屉。
const 树刷新区域 = new Set(['项目下拉', '顶栏那行字', '树与脚注', '右列铭牌', '节点统计', '轨迹', '信息流']);
/** 默认画整页，也可只画已变化的区域；每块独立报错。 */
function 画脸(范围 = null){
  for(const [名, 画] of 脸){
    if(范围 && !范围.has(名)) continue;
    try{ 画(); }
    catch(e){ console.error('画脸 · ' + 名 + ' 炸了：', e); }
  }
}

const 说不清 = () => S.at.在 === 'draft' ? '这个项目还没建起来。<br>填完右边那张表,它才存在。'
                  : S.at.在 === 'empty' ? '还没有项目 —— 按左上角「新项目」开一个。'
                  : '读取中…';

/** **这一格在不在我手上这棵树里** —— 纯存在判断，不猜。
    树是**项目的血脉**，跟「历史数据现在是谁的」无关：同一个项目里切到哪一格都是同一棵。
    在，就别拆（切节点不该动树）；不在，说明换项目了，才该拆。 */
const 树里有 = (id) => {
  const T = S.lineage && S.lineage.tree;
  if(!T || !T.nodes || !id) return false;
  return T.nodes.some(n => n.node_id === id || (n.带们 || []).some(b => b.会话 === id));
};

/* ================= 右列页签行最左那块铭牌 =================
   回答一个问题:**右边这一列此刻装的是哪一格。**（2026-09-10 用户要的。）
   树在左边、流在右边,翻久了就不知道右边这些字是谁说的 —— 答案钉在它自己头上。

   三个字**一个都不是这儿算的**:它们照抄左边那张卡自己印出来的字 ——
   卡头那个号、卡头那个名字、被选中那条带上 part 那一格。
   为什么不拿 `S.lineage.tree` 现算:号和 part 在卡上各有一条显示规矩
   (Blueprint 那一格印 `blueprint` 不印 `0`;`blueprint` 这条带印 `print` —— 截短，不是座位名),
   规矩住在 `mirror-render.js` 里。在这儿再算一遍 ＝ 把那张表抄第二份,
   哪天那边改了,牌子上写的就跟卡上**不是一个词**了 —— 而这块牌子的全部用处
   就是让你拿它去树上认那张卡。照抄不会跑偏。

   代价说清楚:**它要求树已经画出来了**(所以在 `脸` 那张表里排在「树与脚注」后面)。
   卡还没画出来的时候它照实说「读取中」,不猜。

   普通节点认带，Sub 认父节点下面的行；铭牌与右栏都指向当前实际会话。 */
function 画右铭牌(){
  const el = document.getElementById('nplate');
  if(!el) return;
  const 素 = (话, 悬) => { el.className = 'nplate void';
                           el.innerHTML = '<b>' + esc(话) + '</b>';
                           el.title = 悬 || 话; };
  if(S.at.在 === 'draft') return 素('新项目 · 还没建', '这个项目还没建起来 —— 右边这一列装的是那张表');
  if(S.at.在 === 'empty') return 素('还没有项目', '按左上角「新项目」开一个');
  const id = S.sess;
  if(!id) return 素('还没落在哪一格');

  /* Sub 在父节点的托上，不是 .band。主题照抄树上的字，类型读独立元数据。 */
  const sub = [...document.querySelectorAll('#tree-stage .srow[data-sub]')]
    .find(row => row.dataset.sub === id || row.dataset.open === id);
  if(sub){
    const 砖 = sub.closest('.nbrick');
    const 取 = sel => 砖?.querySelector(sel)?.textContent.trim() || '';
    const 号 = 取('.bhead .num'), 名 = 取('.bhead .bname');
    const 邻带 = sub.closest('.nsub')?.previousElementSibling;
    const 父 = S.sessions.find(s => s.id === id)?.parentSession
      || (邻带?.matches('.band') ? 邻带.dataset.node : '') || '';
    const 主题 = sub.querySelector('.stx')?.textContent.trim() || '主题未形成';
    const 类 = ({brain:'BRAIN', do:'DO', answer:'ANSWER'})[sub.dataset.kind] || 'SUB';
    const 父名 = [号, 名].filter(Boolean).join(' · ') || '父节点';
    el.className = 'nplate sub';
    el.innerHTML = '<button type="button" class="nplate-parent"'
      + (父 ? '' : ' disabled') + ' title="' + esc('返回 ' + 父名) + '" aria-label="'
      + esc('返回父节点 ' + 父名) + '">' + esc(号 || '父节点')
      + '<span class="arrow" aria-hidden="true">›</span></button>'
      + '<em>' + 类 + '</em><b>' + esc(主题) + '</b>';
    el.title = 'Sub\n主题：' + 主题
      + '\n派出者：' + 父名 + (父 ? '\n父会话：' + 父 : '')
      + '\n会话：' + id + '\n点击父节点编号返回';
    el.querySelector('.nplate-parent').onclick = () => {
      if(父) 切到({在:'project', 项目:S.at.项目, 看:父});
    };
    return;
  }

  const 砖们 = document.querySelectorAll('#tree-stage .nbrick');
  let 带 = null;
  for(const b of document.querySelectorAll('#tree-stage .nbrick .band'))
    if(b.dataset.node === id){ 带 = b; break; }
  if(!带){
    /* **「树还没画」和「这一格不在树上」不是一回事**(图景:折叠可以有,暗层不能有)。 */
    return 砖们.length ? 素('不在这棵树上 · ' + shortId(id),
                            '右边装着 ' + id + ',可左边这棵树上没有它 —— 多半是换项目换了一半')
                       : 素('读取中…', '左边那棵树还没画出来,牌子上的字是从卡上抄的');
  }
  const 砖 = 带.closest('.nbrick');
  const 取 = (根, 选) => { const x = 根 && 根.querySelector(选); return x ? x.textContent.trim() : ''; };
  const 号 = 取(砖, '.bhead .num'), 名 = 取(砖, '.bhead .bname'), 类 = 取(带, '.cell.pn');
  el.className = 'nplate';
  el.innerHTML = (号 ? '<i>' + esc(号) + '</i>' : '')
               + (类 ? '<em>' + esc(类) + '</em>' : '')
               + '<b>' + esc(名 || '没名字') + '</b>';
  el.title = '右边这一列此刻装的是这一格 —— ' + [号, 类, 名].filter(Boolean).join(' · ')
           + '\n会话 ' + id + '\n换一格:点左边树上那条带';
}

function 画树(){
  /* ⚠️ **不能只认 `数据在手()`**（2026-09-05 用户报：切节点时所有连接线闪一下）。
     那一句问的是"历史数据是不是这一格的"——点另一格的瞬间它当然是假的，
     于是下面那条空态路把卡和线**全擦掉**，等 `取数据()` 回来再画一遍。
     可树根本没变。**切节点不该动树。** */
  if(数据在手() || (S.at.在 === 'project' && 树里有(S.at.看))){ drawTree(); return; }
  /* 新项目那张表开着：左边是**这个新项目的第一个节点和它的镜像**，不是上一个项目（2026-09-17 用户要的）。 */
  if(S.at.在 === 'draft'){ drawTree(草稿树()); return; }
  /* 不在项目里:**用树渲染器自己的空态口子**(.stage-empty),
     不去动 #tree-scroll 的 innerHTML —— 那底下挂着渲染器认得的舞台节点,
     换掉它渲染器会对着一个已经离开文档的节点继续画(2026-08-19 的 `借左栏` 就是这个坑)。 */
  const stage = document.getElementById('tree-stage');
  if(stage){
    /* 渲染器画上去的每一种东西都得在这张单子里（跟 mirror-render.js 的 render() 头上那张同一份）——
       原来这儿还是旧卡片的 .card／.goal，于是空态底下一直挂着上一个项目的树 */
    stage.querySelectorAll('.card,.goal,.stage-empty,.nbrick,.ngbrick,.npz,.nkz,.nmodel,.nmenu,.nsub,.nknot,.nfold').forEach(el => el.remove());
    { const st = document.getElementById('tree-stats'); if(st) st.hidden = true; }
    const w = document.getElementById('tree-wires'); if(w) w.innerHTML = '';
    上回画的树 = '';   /* 舞台清空了，下一份数据必须重画（哪怕字节一样） */
    const d = document.createElement('div');
    d.className = 'stage-empty'; d.innerHTML = 说不清();
    stage.appendChild(d);
  }
}

/* ================= 右抽屉:文件浏览器 =================
   只列当前一层，展开时再取子目录。缓存、展开和请求属于同一个根／项目，旧请求不能串过来。
   文件很多时保留完整列表，只绘制视口附近的行；刷新不改变展开与滚动位置。 */
function 新文件状态(根=null, 项目=null){
  return { 根, 项目, 载:null, 错:'', 取中:false, 目录:new Map(), 开:new Set(), 滚:0, 焦:null, 行们:[], 刷新中:false };
}
const 文件在手 = () => S.文件.根 === S.抽屉 &&
  (!(根们[S.抽屉]||{}).要项目 || S.文件.项目 === S.at.项目);
const 文件仍在 = F => S.文件 === F && 文件在手();

async function 取文件层(F, 位){
  let 层 = F.目录.get(位);
  if(!层){ 层 = { 子:null, 错:'', 请求:null }; F.目录.set(位, 层); }
  if(层.请求) return 层.请求;
  const 原错 = 层.错 || (!位 && F.错);
  层.错 = '';
  层.请求 = (async()=>{
    let d;
    try{
      const query = new URLSearchParams({ 根:F.根, 位置:位 });
      if((根们[F.根]||{}).要项目) query.set('session', F.项目);
      const r = await fetch('api/files?' + query);
      if(r.status === 404) throw new Error('文件服务尚未更新，请重新启动 Blueprint');
      d = await r.json();
      if(!d.ok) throw new Error(d.message || '读取文件夹失败');
      if(d.树.some(n => n.夹 && Array.isArray(n.子))) throw new Error('文件服务尚未更新，请重新启动 Blueprint');
      const 变了 = JSON.stringify(层.子) !== JSON.stringify(d.树);
      层.子 = d.树;
      if(!位){ F.载 = d; F.错 = ''; F.取中 = false; }
      return 变了 || !!原错;
    }catch(e){
      层.错 = e.message || '读取文件夹失败';
      if(!位){ F.错 = 层.错; F.取中 = false; }
      return true;
    }finally{ 层.请求 = null; }
  })();
  const 改了 = await 层.请求;
  if(文件仍在(F) && 改了) 画脸();
  return 改了;
}

async function 刷新展开(F, 位=''){
  const 子 = F.目录.get(位)?.子 || [];
  await Promise.all(子.filter(n => n.夹).map(async n => {
    const p = 位 ? 位 + '/' + n.名 : n.名;
    if(!文件仍在(F) || !F.开.has(p)) return;
    await 取文件层(F, p);
    if(文件仍在(F) && F.开.has(p)) await 刷新展开(F, p);
  }));
}

async function 取文件(){
  const 根 = S.抽屉, 卡 = 根们[根];
  if(!卡 || 卡.画) return;
  const 谁 = 卡.要项目 ? S.at.项目 : null;
  if(!文件在手()) S.文件 = 新文件状态(根, 谁);
  const F = S.文件;
  if(卡.要项目 && !谁){ 画脸(); return; }
  if(F.刷新中) return;
  F.刷新中 = true;
  if(!F.载){ F.取中 = true; 画脸(); }
  try{
    await 取文件层(F, '');
    if(文件仍在(F)) await 刷新展开(F);
  }finally{ F.刷新中 = false; }
}

function 开抽屉(根){
  S.抽屉 = (S.抽屉 === 根) ? null : 根;
  const 卡 = 根们[S.抽屉] || {};
  if(S.抽屉 && 卡.取) 卡.取();
  else if(S.抽屉) 取文件();
  画脸();
}

async function 展开文件夹(p, 开=!S.文件.开.has(p)){
  const F = S.文件;
  F.焦 = p;
  if(!开){ F.开.delete(p); 画脸(); return; }
  F.开.add(p);
  const 请求 = 取文件层(F, p);
  画脸();
  await 请求;
  if(文件仍在(F) && F.开.has(p)){ await 刷新展开(F, p); 画脸(); }
}

const 文件行高 = 24;
const 文件图标 = 夹 => 夹
  ? '<svg class="fz-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4V2.5h5L8 4h6.5v9.5h-13z"/></svg>'
  : '<svg class="fz-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h6l4 4v9H3zM9 1.5v4h4"/></svg>';

function 文件行们(F){
  const 行们 = [];
  function 走(子, 前缀, 深){
    for(const n of 子){
      const 路 = 前缀 ? 前缀 + '/' + n.名 : n.名;
      行们.push({ 节点:n, 路, 深 });
      if(!n.夹 || !F.开.has(路)) continue;
      const 层 = F.目录.get(路);
      if(层?.子) 走(层.子, 路, 深+1);
      if(层?.错) 行们.push({ 路, 深:深+1, 提示:层.错, 重试:true });
      else if(!层?.子) 行们.push({ 路, 深:深+1, 提示:译('读取中…') });
      else if(!层.子.length) 行们.push({ 路, 深:深+1, 提示:译('空文件夹') });
    }
  }
  走(F.目录.get('')?.子 || [], '', 0);
  return 行们;
}

function 树行(行, i){
  const F = S.文件, { 节点:n, 路, 深 } = 行;
  const 缩 = 12 + 深 * 16;
  if(!n) return `<div class="fz-status" style="padding-left:${缩+16}px"${行.重试 ? ` data-retry="${esc(路)}" role="button" tabindex="0" title="点击重试"` : ''}>${esc(行.提示)}</div>`;
  const 开 = n.夹 && F.开.has(路);
  const 选 = !n.夹 && S.左开.some(t => t.key === 'file:' + F.根 + ':' + 路);
  return `<div class="fz-row${n.夹 ? ' dir' : ''}${选 ? ' open' : ''}" data-i="${i}" ${n.夹 ? 'data-p' : 'data-f'}="${esc(路)}"
    role="treeitem" aria-level="${深+1}"${n.夹 ? ` aria-expanded="${开}"` : ` aria-selected="${选}"`}
    tabindex="${F.焦 === 路 || (!F.焦 && i === 0) ? 0 : -1}" style="padding-left:${缩}px" title="${esc(路)}">
    <span class="fz-tw">${n.夹 ? (开 ? '▾' : '▸') : ''}</span>${文件图标(n.夹)}<span class="fz-n">${esc(n.名)}</span></div>`;
}

function 画文件视口(){
  const tree = document.getElementById('dw-tree');
  if(!tree || !文件在手()) return;
  const F = S.文件, 行们 = F.行们;
  const active = document.activeElement?.closest('#dw-tree .fz-row');
  const 起 = Math.max(0, Math.floor(tree.scrollTop / 文件行高) - 12);
  const 止 = Math.min(行们.length, 起 + Math.ceil((tree.clientHeight || 600) / 文件行高) + 24);
  tree.innerHTML = `<div aria-hidden="true" style="height:${起*文件行高}px"></div>`
    + 行们.slice(起, 止).map((行,j)=>树行(行,起+j)).join('')
    + `<div aria-hidden="true" style="height:${Math.max(0,(行们.length-止)*文件行高)}px"></div>`;
  F.滚 = tree.scrollTop;
  if(active){ const i = 行们.findIndex(r => r.节点 && r.路 === F.焦); tree.querySelector(`[data-i="${i}"]`)?.focus({preventScroll:true}); }
}

function 画文件浏览器(body){
  const F = S.文件, before = document.getElementById('dw-tree');
  const 有焦 = !!document.activeElement?.closest('#dw-tree');
  if(before && before.dataset.root === F.根 && before.dataset.project === (F.项目 || '')) F.滚 = before.scrollTop;
  F.行们 = 文件行们(F);
  body.innerHTML = `<div class="fz-root" title="${esc(F.载.根)}">${文件图标(true)}<strong>${esc(F.载.名)}</strong></div>`
    + `<div class="fz-abs">${esc(F.载.根)}</div>`
    + (F.载.提示 ? `<div class="fz-note">${esc(F.载.提示)}</div>` : '')
    + (F.错 ? `<div class="fz-note">${esc(F.错)}</div>` : '')
    + (!F.行们.length ? '<div class="fz-note">这个文件夹还是空的。</div>' : '')
    + `<div id="dw-tree" role="tree" aria-label="${esc(F.载.名)} 文件" data-root="${esc(F.根)}" data-project="${esc(F.项目 || '')}"></div>`;
  const tree = document.getElementById('dw-tree');
  // 先建立完整高度再还原位置，避免新容器为空时浏览器把 scrollTop 压回 0。
  tree.innerHTML = `<div style="height:${F.行们.length*文件行高}px"></div>`;
  tree.scrollTop = F.滚;
  画文件视口();
  tree.addEventListener('scroll', 画文件视口, {passive:true});
  if(有焦){ const i = F.行们.findIndex(r => r.节点 && r.路 === F.焦); tree.querySelector(`[data-i="${i}"]`)?.focus({preventScroll:true}); }
}

/* 只刷新打开的目录。页面／抽屉关着时不读，窗口回来时立即核对。 */
function 核对文件浏览器(){
  if(document.hidden || !S.抽屉 || (根们[S.抽屉]||{}).画) return;
  取文件();
}
setInterval(核对文件浏览器, 5000);
window.addEventListener('focus', 核对文件浏览器);
document.addEventListener('visibilitychange', 核对文件浏览器);

/* ================= 抽屉住户:在跑 =================
   **后台此刻有什么东西占着。** 两类,服务端 `/api/running` 算好了送过来:
     · 节点 —— 跑着的那一轮（这里显示全部项目，树上的 Stop All 只管当前项目）；
     · 工作 —— dsh 自己那本后台工作册子(`ctx.jobs`:后台 bash、subagent 委派)。

   ⚠️ **这一列只看得见"登记过的"。** 截图/录屏那几个 Chrome、ffmpeg 没有登记,
      不在这儿 —— 它们活几秒自己收。这句话也写在服务端 `running()` 头上,
      改的时候两边一起改(这是唯一一处重复,因为两边都得让人一眼看见这个边界)。

   停法**按行分派**:节点走 `停一个()`(输入框那个「停」、树上的「全停」,三处同一份实现);
   工作走 `/api/kill`。两条路是因为它们真是两件事,不是同一件事的两种写法。 */

/** 跑了多久,给人看的。分钟以上不给秒 —— 你要看的是"是不是泡太久了",不是秒表。 */
const 跑了多久 = ms => {
  if(ms === null || ms === undefined) return '';
  const s = Math.max(0, Math.round(ms/1000));
  if(s < 60) return s + ' 秒';
  const m = Math.round(s/60);
  return m < 60 ? m + ' 分钟' : Math.floor(m/60) + ' 小时 ' + (m%60) + ' 分';
};
