/* ================= Feed 页:每轮收到与交出的信息 =================
   零自有数据:api/flow 把材料和各会话的账折好,这儿只画已发生的收发记录。

   **画法跟轨迹表一个样、一个方向**(2026-08-31 用户裁定):
     · 样子 —— 行头是 `.tj-turn`、每一块是 `.tj-row`,跟 drawTurns() 共用同一批类,
       样式一个字都不重写(改一边两边一起变)。
     · 方向 —— **从上往下按发生顺序**,最早的在上。原来这一页反着排(最新的在上),
       两张表要来回换脑子。
   一行的读法也照抄轨迹:左边名字、箭头后面导读、最右主人 ——「调用 → 结果」那一格
   在这儿是「这块料 → 它说什么」。
   点块行 → 读全文浮层(api/file);点行头 → 跳那条会话的对话页。 */
let 流序 = 0, 流位块 = [], 流行们 = [];
/* 印 → 轨迹那七个 tag 里的哪一格颜色。**认不出的印原样印、走中性色** ——
   服务端加第八个印不用改这里(协议 0.4)。 */
const 印色 = {出:'k-message', 取:'k-tool', 进:'k-context', 递:'k-context',
              弧:'k-system', 换版:'k-system', 话:'k-user'};
/* 印在界面上显示的名字跟着界面语言；认不出的照原样印。 */
const 印名 = 印 => ({出:译('出'), 取:译('取'), 进:译('进'), 递:译('递'), 弧:译('弧'), 换版:译('换版'), 话:译('话')})[印] ?? 印;
/* 一块料的全名。**名称跟种类同名的那种(初始用户要求)不重复印。**
   信息流和对话里的 context 词块共用这一份 —— 服务端 `archive` 的 `全名()` 是同一条规矩。 */
const 全名 = (种类, 名称) => (String(名称)===String(种类) ? String(种类) : 种类+'·'+名称);

/** 一个印 → 一个词块。服务端那行信封拆出来是什么就摆什么，这儿一个字不算。
    没名字的(弧递的话、你自己说的那句)不摆:它们的全文就在这条流上,你正看着,
    不需要一个词块把你送去别处。 */
const 词块化 = 印们 => (印们 || []).filter(p => p.名).map(p =>
  ({印:p.印, 标题:p.名+' v'+p.版本, 说明:p.简介 || '', 位:p.位 || ''}));

/** 这**一步**吃进／交出了哪几块料 —— 服务端 `步块` 那一条照着摆。
    一步 ＝ 一条会话事件 ＝ 屏幕上一排,挂在它出自那一行底下(渲染器 `挂词块()`)。
    实时那一头是 `blueprint.块排` 一帧一排,走的是下面 feed 里那一行 —— 两条路
    同一个 `词块化()`,所以跑着长出来的和刷新后重画的是同一排东西。 */
function 步块OF(seq){
  const 条 = (数据在手() ? (D.载.步块 || []) : []).find(r => r.seq === seq);
  return 条 ? {进: 词块化(条.进), 出: 词块化(条.出)} : null;
}
async function 画信息流(){
  const host = document.getElementById('feed-body'); if(!host) return;
  /* 藏着不取:api/flow 要全量扫柜子和各会话的账,每次画脸都取是白烧。
     切进这一页时 `醒` 会现取,不会看到陈的。 */
  const pane = document.getElementById('pane-feed');
  if(pane && pane.hidden) return;
  const 我 = ++流序;
  let d = null;
  try{
    const r = await fetch('api/flow' + (S.at.看 ? '?session='+encodeURIComponent(S.at.看) : ''));
    if(r.ok) d = await r.json();
  }catch(_){ /* 后端不在 */ }
  if(我 !== 流序) return;                        /* 路上又发了一笔,让新的那笔画 */
  if(!d){ host.innerHTML = '<div class="feed-note">'+esc(译('后端不在 —— 起 ./dsh web'))+'</div>'; return; }
  if(!d.ok){ host.innerHTML = '<div class="feed-note">'+esc(d.message||译('读不出'))+'</div>'; return; }

  流位块 = []; 流行们 = d.流 || [];
  /* 一格可以有好几条线（每按一次「撤回／分叉」多一条）。名字是**那一格的**，
     几条线的名字一模一样 —— 支线后面缀上它自己那截 id，不然分不清正看的是哪一条。 */
  const 谁 = r => (r.号 ? r.号+' ' : '') + (r.名字 || String(r.会话||'').slice(0,12))
                + (r.支线 ? ' · '+译('支线')+' '+shortId(r.会话) : '');
  /* 一条记录 ＝ 轨迹表的一行,列位照抄:
       [版本] [印] [名字 → 它说什么] [主人]
     轨迹那一行是「调用 → 结果」,这一行是「这块料 → 它说什么」—— 同一个读法。
     `data-块` 挂在**整行**上(不是名字那一小块):轨迹点整行读全文,这儿也一样。
     没有全文可读的(弧递的话、用户那句、只给了信封的)标 `dud` —— 不装手型、不亮底,
     手型是一个承诺,兑现不了就不许摆出来。 */
  const 一行 = (印, 号, 左, 右, 主, 块) => '<div class="tj-row'+(块===undefined?' dud':'')+'"'
      + (块===undefined ? '' : ' data-块="'+块+'"')
      + ' title="'+esc(左+(右?' → '+右:''))+'">'
      + '<span class="ix">'+esc(号||'')+'</span>'
      + '<span class="tag '+(印色[印]||'k-context')+'">'+esc(印名(印))+'</span>'
      + '<span class="tx"><span class="lt'+(块===undefined?'':' blk')+'">'+esc(左)+'</span>'
      + (右 ? '<span class="rs">→ '+esc(右)+'</span>' : '')+'</span>'
      + '<span class="tm">'+esc(主||'')+'</span></div>';
  const 出块 = b => 一行('出', 'v'+b.版本, 全名(b.种类,b.名称), b.导读||'', b.主人||'', 流位块.push(b)-1);
  /* 带位置的「进」跟「出」一样点得开(服务端 `对柜子()` 给的位置);
     没位置的(弧递的话、用户那句、配不上柜子的印)仍是 dud —— 它没有全文可读。 */
  const 进条 = p => p.名
    ? 一行(p.印||'进', 'v'+p.版本, p.名, p.简介||'', p.主人||'',
           p.位 ? 流位块.push({位:p.位, 种类:p.名, 名称:p.名, 版本:p.版本})-1 : undefined)
    : 一行(p.印||'进', '', p.说||'', '', p.主人||'');

  const 段 = [];
  /* Feed 按发生顺序展示每轮收到和交出的信息。 */
  段.push('<div class="feed-h">'+esc(译('已发生 —— 一行一轮,从上往下按发生顺序'))+'</div>');
  if (!流行们.length) 段.push('<div class="feed-note">'+esc(译('这个节点还没有收到过递进来的话。'))+'</div>');
  /* **最早的在上**,跟轨迹表同一个方向(2026-08-31 用户裁定)。原来这一页倒着排,
     两张并排的表一个从上往下读一个从下往上读,来回换脑子。 */
  for (let i = 0; i < 流行们.length; i++){
    const r = 流行们[i];
    const 时 = r.时 ? new Date(r.时).toLocaleTimeString(地区(), { hour12:false }) : '';
    /* 行头 ＝ 轨迹的轮头那一条。轨迹上挂的是「分叉/倒回」,这儿挂的是「去这条会话」。 */
    段.push('<div class="tj-turn" data-行="'+i+'" title="'+esc(译('跳到这条会话的对话页'))+'">'
      + esc(谁(r))+' · '+esc(译('轮{n}', { n: r.轮 }))
      + (时 ? '<span class="when">'+esc(时)+'</span>' : '')+'</div>'
      + r.进.map(进条).join('') + r.出.map(出块).join(''));
  }
  host.innerHTML = 段.join('');

  host.onclick = async ev => {
    const b = ev.target.closest('[data-块]');
    if (b){
      const k = 流位块[+b.dataset.块]; if(!k) return;
      await 开块(k.位, 全名(k.种类,k.名称)+' v'+k.版本);
      return;
    }
    const h = ev.target.closest('[data-行]');
    if (h){
      const r = 流行们[+h.dataset.行];
      if (r && r.会话){ S.at.看 = String(r.会话); showTab('chat'); 取数据(); }
    }
  };
}

/* 身份那一页。**这个节点出生那一刻拿到了什么。**（2026-09-24 换成同构节点的说法，排版没动）

   三节,排法就是**到达顺序**(它的经历),不是重要性:
     ① 公共前缀        system prompt,所有节点逐字相同（系统提示词 →《能力》→ 总目标）
     ② 名册里它那一行   派出者写的（身份短名、任务、交给谁、什么格式），它接手后自己改任务细则
     ③ 节点前缀        出生时机器摆在最前面的那一条：它那一行、名册、连着的手册（读的是哪一版）

   第 ③ 节是**它账里那条话原样上屏**,不是这儿现算的 —— 现算出来的是「现在会给什么」,
   不是「它当初拿到了什么」。

   **一个字都不新造**:每一格的出处在服务端 `身份Of()` 里,这儿只负责摆。
   算不出来的格子如实说 ——「没有」和「读不出」必须分得开。 */
function 画身份(){
  const host = document.getElementById('pane-id');
  if(!host) return;
  if(!数据在手()){ host.innerHTML = '<div class="id-void">' + 说不清() + '</div>'; return; }
  const 身 = D.载.身份;
  /* 没带 ＝ 这一趟没要（身份页刚切进来，`醒` 正在取），不是「读不出」 */
  if(身 === undefined){ host.innerHTML = '<div class="id-void">' + esc(译('读取中…')) + '</div>'; return; }
  if(!身){
    host.innerHTML = '<div class="id-void">' + esc(译('这条会话读不出身份。\n\n它要么刚开出来还没落盘,要么不在任何项目里。')) + '</div>';
    return;
  }

  /* 一格:左边键、右边值。值空着就说「没写」,不留白 —— 留白跟"这一格不存在"长得一样。 */
  const 格 = (k, v, 空话, mono) => '<div class="id-f"><span class="k">' + esc(k) + '</span>'
    + '<span class="v' + (mono ? ' mono' : '') + (v ? '' : ' none') + '">'
    + esc(v || 空话 || 译('（没写）')) + '</span></div>';
  /* 一段可展开的全文。**折叠可以有,暗层不能有** —— 摘要旁边永远有一条通向原文的路。 */
  const 全文 = (标, t) => !t ? '' : '<details class="id-more"><summary>' + esc(标)
    + esc(译('（{n} 字）', { n: t.length })) + '</summary><pre>' + esc(t) + '</pre></details>';
  const 节 = (标, 副, 身子) => '<section class="id-sec"><h4>' + esc(标)
    + (副 ? '<span class="why">' + esc(副) + '</span>' : '') + '</h4>' + 身子 + '</section>';

  const 头 = '<div class="id-head">'
    + '<div class="n">' + (身.号 != null ? '<span class="no">' + esc(身.号) + '</span>' : '')
    + esc(身.名字 || 译('（名册上没有它）')) + '</div>'
    + '<div class="m">'
    + (身.模型 ? esc(译('模型')) + ' <b>' + esc(身.模型) + '</b><br>' : '')
    + (身.上级
        ? esc(译('派出者')) + ' <b>' + esc(身.上级.号) + ' ' + esc(身.上级.名字) + '</b>'
        : esc(译('派出者')) + ' <b>?</b>')
    + (身.册坏 ? '<br>⚠️ ' + esc(译('名册读不出来：{error}', { error: 身.册坏 })) : '')
    + (!身.在名册上 && !身.册坏 ? '<br>⚠️ ' + esc(译('名册上没有这个会话 —— 它不是 Blueprint 的节点，下面两格是空的')) : '')
    + '</div></div>';

  /* ① 公共前缀。全文不在这儿摆第二份 —— 它在对话最上面 SYS 那一块，一份一行、点开读全文。 */
  const 一 = 节(译('① 公共前缀'), 译('system prompt,所有节点逐字相同'),
    格(译('是什么'), 译('系统提示词 →《能力》→ 总目标。它不区分谁是谁 —— 节点之间只有任务不同，没有种类之分'))
    + 格(译('在哪看'), 译('对话最上面 SYS 那一块：一份一行，点开读全文')));

  /* ② 名册里它那一行 —— 派出者写的，它接手后自己改任务细则（`row`）。 */
  const 二 = 节(译('② 名册里它那一行'), 译('派出者写的,它接手后自己改任务细则'),
    格(译('任务'), 身.理解) + 格(译('交出去'), 身.验收标准, '', true)
    + (身.分工手册 ? '<div class="id-path">' + esc(译('名册')) + ' ' + esc(身.分工手册) + '</div>' : ''));

  /* ③ 节点前缀。**这是它账里那条话的原文**,不是这儿拼的。 */
  const 包 = 身.出生包;
  const 三 = 节(译('③ 节点前缀'), 译('出生时机器摆在最前面的那一条：它那一行、名册、连着的手册'),
    !包
      ? '<div class="id-f"><span class="k">' + esc(译('节点前缀')) + '</span><span class="v none">'
        + esc(译('账里还没有这一条 —— 它刚开出来，还没跑第一步。')) + '</span></div>'
      : 格(译('收到'), 译('{n} 字', { n: 包.字数 }), '', true) + 全文(译('读节点前缀全文'), 包.全文));

  host.innerHTML = 头 + 一 + 二 + 三;
}

/* **流没变就不重建**（2026-09-15 用户报：跑久了切节点慢、吃内存）。
   树是全项目的，任何一格动一下都会重取一次历史 —— 原来每取一次就把这一格的整条对话
   擦掉重画（几百步、上兆的字），二十格同时在跑时一秒要重画好几遍。
   两种情况不用重建：
   · 同一格、账本条数没变 —— 别的格子动了，这一格一个字都没多；
   · 同一格、正在跑 —— 活流一帧一帧往上长着，重建只是把同样的东西再画一遍。
     等它这一轮收工（busy 翻成 false，签就变了）再重建一次，对一次账（验收 4）。 */
let 上回画的流 = '', 上回流的会话 = null;

/* **对话太长，先只画后面那一截**（2026-09-15 用户报：跑久了切节点慢、吃内存）。
   一格跑了几百步，整条画出来是几千个块 —— 切过去的那一下大半时间花在这儿，
   而你切过去多半只看最近在干什么。
   · 按**整轮**切，不从一轮中间切开：一轮里的调用和结果要配得上对；
   · 最后那一轮再长也整轮画 —— 宁可慢，不画半轮；
   · 折起来的那一截**必须看得见**（图景：折叠可以有，暗层不能有）——
     流顶一行说清折了几轮几条，点一下整条画出来。点过的那一格这一页开着期间一直画全。 */
const 流先画几条 = 200;
const 画全了的 = new Set();
function 切一截(entries){
  if(画全了的.has(D.会话) || entries.length <= 流先画几条) return { 画: entries, 折: 0 };
  for(let i = entries.length - 流先画几条 - 1; i >= 0; i--){
    if(entries[i].type !== 'blueprint.turn_tail') continue;
    const 前 = entries.slice(0, i + 1);
    return { 画: entries.slice(i + 1), 折: i + 1,
             轮: 前.filter(e => e.type === 'blueprint.turn_tail').length,
             /* 被折掉的最后一道轮尾 —— 露出来的头一句「撤回」要锚在它上面 */
             种: entries[i] };
  }
  return { 画: entries, 折: 0 };   /* 整条就一轮，没处下刀 */
}
function 画折痕(截){
  const b = document.createElement('button');
  b.className = 'fold-note';
  b.textContent = `更早的 ${截.轮} 轮（${截.折} 条）先没画 —— 点这里整条画出来`;
  b.title = '对话太长，先只画最近这一截，切节点才快。没画的都还在，点一下整条画出来';
  b.onclick = () => {
    画全了的.add(D.会话);
    const 离底 = $log.scrollHeight - $log.scrollTop;   /* 上面长出一截，眼前这一行别跳走 */
    画流();
    $log.scrollTop = $log.scrollHeight - 离底;
  };
  $stream.prepend(b);
}

/* 流最底下那根活条的开关 —— **只有这一处**。
   它认的是 `S.busy`（服务端 `turn/start` 就发了的那件事），
   不认"有没有字流过来"：从开跑到模型吐出第一个字是几十秒到几分钟，
   照后者画，那几分钟这条流上什么都没有（2026-09-16 用户报）。
   没拿到开跑时刻就从这一刻掐表 —— 秒表可能少算，但条一定在。 */
function 在跑同步(){
  if(!R) return;
  connect();
  R['在跑'](S.busy ? (S['busy自'] || Date.now()) : 0, navOpenTurns.get(D.会话));
}

function 更新轮导航(entries, replace=false){
  if(!turnNav) return;
  if(!数据在手()){navEntries=[];navSession=null;turnNav.reset();return;}
  if(replace || navSession!==D.会话){navSession=D.会话;navEntries=(entries||[]).slice();}
  else for(const entry of entries||[]){if(!navEntries.some(e=>e.seq===entry.seq))navEntries.push(entry);}
  const items=new Map();
  let fallback=null;
  const nextTurns=new Array(navEntries.length);
  for(let i=navEntries.length-1;i>=0;i--){const e=navEntries[i];if(e.type==='blueprint.turn_tail' && Number.isSafeInteger(e.turn))fallback=e.turn;nextTurns[i]=fallback;}
  for(let i=0;i<navEntries.length;i++){
    const e=navEntries[i],turn=Number.isSafeInteger(e.turn)?e.turn:nextTurns[i];
    if(!Number.isSafeInteger(turn) || !Number.isSafeInteger(e.seq))continue;
    let item=items.get(turn);
    if(!item){item={turn,anchorSeq:e.seq,prompt:'',response:''};items.set(turn,item);}
    if(e.type==='message' && e.message?.role==='assistant' && !item.prompt && !item.response)item.anchorSeq=e.seq;
    const m=e.message, text=Array.isArray(m?.content)?m.content.filter(b=>b.type==='text').map(b=>b.text||'').join('\n'):typeof m?.content==='string'?m.content:'';
    if(e.type==='message' && m?.role==='user'){
      if(!item.prompt){item.anchorSeq=e.seq;item.prompt=text.slice(0,600) || (m.content?.some(b=>b.type==='image')?'图片附件':'文件附件');}
    }else if(e.type==='message' && m?.role==='assistant' && text.trim())item.response=text.slice(0,1000);
  }
  const openTurn=navOpenTurns.get(D.会话);
  if(Number.isSafeInteger(openTurn) && !items.has(openTurn))items.set(openTurn,{turn:openTurn,anchorSeq:null,prompt:'第 '+openTurn+' 轮，正在进行',response:''});
  turnNav.update([...items.values()]);
}

function 画流(){
  if(!R) return;
  if(!数据在手()){ R.reset(); 更新轮导航([]); 上回画的流 = ''; 上回流的会话 = null; return; }   /* 别人的流一个字都不许留在这儿 */
  const 签 = D.会话 + '|' + (S.busy ? '跑着' : (D.载.total || 0)) + (画全了的.has(D.会话) ? '|全' : '');
  if(签 === 上回画的流){ 更新轮导航(D.载.entries); drawAsks(); 在跑同步(); return; }
  /* 重建会把你滚到的位置甩掉。贴着底就跟到底,在中间读旧的就留在原地。 */
  const 换了节点 = 上回流的会话 !== D.会话;
  const keep = $log.scrollTop;
  const near = $log.scrollTop + $log.clientHeight >= $log.scrollHeight - 160;
  const 截 = 切一截(D.载.entries || []);
  const liveState=!换了节点 && S.busy ? R.captureLive?.() : null;
  R.reset();
  if(截.种) R.接着轮尾(截.种);
  R.history(截.画);
  刷新外部协助();
  if(liveState)R.restoreLive?.(liveState);
  更新轮导航(D.载.entries,true);
  if(截.折) 画折痕(截);
  上回画的流 = 签;
  上回流的会话 = D.会话;
  drawAsks();          /* 流被重建了 —— 还等着你点头的那几件补回流尾 */
  在跑同步();           /* reset 把活条一并撤了,跑着的话重新挂回流尾 */
  产物画廊?.sync();
  if(换了节点) R.toBottom();
  else if(!near) $log.scrollTop = keep;
}

/* 输入条与那块砖是一对:草稿态砖在、输入条让位;别的时候反过来。
   **让位是 hidden,不是销毁** —— 里面打了一半的字要留着。 */
function 画输入条与砖(){
  const 建中 = S.at.在 === 'draft';
  if($np) $np.hidden = !建中;
  if($stream) $stream.hidden = 建中;
  const c = document.getElementById('composer');
  if(c) c.hidden = 建中;
  if(建中 && typeof showTab === 'function') showTab('chat');
  if(window.paintComposer) window.paintComposer();
}

/* ================= 左上:节点树 =================
   **这一页不画树。** 显示逻辑全在 `mirror-render.js`：
   布局(tidy:叶子定行、父居子中)、卡片解剖、生死轴的虚实、连线、目标卡、会师，全在它手里。
   这里只做三件事:**把服务端折好的数据交给它 · 告诉它选中了谁 · 开屏把 Blueprint 对准**。

   数据形状不是我们定的，是它认的那个:{project, event_count, roots, nodes, edges}。
   服务端 `seatTree()` 负责折成这个形状，缺的那几样(判定/任务书/goal_set)给空 ——
   **缺了怎么显示是渲染器的事**(它的规矩:占位说明，不猜不造)。 */
let mirror = null, treeFirst = true;
/* 上一次画出的树显示数据。切节点只改变选中态；计数与原始边表不参与绘图，
   它们变化时保留砖与连线。节点、状态、目标、布局和控件变化仍交给渲染器。
   点一张卡走的是 `切到()`：它先画一次脸（数据还是上一份），再 await 取数据、再画一次 ——
   于是同一棵树被拆了重建两遍。而**选中根本不改树**：它只是给两个元素加减 class
   （`mirror.select()`，照旧每次都走）。所以树只在**数据真变了**的时候重画。
   ⚠️ 舞台被清空的每一条路上都要把它清掉（见下面那两个提前 return），
   否则「清空 → 同一份数据回来 → 签名一样 → 不重画」会留下一张空舞台。 */
let 上回画的树 = '';
function 树显示签(T){
  const { event_count, edges, ...显示 } = T;
  return JSON.stringify(显示);
}

/* **按那块 PULSE 词块。**（`DESIGN_GUIDE.md` 3.8；机制在 `studio` 的「PULSE」那一节。）

   开关是**服务端进程里的一张表**，不是这一页的状态 —— 所以刷新这一页碰不到它，
   而按下去之后**只能重取一次来知道结果**，不在前端猜着先翻面（猜错就是撒谎：
   词块写着 ON 而后端根本没开）。 */
async function 按脉搏(要开, 柜){
  if(!柜){ S.note = '这棵树还没算出 Blueprint 在哪 —— PULSE 不知道该开哪个项目'; 画脸(); return; }
  try{
    const r = await fetch('api/pulse', {method:'POST', headers:{'Content-Type':'application/json'},
                                        body: JSON.stringify({柜, on: !!要开})});
    const d = await r.json();
    if(!d.ok) S.note = d.message || 'PULSE 没按动';
  }catch(e){ S.note = 'PULSE 没按动 —— ' + (e && e.message || e); }
  await 取数据();
}

/* ══════════════════════════════════════════════════════════════════════════
   全启 —— **这个项目：给停着、还没交付的节点各发一句「继续」**（节点图上 Stop 正下方那条 Start 带）

   ── 用户原话 ──────────────────────────────────────────────────────────
   2026-09-16：「把 sys 打开之后，还在停止状态的所有节点发一个继续」
   2026-09-24：PULSE 没了（新系统没有定时器，叫醒只看名册的变化），用户：「加回来」——
   只剩后半句：被你停下的、被重启切断的、出事故断掉的、没东西可等卡住的，名册再怎么变也不会有人叫它们。

   ── 叫谁 ──────────────────────────────────────────────────────────────
   **服务端算好的那张单**（`T.全启.要叫`，判据在 `studio` 的 `seatTree()` 末尾），前端一个字不判断。
   发之前再取一次树和会话表，**已经在跑的不发** —— 往一轮正开着的对话里插一句「继续」是打岔。
   发的是**你说的话**（跟你在输入框里打「继续」同一条路），不是机器的叫醒 —— 这一下是你按的。
   与 Stop All 一样，只管点击时的这个项目。
   ══════════════════════════════════════════════════════════════════════════ */
let 全启字 = null;
const 写启字 = t => { 全启字 = t; document.querySelectorAll('.nstart .st').forEach(el => el.textContent = t || 'GO');
  document.querySelectorAll('.nstart').forEach(el => el.classList.toggle('busy', !!t)); };

/** 给一个节点说一句话。路跟输入框的 `submit()` 同一个分法；成没成返回 r。 */
async function 续一个(id, v, 话, 项目 = null){
  const 区 = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const content = [{type:'text', text: 话}];
  const 范围 = 项目 ? {projectSessionId: 项目} : {};
  return (v && v.老 && v.父)
    ? await rpc('subagent.prompt', {parentSessionId: v.父, childSessionId: id,
        resumeOnly: true, mode: 'continuable', content, clientTimeZone: 区, ...范围}, null, true)
    : await rpc('session.prompt', {sessionId: id, resumeOnly: true, mode: submitMode(), content, clientTimeZone: 区, ...范围}, null, true);
}

async function 全启(){
  if(全启字) return;   /* 正在启：再按一下不另起一遍 */
  const 项目 = S.at.在 === 'project' && S.at.项目;
  if(!项目){ toast(译('当前项目还没就绪')); return; }
  写启字('…');
  const 话 = [];
  try{
    /* 先取一份新鲜的树：按下去之前刚好有节点自己动了，单子就不一样 */
    const d = await 取数据('树', 项目);
    if(!d?.ok || d.lineage?.root !== 项目){ 话.push(译('读不出当前项目，未启动节点')); return; }
    const T = d.lineage.tree;
    const 单 = new Set(((T && T.全启 && T.全启.要叫) || []).map(String));
    if(!单.size){ 话.push(译('没有停着、还没交付的节点')); return; }
    const 表 = await 会话表(项目);
    if(!表){ 话.push(译('读不出当前项目的会话表，未启动节点')); return; }
    const 跑着 = [...单].filter(id => (表.get(id) || {}).在跑);
    const 要叫 = [...单].filter(id => 表.has(id) && !表.get(id).在跑);
    let 成 = 0, 败 = 0, 等 = 0;
    await Promise.all(要叫.map(async id => {
      const r = await 续一个(id, 表.get(id), 译('继续'), 项目);
      if(r.ok && (r.value?.waitingForChildren?.length || r.value?.completed)) 等++;
      else if(r.ok) 成++; else 败++;
    }));
    话.push(译('给 {n} 个停着的节点发了「继续」', {n: 成}));
    if(等) 话.push(译('{n} 个节点继续等待子节点交齐或已有交回', {n: 等}));
    if(跑着.length) 话.push(译('{n} 个其实已经在跑了，没打扰', {n: 跑着.length}));
    if(败) 话.push(译('{n} 个没递进去 —— 点进去看看', {n: 败}));
  } finally {
    写启字(null);
    if(话.length) toast('Start All' + 译('：') + 话.join(译('。')));
    refresh();
  }
}

/* **改树上「全局」那一行。**（2026-09-15 用户定）写模型表的全局、清空单独 —— 这一刻整个项目（含智囊）都换成它；
   之后单改某个节点它不管，这一行也不跟着变。跟 PULSE 同一个规矩：不在前端先翻面，写完重取一次，按后台画。 */
async function 设全局(选, 会话){
  const r = await rpc('模型.改', {sessionId:会话, 全局:true, ...选});
  if(!r.ok) toast(译('全局没换成：{error}', {error: r.message || 译('后台拒了')}));

}

/* **新项目那张表开着时左边那一格。** 只有第一个节点（Blueprint）和它的镜像，没有子节点。
   带的顺序、Plan/Helm/Dock 三条跟真项目刚建好时一样；正文是「还没建」的实话，不是假进度。
   Model 那一行只摆默认文字、点不动（2026-09-17 用户：避免误导）—— 模型和档位在右边那张表上选。 */
function 草稿树(){
  const 表 = window.npPreview ? window.npPreview() : {};
  /* 2026-09-24 同构节点：只有 N1 一条带；第二格（走到哪一步）还没有，印「—」；第一行是你正在写的描述 */
  const 带 = (part, 一行) => ({part, 座位:part, 会话:'', 主会话:'', 状态:'idle', 一行, 二行:'等你建项目'});

}

const 节点重启中 = new Set();
const 节点重启请求 = new Map();
/* 重启先问两句（2026-10-21 用户）：确定吗，无法撤销；再问它做出的改动清不清除。哪句取消都不重启。 */
async function 确认节点重启(号){
  if(await 重启问一句(译('确定重置节点 {n}？', {n: 号}), 译('清空本节点的对话与工作状态，用最初的任务重新开始，上次派出的分支会收回。无法撤销。'),
    ['cancel', 译('取消')], ['reset', 译('重置')]) !== 'reset') return null;
  const 答 = await 重启问一句(译('清除节点 {n} 做出的改动吗？', {n: 号}),
    译('做出来的东西不对，选清除：它的文件回到开工那一刻，它派出的节点的文件一起删掉，已经交给上层的不动。只是对话出了问题，选保留：文件原样留着，重新开始后接着用。'),
    ['keep', 译('保留')], ['clear', 译('清除')]);
  return 答 === 'keep' || 答 === 'clear' ? {清除: 答 === 'clear'} : null;
}
function 重启问一句(标题, 说明, [否, 否字], [是, 是字]){
  return new Promise(resolve => {
    const dialog = document.createElement('dialog');
    dialog.className = 'node-restart-dialog';
    dialog.setAttribute('aria-labelledby', 'node-restart-title');
    dialog.innerHTML = '<form method="dialog"><h2 id="node-restart-title"></h2><p></p><footer><button autofocus></button><button></button></footer></form>';
    dialog.querySelector('h2').textContent = 标题;
    dialog.querySelector('p').textContent = 说明;
    const [否钮, 是钮] = dialog.querySelectorAll('button');
    Object.assign(否钮, {value: 否, textContent: 否字}); Object.assign(是钮, {value: 是, textContent: 是字});
    dialog.addEventListener('close', () => { dialog.remove(); resolve(dialog.returnValue); }, {once:true});
    document.body.appendChild(dialog);
    dialog.showModal();
  });
}
async function 重启树节点(sessionId, nodeId, button){
  const projectSessionId = S.at.在 === 'project' && S.at.项目;
  if(!projectSessionId || 节点重启中.has(sessionId)) return;
  节点重启中.add(sessionId);
  try {
    const 答 = await 确认节点重启(nodeId);
    if(!答) return;
    button.disabled = true;
    if(!节点重启请求.has(sessionId)) 节点重启请求.set(sessionId, crypto.randomUUID());
    const result = await rpc('node.restart', {sessionId, nodeId, projectSessionId, requestId:节点重启请求.get(sessionId), 清除:答.清除});
    if(!result.ok) return;
    节点重启请求.delete(sessionId);
    const value = result.value;
    toast(`节点 ${nodeId} 已从头开始`);
    if(S.at.在 === 'project' && S.at.项目 === projectSessionId){
      await 切到({在:'project', 项目:value.projectSessionId || projectSessionId, 看:value.targetSessionId});
      await 取数据('全');
    }
  } finally { 节点重启中.delete(sessionId); button.disabled = false; }
}

function drawTree(草稿){
  const stage = document.getElementById('tree-stage');
  if(!stage) return;
  /* 渲染器没加载 —— **必须喊出来，不许静默 return**。
     2026-08-19 栽过一次:`/studio/mirror-render.js` 因为服务端白名单是旧的而 404,
     这里静默返回,界面表现为「左上空着」——看起来跟「还没有节点」一模一样。
     **「读不出」和「没有」必须分得开**(图景:折叠可以有,暗层不能有)。 */
  if(typeof MirrorRender !== 'function'){
    stage.querySelectorAll('.card,.goal,.stage-empty').forEach(el => el.remove());
    const d = document.createElement('div');
    d.className = 'stage-empty';
    d.innerHTML = '树渲染器没加载 —— <code>/studio/mirror-render.js</code> 取不到。<br>'
      + '多半是 dsh 没重启(白名单在后端,后端在内存里)。';
    stage.appendChild(d);
    return;
  }
  if(!mirror){
    mirror = MirrorRender({
      stage,
      wires: document.getElementById('tree-wires'),
      /* 点一张卡 = 把视线切到那个座位。未出生那张不是会话，点不动。 */
      onSelect: (id) => 切到({在:'project', 看:id}),
      onRestart: 重启树节点,
      /* 按 PULSE ＝ 这个项目此刻许不许自动动人（服务端 `POST /api/pulse`）。
         **柜子路径是树带下来的**，这儿不拼路径 —— 跟点块看正文那条一个规矩。 */
      onPulse: (要开, 柜) => S.at.在 === 'draft' ? toast('项目还没建 —— 建好那一刻 Sys Pulse 就开着') : 按脉搏(要开, 柜),
      /* Stop 带 ＝ 停当前项目，带上那格字归这边 */
      onKill: () => S.at.在 === 'draft' ? toast('项目还没建 —— 按右边的 Create') : 全停(),
      killLabel: () => 全停字,
      /* Start 带 ＝ 继续当前项目里停着的节点 */
      onStart: () => S.at.在 === 'draft' ? toast('项目还没建 —— 按右边的 Create') : 全启(),
      startLabel: () => 全启字,
      /* 树上「全局」那一行：选项用主机级目录，改了写模型表的全局 */
      模型目录: () => 目录,
      onGlobalModel: (选, 会话) => 设全局(选, 会话),
      /* 点镜像 ＝ 开那一格的工作文档，跟信息流点块同一条路（`开块`） */
      onOpenDoc: (位, 标题) => 开块(位, 标题),
      /* 分叉结折起了哪几枝，记在这台电脑上（DESIGN_GUIDE 3.10） */
      记: mem,
      /* 点结之后母砖在屏幕上不许动：画布先跟着新树改尺寸，再按它挪了多少把视野挪回去 */
      onRefold: (前, 后) => 钉住视野(前, 后),
    });
  }
  const T = 草稿 || (S.lineage && S.lineage.tree) || null;
  const empt = stage.querySelector('.stage-empty'); if(empt) empt.remove();

  /* **「还没取到」和「一格都没有」必须分得开**（图景:折叠可以有,暗层不能有）。
     2026-08-31 之前这两种画的是同一句话「树从第一个节点出生那一刻长出来」——
     而那句话本身也是假的:**第一个节点在建项目那一刻就出生了**（Blueprint），
     所以"空树"从来都不是正常状态,它要么是还没取到,要么是真出了事。 */
  if(!T){
    { const st = document.getElementById('tree-stats'); if(st) st.hidden = true; }
    stage.querySelectorAll('.card,.goal').forEach(el => el.remove());
    document.getElementById('tree-wires').innerHTML = '';
    stage.style.width=''; stage.style.height='';
    const d = document.createElement('div');
    d.className = 'stage-empty';
    d.innerHTML = '树还没取到 —— 等这个会话那份血脉回来。';
    stage.appendChild(d);
    上回画的树 = '';   /* 舞台清空了，下一份数据必须重画 */
    return;
  }
  if(!T.nodes.length){
    stage.querySelectorAll('.card,.goal').forEach(el => el.remove());
    document.getElementById('tree-wires').innerHTML = '';
    stage.style.width=''; stage.style.height='';
    const d = document.createElement('div');
    d.className = 'stage-empty';
    d.innerHTML = '⚠️ 血脉回来了，但一格都没有 —— <b>这不该发生</b>。<br>'
      + '建项目那一刻 Blueprint 就在树上了，空树意味着服务端那棵树算坏了。';
    stage.appendChild(d);
    上回画的树 = '';   /* 同上 */
    return;
  }

  mirror.setData(T);
  /* **树没变就不重画** —— 见上面 `上回画的树` 那一段。 */
  const 这棵 = 树显示签(T);
  if(这棵 !== 上回画的树){ mirror.render(); 上回画的树 = 这棵; }
  /* 选中认**会话**（砖上每条带都带自己的 `data-node`），不是只认砖的 id ——
     点 helm 那一带要能亮它自己那一条。 */
  mirror.select(T.nodes.some(n => n.node_id === S.sess
    || (n.带们 || []).some(b => b.会话 === S.sess)
    || (n.Sub们 || []).some(s => s.会话 === S.sess)) ? S.sess : null);
  layoutCanvas();

  if(草稿){
    /* 计数牌清零，不藏：藏起来的话，旧那张一旦没被擦掉就会冒充这个项目（2026-09-17 用户报） */
    画计数牌({总:0, done:0, run:0, wait:0, ask:0, stop:0});
  }else{
    画计数牌();
  }

  /* 开屏把 Blueprint 对准,**一辈子只做一次**(之后你拖过缩过的位置不许被冲掉)。
     两个条件缺一不可:
       ① **藏着的时候不算**:那时这块地宽高是 0,对准算出来是废数。
       ② **等下一帧**:对准要读 clientWidth/clientHeight,而这一刻布局还没落定
          (左列宽度来自 localStorage 里那个百分比,首帧读到的是中间态)——
          2026-08-20 实测差了 328px,树开屏挂在左上角。 */
  if(treeFirst && !document.getElementById('tree-pane').hidden){
    treeFirst = false;
    requestAnimationFrame(() => requestAnimationFrame(treeHome));
  }
}

/* ================= 无限画布:平移 · 缩放 · 回中 =================
   三条约束,都是从图纸来的,不是我挑的:
   ① 直角禁令 —— 工具条不许有圆角
   ② 家具无色 —— 缩放条是家具,静息态只有灰,悬停才加深
   ③ 动效预算 —— 平移缩放不加过渡动画;界面上唯一允许持续运动的是 HOLD 呼吸环
   "无限"的实现是画布层四周留一大片空白(SLACK),不是真的无穷大 ——
   真无穷大要接管滚动条,那是把浏览器已经做好的事重做一遍。 */
const TREE_SLACK = 600;          /* 树四周的空地,单位 px(未缩放) */
let treeZoom = 1;
const ZMIN = 0.25, ZMAX = 2;
/* 画布的下限（px，已缩放）。点完分叉结，树可能一下矮了一截，画布跟着缩就会把视野夹走 ——
   那一刻把下限顶到「母砖还在原位」需要的大小。你往回滚，它跟着退（见 `tree-scroll` 的 scroll），
   所以多出来的只是视野外的空地，之后任何一次重画都不会再把视野夹走。回中时清零。 */
const 画布下限 = {w:0, h:0};

/** 画布层撑多大 = 树的尺寸×缩放 + 四周空地。**能滚多远由它决定**,不由舞台。 */
function layoutCanvas(){
  const stage = document.getElementById('tree-stage');
  const canvas = document.getElementById('tree-canvas');
  const scroll = document.getElementById('tree-scroll');
  if(!stage || !canvas) return;
  const w = parseFloat(stage.style.width) || 0, h = parseFloat(stage.style.height) || 0;
  const 排版倍率 = Math.max(1, treeZoom);
  stage.style.zoom = 排版倍率;
  stage.style.transform = treeZoom < 1 ? `scale(${treeZoom})` : 'none';
  /* zoom 连定位距离也缩放；反算留白，保证树原点和指针缩放锚点不漂移。 */
  stage.style.left = (TREE_SLACK / 排版倍率) + 'px';
  stage.style.top  = (TREE_SLACK / 排版倍率) + 'px';
  canvas.style.width  = Math.max(scroll.clientWidth,  w*treeZoom + TREE_SLACK*2, 画布下限.w) + 'px';
  canvas.style.height = Math.max(scroll.clientHeight, h*treeZoom + TREE_SLACK*2, 画布下限.h) + 'px';
  /* 网格跟着缩放走 —— 不然放大之后格子还是老尺寸,读起来像换了分辨率 */
  const g = 100*treeZoom, m = 20*treeZoom;
  canvas.style.backgroundSize = `${g}px ${g}px,${g}px ${g}px,${m}px ${m}px,${m}px ${m}px`;
  const pct = document.getElementById('tz-pct');
  if(pct) pct.textContent = Math.round(treeZoom*100) + '%';
}

/** 缩放。锚点默认是视野中心 —— 你盯着的东西不许在缩放时跑掉。 */
function treeSetZoom(z, ax, ay){
  const scroll = document.getElementById('tree-scroll');
  const old = treeZoom;
  treeZoom = Math.min(ZMAX, Math.max(ZMIN, Math.round(z*100)/100));
  if(treeZoom === old) return;
  const cx = ax ?? scroll.clientWidth/2, cy = ay ?? scroll.clientHeight/2;
  /* 锚点在"树坐标"里的位置,缩放前后必须落在同一个屏幕点上 */
  const tx = (scroll.scrollLeft + cx - TREE_SLACK) / old;
  const ty = (scroll.scrollTop  + cy - TREE_SLACK) / old;
  layoutCanvas();
  scroll.scrollLeft = tx*treeZoom + TREE_SLACK - cx;
  scroll.scrollTop  = ty*treeZoom + TREE_SLACK - cy;
}

/** 折／展一枝之后，那块母砖钉在屏幕原位（2026-09-17 用户：「点击那个按钮，画面就以那个母节点为中心不变」）。
    布局是父居子中，折起展开会把母砖在树上挪走；这儿按它挪的量反向挪视野。
    **先算目标、再改画布尺寸、再滚** —— 先缩画布会把滚动位置夹掉一截。 */
function 钉住视野(前, 后){
  const scroll = document.getElementById('tree-scroll');
  if(!scroll){ layoutCanvas(); return; }
  const 左 = scroll.scrollLeft + (前 && 后 ? (后.x - 前.x)*treeZoom : 0);
  const 上 = scroll.scrollTop  + (前 && 后 ? (后.y - 前.y)*treeZoom : 0);
  画布下限.w = Math.max(0, 左 + scroll.clientWidth);
  画布下限.h = Math.max(0, 上 + scroll.clientHeight);
  layoutCanvas();
  scroll.scrollLeft = 左;
  scroll.scrollTop  = 上;
}

/** 回中:把 Blueprint 座位拉到视野中央。找不到 Blueprint 就退回画布中心,不许一声不吭什么都不做。 */
function treeHome(){
  const scroll = document.getElementById('tree-scroll');
  画布下限.w = 画布下限.h = 0;
  const T = S.at.在 === 'draft' ? {roots:['__draft__']} : ((S.lineage && S.lineage.tree) || null);
  const p = (mirror && T && T.roots && T.roots.length) ? mirror.nodePos(T.roots[0]) : null;
  layoutCanvas();
  if(p){
    scroll.scrollLeft = (p.x + 110)*treeZoom + TREE_SLACK - scroll.clientWidth/2;
    scroll.scrollTop  = (p.y + 30)*treeZoom + TREE_SLACK - scroll.clientHeight/2;
  }else{
    scroll.scrollLeft = (scroll.scrollWidth - scroll.clientWidth)/2;
    scroll.scrollTop  = (scroll.scrollHeight - scroll.clientHeight)/2;
  }
}

/* 拖着空白处平移。按在卡片上不算 —— 那是选中,两件事不许抢。 */
(function bindCanvas(){
  const scroll = document.getElementById('tree-scroll');
  if(!scroll) return;
  let on = false, sx = 0, sy = 0, l0 = 0, t0 = 0, moved = 0;
  scroll.addEventListener('mousedown', (e) => {
    if(e.button !== 0) return;
    if(e.target.closest('.card,.goal,#tree-tools')) return;
    on = true; moved = 0; sx = e.clientX; sy = e.clientY;
    l0 = scroll.scrollLeft; t0 = scroll.scrollTop;
    scroll.classList.add('panning'); e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if(!on) return;
    moved = Math.max(moved, Math.abs(e.clientX-sx) + Math.abs(e.clientY-sy));
    scroll.scrollLeft = l0 - (e.clientX - sx);
    scroll.scrollTop  = t0 - (e.clientY - sy);
  });
  window.addEventListener('mouseup', () => { on = false; scroll.classList.remove('panning'); });
  /* ⌘/Ctrl + 滚轮 = 以指针为锚点缩放(触控板双指捏合在浏览器里就是这个);
     光滚轮 = 平移,交给浏览器自己滚,我们不插手。 */
  /* 画布下限跟着视野往回退：下限只需要盖住你此刻看得见的最右／最下，多的收掉 */
  scroll.addEventListener('scroll', () => {
    if(!画布下限.w && !画布下限.h) return;
    const 右 = scroll.scrollLeft + scroll.clientWidth, 下 = scroll.scrollTop + scroll.clientHeight;
    if(右 < 画布下限.w || 下 < 画布下限.h){
      画布下限.w = Math.min(画布下限.w, 右); 画布下限.h = Math.min(画布下限.h, 下);
      layoutCanvas();
    }
  }, {passive:true});
  scroll.addEventListener('wheel', (e) => {
    if(!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const r = scroll.getBoundingClientRect();
    treeSetZoom(treeZoom * (e.deltaY < 0 ? 1.1 : 1/1.1), e.clientX - r.left, e.clientY - r.top);
  }, {passive:false});
  const on_ = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };
  on_('tz-in',  () => treeSetZoom(treeZoom + 0.1));
  on_('tz-out', () => treeSetZoom(treeZoom - 0.1));
  on_('tz-pct', () => treeSetZoom(1));
  on_('tz-home', treeHome);
  /* 栏宽或上下分栏改变时，保住原来视野中心的树坐标。 */
  let viewW = scroll.clientWidth, viewH = scroll.clientHeight;
  new ResizeObserver(() => {
    const w = scroll.clientWidth, h = scroll.clientHeight;
    if(!w || !h) return;
    const left = scroll.scrollLeft + (viewW - w) / 2;
    const top = scroll.scrollTop + (viewH - h) / 2;
    viewW = w; viewH = h;
    layoutCanvas(); scroll.scrollLeft = left; scroll.scrollTop = top;
  }).observe(scroll);
})();

/* 树栏右上角的计数牌。数数归渲染器（`mirror.tally()`，跟砖的外框同一份判据），这儿只摆字。 */
/** `定` ＝ 宿主直接给的数（新项目那一格给全零）；不给就问渲染器数。 */
function 画计数牌(定){
  const el = document.getElementById('tree-stats');
  if(!el) return;
  const c = 定 || (mirror && mirror.tally ? mirror.tally() : null);
  if(!c || (!定 && !c.总)){ el.hidden = true; return; }
  const 项 = [['done','已完成'], ['run','正在运行'], ['wait','等待中'], ['ask','待回答'], ['stop','停止']];
  el.innerHTML = `<span class="${c.总 ? '' : 'zero'}">总节点<b>${c.总}</b></span>`
    + 项.map(([k, 名]) => `<span class="${c[k] ? '' : 'zero'}"><i style="background:var(--st-${k}-rail)"></i>${名}<b>${c[k]}</b></span>`).join('');
  el.hidden = false;
}

function paintTop(msg){
  /* 输入条读当前节点；顶部计时和工作中状态读整个项目。 */
  if(window.paintComposer) window.paintComposer();
  const t = document.getElementById('top-meta');
  const msg2 = msg || S.note;
  if(msg2){ t.textContent = msg2; t.classList.remove('hot'); return; }
  if(S.at.在 === 'draft'){ t.textContent = '新项目 —— 还没建。填完右边那张表,它才存在'; t.classList.remove('hot'); return; }
  if(S.at.在 === 'empty'){ t.textContent = '还没有项目 —— 按左上角「新项目」开一个'; t.classList.remove('hot'); return; }
  /* 这一格回答的是**「这个项目到现在花了多少」** —— 一个数、一笔钱，别的都不在这儿。
     2026-09-07 之前它印的是会话 id ＋ 事件条数（画/结构/未画）。那三个数是**渲染器
     自查用的**：它们讲的是「这一版的画法漏没漏东西」，是写这套界面的人的事，
     不是用这套界面的人的事。用户原话：「把现在红色位置的这些我看不懂的东西去掉」。
     渲染诊断计数保留在历史 API 中，不占用对话区。

     **数的是整棵树，不是你正看着的这一格**（服务端 `全项目用量()`）：
     树上每个座位 ＋ 不在树上的设备（智囊）。钱是按整棵树出的，所以这儿也按整棵树报。
     节点统计浮层里的「累计」只计眼前这个节点，和全项目统计分开展示。 */
  const 用 = 数据在手() ? ((D.载.lineage || {})['用量'] || null) : null;
  const parts = [];
  /* 血脉截断了（一次最多读 20 个会话）＝ 这个数是**下限**，写「≥」并且虚线标出来。
     少算一截还报个总数，那个总数会被当成全部 —— 跟缺价那一格同一条纪律。 */
  const 截 = !!用 && ((用['截了'] > 0) || (用['读不出'] > 0));
  if(用 && 用['合计']) parts.push(`全项目 ${截 ? '<b class="void">≥' : ''}${tk(用['合计'])}${截 ? '</b>' : ''} token · ${画钱(用['钱'])}`);
  else parts.push('全项目 <b class="void">还没烧过 token</b>');
  const 工作 = 数据在手() ? D.载.工作时间 : null;
  parts.push(`<span id="project-work-time" title="本项目至少一个节点运行时累计；全部停止或中断时暂停，并发只计一份时间">已工作 ${工作?.known ? 工作时长(工作毫秒(工作)) : '—'}</span>`);
  parts.push(esc((工作 ? 工作.running : S.busy) ? '工作中' : (live ? '待命' : '离线')));
  const other = otherAsks();
  if(other) parts.push(esc(other));
  t.innerHTML = parts.join(' · ');
  t.title = 用 ? 全项目话(用) : '';
  t.classList.toggle('hot', !!other);
}

/** 顶栏那一格的悬停解释。**把这个数是怎么凑出来的原样摊开** ——
    一个总数如果说不清它数了谁，用户只能选择信或不信，那就是一层暗。 */
function 全项目话(用){
  const 总 = (用['合计'] || 0).toLocaleString('en-US');
  const 设备 = Object.entries(用['按设备'] || {});
  return [
    `全项目 ${总} token —— 这棵树从建起来到现在一共烧掉的`
      + `（计费输入 ${((用.input||0)+(用.cacheRead||0)+(用.cacheWrite||0)).toLocaleString('en-US')}`
      + ` ＋ 输出 ${(用.output||0).toLocaleString('en-US')}）。`,
    ((用['截了'] > 0 || 用['读不出'] > 0)
      ? '⚠️ 这不是总数，是下限 —— '
        + [用['截了'] > 0 ? `还有 ${用['截了']} 条线没读（一次最多 20 条）` : '',
           用['读不出'] > 0 ? `有 ${用['读不出']} 条线读不出来` : ''].filter(Boolean).join('，')
        + '。它们烧的没算进去，所以前面写的是「≥」。\n'
      : '')
    + `数了 ${用['会话数'] || 0} 个节点的账本`
      + (设备.length
        ? `，外加不在树上的设备 ${用['设备笔数'] || 0} 次调用：\n  `
          + 设备.map(([k,v]) => `${k}  ${v.toLocaleString('en-US')}`).join('\n  ')
        : '，还没有不在树上的设备说过话。')
      + '\n支线继承过来的那几轮不重复计数。',
    钱话(用['钱'], '这个项目'),
  ].join('\n\n');
}

/* 顶栏那个下拉画的是**项目**,不是会话。
   项目 ＝ 没有父的那个会话(图景 9.1「项目 ＝ 血统树」;服务端把 parentSession 原样给过来,
   我们一个字都不猜)。一个项目里换座位是**点左边树上的卡**,不在这个下拉里 ——
   下拉里塞子会话,就等于把一棵树摊平成一串对话,那正是这一版要去掉的东西。 */
function paintPicker(){
  const btn = document.getElementById('proj-pick'), menu = document.getElementById('proj-menu');
  if(!btn || !menu) return;
  const roots = S.sessions.filter(s => !s.parentSession && (!s.projectRootSession || s.projectRootSession === s.id));
  /* 项目名 ＝ 文件夹名 ＝ cwd 的最后一段。**没有第二个出处** ——
     dsh 的会话头本来就记 cwd,所以项目名跟着账本走,我们不发 id 不建表
     (协议第二节:项目边界 ＝ 血统树)。**只有落在项目根底下的 cwd 才是一个项目** ——
     别的会话(dsh 自带那张脸开的、这一版之前留下的)工作目录是仓库本身,
     照它画名字会让一整列都叫「System 2」。如实说它没有文件夹。 */
  const nameOf = s => {
    const cwd = String(s.cwd || '');
    const isProj = S.projRoot && cwd.startsWith(S.projRoot + '/');
    return isProj ? (cwd.split('/').filter(Boolean).pop() || '') : ('无文件夹 ' + shortId(s.id));
  };
  /* **项目在跑 ＝ 这棵树上有一格在跑。** 每一格顺着 parentSession 爬到没有父的那一个，
     就是它的项目（服务端每行带 running，一个字都不猜）。 */
  const 父 = new Map(S.sessions.map(s => [s.id, s.parentSession]));
  const 项目根 = new Map(S.sessions.map(s => [s.id, s.projectRootSession]));
  const 项目of = id => { if(项目根.get(id)) return 项目根.get(id); const 走过 = new Set(); while(父.get(id) && !走过.has(id)){ 走过.add(id); id = 父.get(id); } return id; };
  const 在跑 = new Set(S.sessions.filter(s => s.running).map(s => 项目of(s.id)));
  const 点 = id => `<i class="pj-dot${在跑.has(id) ? ' run' : ''}"></i>`;
  /* 草稿态没有「当前项目」—— 按钮上写的是正在建的那一个。不清掉的话 S.lineage 还挂着上一个项目的 Blueprint。 */
  const cur = S.at.在 === 'draft' ? null : (S.at.项目 || (S.lineage && S.lineage.root) || S.sess);
  const 当前 = roots.find(s => s.id === cur);

  btn.innerHTML = S.at.在 === 'draft' ? '<i class="pj-dot"></i><span class="pj-n">新项目 · 还没建</span><span class="pj-caret">▾</span>'
    : 当前 ? `${点(当前.id)}<span class="pj-n">${esc(nameOf(当前))}</span><span class="pj-caret">▾</span>`
    : `<span class="pj-n">${roots.length ? '选一个项目' : '还没有项目'}</span><span class="pj-caret">▾</span>`;
  btn.title = 当前 ? `${nameOf(当前)}${在跑.has(当前.id) ? ' —— 在跑' : ' —— 停着'}。点开换项目；换座位点左边树上的卡` : '一个项目 ＝ 一棵树';

  menu.hidden = !S.项目单开;
  if(!S.项目单开) return;
  const cwd = String(当前?.cwd || '');
  const withinProject = !!S.projRoot && cwd.startsWith(S.projRoot + '/')
    && !!cwd.slice(S.projRoot.length + 1) && !cwd.slice(S.projRoot.length + 1).includes('/');
  const oldScope = menu.querySelector('.pj-scope');
  const scopeOpen = !!oldScope && oldScope.dataset.project === 当前?.id && oldScope.open;
  const scope = 当前 && S.at.在 === 'project' && S.at.项目 === 当前.id && withinProject
    ? `<details class="pj-scope" data-project="${esc(当前.id)}"${scopeOpen ? ' open' : ''}><summary>工作范围：当前项目</summary>`
      + `<div class="pj-path">${esc(cwd)}</div><p>节点共享这里的项目文件与成果；公共技能只读。</p></details>`
    : '';
  /* 老 preset（vision／standard）才标出来 —— 现在建的全是 blueprint，标了等于每行多一个没信息的词 */
  menu.innerHTML = scope + roots.map(s => {
    const when = s.createdAt ? new Date(s.createdAt).toLocaleString('zh-CN',
      {hour12:false, month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
    const 旧座 = s.agentPreset && s.agentPreset !== 'blueprint' ? s.agentPreset + ' · ' : '';
    return `<div class="pj-row${s.id === cur ? ' cur' : ''}" data-id="${esc(s.id)}"
      title="${esc(s.名册错误 ? '项目名册读取失败：' + s.名册错误 : (在跑.has(s.id) ? '在跑' : '停着'))}">${点(s.id)}<span class="pj-n">${esc(nameOf(s))}</span>
      <span class="pj-t">${esc(旧座 + when)}</span></div>`;
  }).join('') || '<div class="pj-empty">还没有项目 —— 按「新项目」开一个</div>';
}

/** 开／收项目列表。开着的状态放在 S 上 —— 列表每一帧都可能重画，重画不许把它收掉。 */
function 开项目单(开){
  S.项目单开 = 开 === undefined ? !S.项目单开 : !!开;
  paintPicker();
  摆项目单();
}

/** 把浮层摆到按钮底下。fixed 的东西不跟着家具走,所以每次开、每次改窗口都得量一次。 */
function 摆项目单(){
  const btn = document.getElementById('proj-pick'), menu = document.getElementById('proj-menu');
  if(!btn || !menu || menu.hidden) return;
  const r = btn.getBoundingClientRect();
  menu.style.left = Math.max(6, Math.min(r.left, window.innerWidth - menu.offsetWidth - 6)) + 'px';
  menu.style.top  = (r.bottom + 4) + 'px';
  menu.style.maxHeight = Math.max(120, window.innerHeight - r.bottom - 16) + 'px';
}

/* ================= 轨迹页:移植自 dsh 的 TrajectoryTable =================
   搬的是它的**结构**,不是它的 3074 行 React:
     一轮一节(粘头) → 分组(Message / Step N / Compaction seq,组头带墙钟跨度与工具直方图)
     → 一行一条记录:#序号 · 种类标签 · 内容 · [in/out/思] · 自身时长
   七种种类照它的原名:System / User / Context / Compacted / Message / Tool / Sub
   点一行 → 右侧读全文浮层,把这条记录身上所有字段摊开(dsh 的详情面板同款)。
   **没有左边那条时间线轴** —— 用户已明确要去掉。 */
/* 标签原名照抄 dsh 的 KIND_LABEL（TrajectoryTable.tsx:38）—— 一个字都不改。
   注意 message 这一格它叫 ASSISTANT，不叫 Message（Message 是**分组**的名字）。 */
const KIND_LABEL = { system:'SYSTEM', user:'USER', context:'CONTEXT',
                     compacted:'COMPACTED', message:'ASSISTANT', tool:'TOOL' };

/* CONTEXT 那一格拆成两半（2026-08-20 用户看不懂那行 CONTEXT，查出来的）。
   「往对话里推东西」的**不止我们一个**：dsh 自己也推（谁派出去的节点挂了、
   切线发生了、策略变了）。我们关不掉，也不该关 —— 那是系统在报自己的状况。

   两种推手在轨迹上必须分得开，不然一行 CONTEXT 既可能是图景，也可能是故障通知：
     · **CONTEXT** —— 我们垫的料，带信封。
     · **系统**   —— dsh 推的系统消息，没有信封，正文常是生英文。
   认的是 `messageSource.plugin`（服务端 toNodes 原样传下来的），不是猜正文。

   ── 设备各叫各的名（2026-08-26 用户裁定）──────────────────────────────
   原来几样推手都印 CONTEXT，理由是「同一族不该有两个名」。
   实测下来那条理由站不住：**它们同族，但你要认的恰恰是"这一条是谁垫的"** ——
   该不该细读、出问题该找谁，完全不同。所以：**谁垫的就印谁**。
   大小写随这张表的规矩：拉丁名一律全大写（SYSTEM／USER／TOOL／座位名都是）。
   ⚠️ 以后再多一种推手 ＝ 这个函数里多一行，别去改上面那张表。 */
function 标签(c){
  /* assistant 行带着座位就写座位名(BLUEPRINT/PLAN/RUN/DOCK,服务端认壳认出来的)——
     「谁在说话」比「它是台机器」有用(2026-08-24 用户要的)。认不出仍是 ASSISTANT。 */
  if(c.kind === 'message' && c.座位) return { 文:String(c.座位).toUpperCase(), 类:'k-message' };
  if(c.kind !== 'context') return { 文:KIND_LABEL[c.kind]||c.kind, 类:'k-'+c.kind };
  const src = c.messageSource || {};
  /* 2026-08-22 用户裁定:角色 prompt 与开场那条消息也归 context ——
     它们跟引用件是同一件事:**模型开口之前就已经躺在它 context 里的东西**。
     只改身份和抬头,模型看见的一个字没变(服务端 `角色抬头`/`开场抬头` 那一段)。 */
  if(src.plugin === 'blueprint-prompt') return { 文:'角色', 类:'k-system' };
  /* 智囊全文：braintrust 植进对话链的那条真消息（三席原话，不摘要）。 */
  if(src.plugin === 'blueprint-braintrust') return { 文:'BRAINTRUST', 类:'k-context' };
  return { 文:'系统', 类:'k-system' };
}

/* dsh: trajectoryPreviewText —— 取前 2048 字，压掉所有空白，截 512 字，截了就带省略号。
   **它是折叠，不是摘要**：逐字取，不改写。 */
const PREV_SRC = 2048, PREV_OUT = 512;
function preview(text){
  const source = String(text ?? '').slice(0, PREV_SRC);
  const compact = source.replace(/\s+/g, ' ').trim();
  const out = compact.slice(0, PREV_OUT).replace(/\s+$/, '');
  return (source.length < String(text ?? '').length || out.length < compact.length) ? out+'…' : out;
}
/* dsh: isToolCallOnly / recordDisplayText / recordResultText / toolCallTextParts */
const isToolCallOnly = c => c.kind==='message' && !c.outputDetail && !c.thinkingDetail
                            && c.text === 'Tool call only';
function displayTextOf(c){
  if(isToolCallOnly(c)) return '';
  if(c.previewMarkdown !== undefined){
    const p = preview(c.previewMarkdown);
    if(c.text === '') return p;
    return p === '' ? c.text : c.text + ' · ' + p;
  }
  if(c.text !== '') return c.text;
  const md = (c.kind==='user'||c.kind==='context') ? c.inputDetail
           : c.kind==='message' ? (c.outputDetail ?? c.thinkingDetail) : undefined;
  return md === undefined ? '' : preview(md);
}
function listTextOf(c){
  if(isToolCallOnly(c)) return '(tool call only)';
  const t = displayTextOf(c);
  if(c.kind!=='tool') return t;
  const i = t.indexOf(' · ');
  return i === -1 ? t : t.slice(0,i) + ' ' + t.slice(i+3);
}
const resultTextOf = c => c.resultPreviewMarkdown === undefined
  ? c.result : preview(c.resultPreviewMarkdown);
/* dsh: formatElapsedSeconds —— 秒 → 整数毫秒带千分位;未知是破折号,不是 0 */
const elapsed = sec => (sec === null || sec === undefined || !isFinite(sec)) ? '—'
  : String(Math.round(sec*1000)).replace(/\B(?=(\d{3})+(?!\d))/g,',') + ' ms';

function traceTurns(){
  /* **派出去的节点**日志里前几轮是父的（开人时把父的对话当种子抄过来了），那几轮
     不是它干的，不列。**对话自己的支线**（撤回／开支线 fork 出来的）相反：分叉点
     之前那几轮就是它自己的历史，一轮都不能少。分不分得开只看名册（`派出去的`）。 */
  const 我 = ((S.lineage || {}).lines || []).find((l) => l.id === S.sess);
  return 我 && 我.派出去的 ? (S.turns || []).slice(我.inherited || 0) : (S.turns || []);
}

function focusTraceRecord(index, inspect){
  const box = document.getElementById('tj');
  const row = box.querySelector('[data-record-index="' + index + '"]');
  if(row){
    const r = row.getBoundingClientRect(), b = box.getBoundingClientRect();
    box.scrollTop += r.top - b.top - (box.clientHeight - r.height)/2;
  }
  const cell = S.flat.find(c => c.index === index);
  if(inspect && cell) openCell(cell);
}

function focusTraceRange(){
  const box = document.getElementById('tj');
  const rows = [...box.querySelectorAll('.tj-row[data-timeline-focus="inside"]')];
  if(!rows.length) return;
  const height = rows.at(-1).getBoundingClientRect().bottom - rows[0].getBoundingClientRect().top;
  const target = height > box.clientHeight ? rows[0] : rows[Math.floor((rows.length-1)/2)];
  focusTraceRecord(+target.dataset.recordIndex, false);
}

function traceColumnHeading(){
  return '<div class="tj-cols" aria-label="执行记录列">'
    + '<span>记录</span><span>类型</span><span>内容</span></div>';
}

function drawTurns(){
  const box = document.getElementById('tj');
  S.flat = [];
  if(!S.turns){ box.innerHTML = traceColumnHeading() + '<div class="d-empty">读取中…</div>'; return; }
  const 我的轮 = traceTurns();
  if(!我的轮.length){
    box.innerHTML = traceColumnHeading() + '<div class="d-empty">这个会话还没有跑过一步。</div>';
    return;
  }
  const flat = 我的轮.flatMap(t => t.groups.flatMap(g => g.cells));
  const positions = new Map(flat.map((c,i) => [c,i]));
  const matches = traceView?.matches;
  const focusIndexes = traceView?.focusIndexes;
  const html = 我的轮.map(t => {
    if(matches && !t.groups.some(g => g.cells.some(c => matches.has(c.index)))) return '';
    const folded = traceView?.collapsedTurns.has(t.turn);
    const groups = folded ? '' : t.groups.map(g => {
      const rows = g.cells.map(c => {
        const i = positions.get(c);
        if(c.requestOnly || matches && !matches.has(c.index) || traceView?.hiddenCalls.has(c.index)) return '';
        const assistantId = traceOverview.recordId(c);
        const calls = traceView?.callsByAssistant.get(assistantId);
        const callsFolded = traceView?.collapsedAssistants.has(assistantId);
        const foldCall = calls ? `<button class="tj-call-fold" data-assistant="${esc(encodeURIComponent(assistantId))}" aria-expanded="${!callsFolded}" aria-label="${callsFolded?'展开':'收起'}这次调用">${callsFolded?'▸':'▾'}</button>` : '';
        /* 内容格 = 「调用 → 结果」同一行(dsh 同款):工具那行左边是名字+参数,
           右边箭头后面是结果头一句。两半都是逐字截的,不是概括。 */
        const res = resultTextOf(c);
        const body = `<span class="lt">${esc(listTextOf(c))}</span>` + (res === undefined ? ''
          : `<span class="rs${c.isError?' bad':''}">→ ${esc(res)}</span>`);
        const summary = calls && callsFolded ? `<button class="tj-calls-summary" data-assistant="${esc(encodeURIComponent(assistantId))}">▸ ${calls.length} 次工具调用 · ${esc([...new Set(calls.map(c => c.text.split(' · ')[0]))].join('、'))}</button>` : '';
        const focus = focusIndexes ? ` data-timeline-focus="${focusIndexes.has(c.index)?'inside':'outside'}"` : '';
        return `<div class="tj-row${c.isError?' bad':''}${traceView?.selectedIndex===c.index?' lit':''}" data-i="${i}" data-record-index="${c.index}"${focus} title="${esc(listTextOf(c)+(res===undefined?'':' → '+res))}">
            <span class="ix">#${c.index}</span>
            <span class="tag ${标签(c).类}">${标签(c).文}</span>
            <span class="tx">${foldCall}${body}</span>
          </div>${summary}`;
      }).join('');
      if(!rows) return '';
      return `<div class="tj-group"><span class="gt">${esc(g.title)}</span>${
        g.description?`<span class="gd">${esc(g.description)}</span>`:''}</div>${rows}`;
    }).join('');
    /* 分叉按钮长在**轮头**上,不长在每条记录上 —— dsh 只许从完整一轮的边界切。
       长在做不到的位置就是骗人(禁令:形状不合就停下上报,不许迁就)。 */
    const acts = (t.turn===null || t.anchorSeq===undefined) ? ''
      : `<span class="tj-acts">
           <button onclick="doFork(${t.anchorSeq},false)" title="从这一轮结束处分一条新线出去,你留在原地">分叉</button>
           <button onclick="doFork(${t.anchorSeq},true)" title="从这一轮结束处分一条新线,并且把视线切过去。原来这条一个字不动">倒回</button>
         </span>`;
    const fold = t.turn===null ? '' : `<button class="tj-fold" data-fold-turn="${t.turn}" aria-expanded="${!folded}" aria-label="${folded?'展开':'收起'}第 ${t.turn} 轮">${folded?'▸':'▾'}</button>`;
    return `<div class="tj-turn" data-turn="${t.turn===null?'':t.turn}">${fold}${
      t.turn===null?'Compaction':'Turn '+t.turn}${acts}</div>${folded?'':groups}`;
  }).join('');
  box.innerHTML = traceColumnHeading() + (html || '<div class="d-empty">没有匹配的执行记录。</div>');
  S.flat = flat;
  box.querySelectorAll('[data-fold-turn]').forEach(button => {
    button.onclick = () => traceOverview.toggleTurn(+button.dataset.foldTurn);
  });
  box.querySelectorAll('[data-assistant]').forEach(button => {
    button.onclick = e => { e.stopPropagation(); traceOverview.toggleAssistant(decodeURIComponent(button.dataset.assistant)); };
  });
  box.querySelectorAll('.tj-row').forEach(r => {
    r.onclick = () => { const cell = S.flat[+r.dataset.i]; traceOverview?.select(cell.index); openCell(cell); };
    /* 「去对话」是 dsh 那个 Inspect 的反向 —— 同一件事在另一张表上的位置。
       单独一个按钮,不抢行本身那一下(那一下是读全文):一个控件一个手势。 */
    const jump = document.createElement('button');
    jump.className = 'tj-jump'; jump.type = 'button';
    jump.title = '在对话中查看'; jump.setAttribute('aria-label', '在对话中查看');
    jump.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v16l4-4h5"/><path d="M15 16h6m-3-3 3 3-3 3"/></svg>';
    jump.onclick = e => { e.stopPropagation(); toChat(S.flat[+r.dataset.i]); };
    r.appendChild(jump);
  });
}

/* 轨迹里的一条记录 → 对话里它那一块。
   两条路:工具那种按 callId 找它自己那一行,其余按 seq 找它所在的顶层块。
   找不到不许静默 —— 说清是哪一种找不到。 */
function toChat(c){
  if(!c) return;
  showTab('chat');
  const sel = c.callId ? `[data-call="${CSS.escape(String(c.callId))}"]`
            : (typeof c.sourceSeq === 'number' ? `[data-seq="${c.sourceSeq}"]` : null);
  if(!sel){ toast('这一条身上没有能对到对话的坐标'); return; }
  const node = $stream.querySelector(sel);
  if(!node){ toast('对话里没找到这一条（它可能还没定格,或者这一条不在流里）'); return; }
  /* 目标可能正折在一个动作组里 —— 先把那个组打开再跳。
     不喊这一声,这一跳就落在 display:none 上:那是暗层,不是折叠。 */
  if(R && R.reveal) R.reveal(node);
  $stream.querySelectorAll('.lit').forEach(n => n.classList.remove('lit'));
  node.classList.add('lit');
  node.scrollIntoView({block:'center'});
}

/* ================= 节点时间线 =================
   一个座位的一生。今天一个座位就是一条会话血脉 —— 分叉是新开一个会话(dsh 就这么实现),
   所以「这个座位走过的路」物理上散在好几个会话里,服务端把它们收成 lineage 给过来。

   规则(2026-08-17 用户裁):
     · 一根条一轮,**等长**。长度不编码任何东西 —— 10 个字要放得下。
     · 主线走中轴,分叉出去的线上下交替偏一格(08-03 那版死路的画法,换个用途)。
     · 分叉点之前那几轮,两条线**物理上是同一批事件** —— 条只画一次,从分叉那根才叉开。
     · 当前这条线填实,别的线只描边。
     · 这张图**只读**:上面不放分叉按钮。动手在对话页的轮尾行、轨迹表的轮头上。
     · 条上那格字＝轮数与步数(2026-08-26 用户裁定:原来那句「等 shadow」退役)。

   列坐标不认轮号,认**这条线里的第几根** —— 分叉之后轮号连不连是 dsh 的事,
   按位置排,连不连都对得齐。 */
const TL_W = 96, TL_GAP = 8, TL_H = 24, TL_LANE = 36, TL_PAD = 140;

function sessionTimelineHeading(count = null, turns = 0){
  return '<div class="tl-head"><span class="tl-head-label">Session</span>'
    + '<span class="tl-head-caption">轮次</span><span class="tl-head-count">'
    + (count === null ? '' : count + ' 条会话 · ' + turns + ' 轮') + '</span></div>';
}

function drawTimeline(){
  const box = document.getElementById('tl');
  const L = S.lineage;
  if(!L || !L.lines || !L.lines.length){
    box.innerHTML = sessionTimelineHeading(0) + '<div class="pane-empty">还没有会话分支记录。</div>';
    return;
  }

  /* ── 只画**你这一条线**（2026-08-26 用户裁定）────────────────────────────
     服务端给的 `L.lines` 是**整条血脉**：祖先 ＋ 全部后代。时间线原来照单全画，
     于是项目开了几十个节点，这里就摞几十行 —— 用户原话：「这个轨迹的部分应该是
     针对一个节点的分支，现在整个项目开多少节点都加到一起了」。

     时间线讲的是**一件事**：你这条线是从哪一轮分出来的、分之前那几轮是谁跑的。
     那是「Blueprint → 当前」这一条路径的事，跟你的堂兄弟节点无关 —— 它们各有各的历史，
     摞在一起既不是同一根时间轴，也没有共同的分叉点可讲。

     ── 祖先那条线**照画到底** ────────────────────────────────────────────
     分叉点之后祖先自己还在跑的那几轮仍然画（画成副线）—— 它们回答的正是
     「我从哪儿分出来的、那之后上级又干了什么」，是这条线的一部分，不是别人的事。 */
  const byId = new Map(L.lines.map(l => [l.id, l]));
  const path = [];
  for(let id = L.current; id && byId.has(id) && !path.includes(id); id = byId.get(id).parent) path.unshift(id);
  /* ── 时间线讲的是**一个对话之内**的事（2026-08-26 用户裁定）──────────────
     用户原话：「轨迹真正的作用是一个对话内撤回，或者开支线的情况」。
     所以这里要画的是**这个对话和它自己的支线**，不是树上别的节点。

     难点：两者在账本上长得一模一样 —— 派活开出来的子节点，和你撤回后开的支线，
     都是 `parentSession` ＋ `seedLength`。**只有名册分得开**：名册上有 prompt 的
     是派出去的节点（另一个对话），没有的是这个对话自己 fork 出来的支线。
     服务端把这一格算好放在 `派出去的` 里。

     取法：从当前会话出发，**只沿着"不是节点"的那些边走** ——
       往上：我自己不是节点 → 我是父那个对话的一条支线 → 把父带上，继续往上。
       往下：孩子不是节点 → 它是我的支线 → 带上，继续往下。
     碰到节点边就停：那边是另一个对话，不归这根轴管。 */
  const 同一对话 = new Set([L.current]);
  for(let id = L.current; byId.has(id) && !byId.get(id).派出去的; ){
    const p = byId.get(id).parent;
    if(!p || !byId.has(p) || 同一对话.has(p)) break;
    同一对话.add(p); id = p;
  }
  for(const ln of L.lines){
    /* 支线可能挂在这条对话的任何一段上，所以反复扫到不再长为止 */
    if(ln.派出去的 || 同一对话.has(ln.id)) continue;
    for(let cur = ln, 链 = []; cur && !cur.派出去的; cur = byId.get(cur.parent)){
      链.push(cur.id);
      if(同一对话.has(cur.parent)){ 链.forEach((x) => 同一对话.add(x)); break; }
      if(!cur.parent || !byId.has(cur.parent)) break;
    }
  }
  const 线们 = byId.has(L.current) ? L.lines.filter((l) => 同一对话.has(l.id)) : L.lines;

  /* 车道以这个对话的起点居中，避免项目根不在图里时多出一条空车道。 */
  const familyRoot = 线们.find(ln => !同一对话.has(ln.parent))?.id || L.current;
  const lane = new Map([[familyRoot, 0]]);
  let k = 0;
  for(const ln of 线们){
    if(lane.has(ln.id)) continue;
    k++; lane.set(ln.id, (k % 2 ? -1 : 1) * Math.ceil(k/2));
  }
  /* 起始列 = 从父那儿继承了几轮。这个数是服务端算好的(`inherited`)——
     前端不该知道 seedLength 是什么单位。 */
  const startCol = new Map();
  const own = new Map();
  for(const ln of 线们){
    const n = ln.inherited || 0;
    startCol.set(ln.id, n);
    own.set(ln.id, (ln.turns||[]).slice(n));
  }

  const lanes = [...lane.values()];
  const lo = Math.min(0, ...lanes), hi = Math.max(0, ...lanes);
  const cols = Math.max(1, ...线们.map(l => startCol.get(l.id) + own.get(l.id).length));
  const yOf = ln => (lane.get(ln) - lo) * TL_LANE + 6;
  /* 左边留一条槽给每条轨道的名牌 —— 几条线都活着的时候你得知道哪条是哪条 */
  const xOf = col => col * (TL_W + TL_GAP) + TL_PAD;

  const parts = [];
  for(const ln of 线们) parts.push(`<div class="tl-lane" aria-hidden="true" style="top:${yOf(ln.id)-6}px"></div>`);
  /* 接头:从父线分叉那一根的右缘,拐到子线第一根的左缘 */
  for(const ln of 线们){
    if(!ln.parent || !lane.has(ln.parent)) continue;
    const x = xOf(startCol.get(ln.id)) - TL_GAP/2;
    const y1 = yOf(ln.parent) + TL_H/2, y2 = yOf(ln.id) + TL_H/2;
    parts.push(`<div class="tlwire" style="left:${x}px;top:${Math.min(y1,y2)}px;width:1px;height:${Math.abs(y2-y1)}px"></div>`);
    parts.push(`<div class="tlwire" style="left:${x}px;top:${y2}px;width:${TL_GAP/2+4}px;height:1px"></div>`);
  }
  /* 「你现在在哪条线上」不等于「哪条线是当前会话」:分叉点之前那几根条是**祖先画的**,
     但它们同样是你这条线的历史。所以先把 Blueprint→当前那条路径求出来,
     路径上每一段各自负责的列区间 [自己的起始列, 下一段的起始列) 就是**主线**那一段。
     不这么算的话,一分叉,你自己前三轮就变成副线了 —— 那是在骗人。

     **主副是相对的,不是线自己的属性**(2026-08-17 用户裁):
     从 A 进来 A 就是主线,从 B 进来 B 就是主线。副线不是废线 —— 它们在做别的事,
     所以它们的画法是「另一条实实在在的轨道」,不是虚掉、不是半透明。 */
  const hot = new Map();                 /* 线 id → [起列, 止列) 这一段属于主线 */
  path.forEach((id, p) => {
    const next = path[p+1];
    hot.set(id, [startCol.get(id), next ? startCol.get(next) : Infinity]);
  });
  /* 这一根条是不是**你自己的**。是 → 点它只滚不切(它在你的表里也有);
     不是 → 点它整体切到它那条线去。上一版拿「当前表里找得到吗」当判据,
     而轮号跨分叉是连着数的,于是点 B 的第 5 根会就地滚到 A 的第 5 轮。 */
  const mineAt = (id, col) => {
    const r = hot.get(id);
    return !!r && col >= r[0] && col < r[1];
  };

  for(const ln of 线们){
    const cells = own.get(ln.id);
    const c0 = startCol.get(ln.id);
    /* 轨道杆:一条线是一条轨,不是一堆孤立的格子。主线的杆实一档。
       **一条线可能一半是主一半是副** —— 祖先那条线,分叉点之前是你的历史(主),
       之后是它自己的另一条分支(副)。所以杆要按主副的边界断开画,不能一根到底。 */
    const cEnd = c0 + Math.max(1, cells.length);
    const r = hot.get(ln.id);
    const mFrom = r ? Math.max(c0, r[0]) : 0, mTo = r ? Math.min(cEnd, r[1]) : 0;
    const rail = (from, to, kind) => {
      if (to <= from) return;
      parts.push(`<div class="tlrail ${kind}" style="left:${xOf(from)}px;top:${yOf(ln.id)+TL_H/2}px;`
        + `width:${Math.max(0, xOf(to) - TL_GAP - xOf(from))}px"></div>`);
    };
    if(r && mTo > mFrom){ rail(c0, mFrom, 'sub'); rail(mFrom, mTo, 'main'); rail(mTo, cEnd, 'sub'); }
    else rail(c0, cEnd, 'sub');
    /* 名牌:这条轨是谁。你在的那条只做视觉强调,**不加字** ——
       页面上没有「主线」这个说法(2026-08-17 用户裁),强调本身已经在说话了。 */
    parts.push(`<div class="tltag ${path[path.length-1] === ln.id ? 'main' : 'sub'}"
      style="top:${yOf(ln.id)}px" title="${esc('会话 ' + ln.id)}">${
      esc(shortId(String(ln.id).replace(/^session[-_]/, '')))}</div>`);

    cells.forEach((t, i) => {
      const col = c0 + i;
      const mine = mineAt(ln.id, col);
      const cls = ['tlbar', mine ? 'main' : 'sub', t.error ? 'bad' : ''].filter(Boolean).join(' ');
      const tip = [`轮 ${t.turn}`, `${t.steps} 步`,
                   t.runMs!==undefined ? dur(t.runMs) : '用时未记',
                   mine ? '你在的这条线' : '另一条线 · 点它整体切过去 · 会话 ' + shortId(ln.id)].join(' · ');
      parts.push(`<button type="button" class="${cls}" style="left:${xOf(col)}px;top:${yOf(ln.id)}px;width:${TL_W}px"
        data-sess="${esc(ln.id)}" data-turn="${t.turn}" data-mine="${mine ? 1 : 0}" title="${esc(tip)}">
        <span class="w">Turn ${t.turn}</span>${Number.isFinite(t.steps)?`<span class="steps">${t.steps} 步</span>`:''}</button>`);
    });
    /* 一根自己的条都没有的线:刚分出来还没跑过。**必须留一个桩** ——
       不然你刚切出去的那条线在图上根本不存在,也就回不去了。
       接头那根线还指着它,指向一片空白比画错更糟。
       桩保持虚线:那个虚线的意思是「还没发生」,不是「废了」——语义是对的。 */
    if(!cells.length && !ln.broken){
      parts.push(`<button type="button" class="tlbar ${mineAt(ln.id, c0) ? 'main' : 'sub'} stub"
        style="left:${xOf(c0)}px;top:${yOf(ln.id)}px;width:${TL_W}px"
        data-sess="${esc(ln.id)}" data-turn="" data-mine="0"
        title="${esc('会话 '+shortId(ln.id)+' · 从这儿分出去,还没自己跑过一轮')}">
        <span class="w void">还没跑过</span></button>`);
    }
    if(ln.broken) parts.push(`<div class="tl-note warn" style="left:${xOf(startCol.get(ln.id))}px;top:${yOf(ln.id)}px">
      这条线读不出：${esc(ln.broken)}</div>`);
    /* 坏血统不许被画成「没跑过」,接不上的洞不许当成画错了 ——
       两样都是数据真的对不上,说出来才叫零暗层 */
    for(const w of [ln.seedBad, ln.gap]){
      if(!w) continue;
      parts.push(`<div class="tl-note warn" style="left:${xOf(startCol.get(ln.id))+TL_W+10}px;top:${yOf(ln.id)+4}px">
        ⚠ ${esc(w)}</div>`);
    }
  }
  if(L.dropped > 0) parts.push(`<div class="tl-note warn" style="position:sticky;left:8px">
    这条血脉还有 ${L.dropped} 条线没画（一次最多 20 条）</div>`);
  const roundCount = [...own.values()].reduce((sum, cells) => sum + cells.length, 0);
  box.innerHTML = sessionTimelineHeading(线们.length, roundCount)
    + `<div id="tl-stage" style="width:${xOf(cols)+12}px;height:${(hi-lo+1)*TL_LANE}px">${parts.join('')}</div>`;
  box.querySelectorAll('.tlbar').forEach(b => b.onclick =
    () => pickTurn(b.dataset.sess, +b.dataset.turn, b.dataset.mine === '1'));
}

/* 点一根条。
   **主线上的条** —— 只滚,不切。它就在你的表里。
   **副线上的条** —— 整体切到那条线:会话换掉,对话页和轨迹表一起跟过去,
   时间线重画之后那条线就成了主线。这是用户要的:点谁就整个搬到谁那儿。
   切会话是异步的(要重取历史),所以滚要等它回来。 */
async function pickTurn(sess, turn, mine){
  if(!mine && sess && sess !== S.sess) await 切到({在:'project', 看:sess});
  /* 桩(还没跑过一轮的那条线)没有轮号:切过去就完了,没有可滚的地方 */
  if(!turn) return;
  const box = document.getElementById('tj');
  const head = box.querySelector(`.tj-turn[data-turn="${turn}"]`);
  if(!head){ toast(`这张表里没有第 ${turn} 轮`); return; }
  box.querySelectorAll('.tj-turn.lit').forEach(n => n.classList.remove('lit'));
  head.classList.add('lit');
  head.scrollIntoView({block:'start'});
}

/* ================= 分叉 / 倒回 =================
   物理上是同一件事:事件流 append-only,没有「删掉后面」这回事。
   分叉 = 从这一轮结束处复制一份前缀,开一条新线;原来那条一个字不动。
   倒回 = 分叉 + 把视线切过去。区别只在**之后你跟谁说话**。
   实现全在 dsh 的 sessions.fork 里,我们只发一条 POST。 */
window.doFork = async (atSeq, jump, 说法) => {
  const r = await rpc('session.fork', {sessionId:S.sess, atSeq});
  if(!r.ok) return;
  const child = String(r.value.sessionId);
  /* 「撤回」按下时说的是另一句话:用户以为那句话没了,实际是另起了一条不含它的线。
     **原来那条一个字没动这件事必须当场说出来**,不然下次他找不回来会以为丢了。 */
  toast(说法 === '撤回' ? `撤回了 —— 从上一个回答处另起一条线 ${shortId(child)}，原来那条一个字没动，下拉里还在`
      : jump ? `倒回到新线 ${shortId(child)}` : `分出一条线 ${shortId(child)}`);
  if(jump) await 切到({在:'project', 看:child});
  else await refresh();
};

/* 左上那一栏是**节点树**的地方 —— 座位与座位之间那棵树。
   2026-08-17 用户裁定:会话不许占这个位置。会话的切换在页签行那个下拉里,
   会话的血统(parentSession / seedLength)由 /api/history 一并返回,等节点树落地时再定怎么画。 */

/* 读全文:这条记录身上有的字段全摊开。**折叠可以有,暗层不能有** ——
   有的字段就画,没有的不画,不猜、不补、不合并。 */
function openCell(c){
  if(!c) return;
  const sec = (label, text, cls) => (text === undefined || text === null || text === '')
    ? '' : `<div class="d-sec">${esc(label)}</div><div class="d-raw${cls?' '+cls:''}">${esc(text)}</div>`;
  const parts = [];

  /* 机器行:原样的坐标,不翻译 */
  const mach = [`kind ${c.kind}`,
    c.turn!==undefined?`turn ${c.turn}/${c.step}`:'',
    c.sourceSeq!==undefined?`seq ${c.sourceSeq}`:'',
    c.callId?`call ${c.callId}`:'',
    c.model?`model ${c.model}`:''].filter(Boolean).join(' · ');
  parts.push(`<div class="d-mach">${esc(mach)}</div>`);

  if(c.promptDetail){
    const p = c.promptDetail;
    parts.push(sec('模型', `${p.config?.provider??'?'} / ${p.config?.model??'?'}  ·  缘由 ${p.reason??'?'}`));
    parts.push(sec(`工具 ${(p.tools||[]).length} 把`, (p.tools||[]).map(t=>t.name).join('  ')));
    parts.push(sec('SYSTEM PROMPT 全文', p.system));
  }
  parts.push(sec('参数', c.inputDetail));
  parts.push(sec('想', c.thinkingDetail));
  parts.push(sec(c.kind==='tool' ? (c.isError?'出错':'结果') : '正文',
                 c.outputDetail, c.isError?'bad':''));
  /* preview 是上面某一段的头一句时不重复画 —— 重复不是暗层,但它挤走真东西 */
  if(c.previewMarkdown && c.previewMarkdown !== c.outputDetail
     && c.previewMarkdown !== c.thinkingDetail && c.previewMarkdown !== c.inputDetail){
    parts.push(sec('内容', c.previewMarkdown));
  }

  /* 原始块:按模型看见的次序,一块不少 */
  const blocks = bs => bs.map((b,i)=>`#${i+1} ${b.type}${b.toolName?' · '+b.toolName:''}\n${b.content}`).join('\n\n');
  if(c.sourceBlocks && c.sourceBlocks.length > 1) parts.push(sec('原始块（模型次序）', blocks(c.sourceBlocks)));
  if(c.outputBlocks && c.outputBlocks.length > 1) parts.push(sec('结果块', blocks(c.outputBlocks)));

  const tok = [['输入(未缓存)',c.input],['输出',c.output],['思',c.think],
               ['缓存读',c.cacheRead],['缓存写',c.cacheWrite]]
    .filter(([,v])=>v!==undefined).map(([k,v])=>`${k} ${v}`).join('  ·  ');
  parts.push(sec('TOKEN（五个数互不重叠）', tok));

  const m = c.assistantMetrics;
  if(m){
    const line = !m.timingRecorded ? '这一步没有记下计时'
      : [m.stepStartTime!==null&&m.firstTokenTime!==null ? '首 token '+elapsed((m.firstTokenTime-m.stepStartTime)/1000) : '首 token —',
         m.firstTokenTime!==null&&m.completedTime!==null ? '生成 '+elapsed((m.completedTime-m.firstTokenTime)/1000) : '生成 —',
         m.stepStartTime!==null&&m.completedTime!==null ? '整步 '+elapsed((m.completedTime-m.stepStartTime)/1000) : '整步 —',
         m.usageProvided ? '' : '（模型没报 usage）'].filter(Boolean).join('  ·  ');
    parts.push(sec('计时', line));
  }
  parts.push(sec('自身时长', elapsed(c.timeSeconds)));
  if(c.startedAt) parts.push(sec('开始于', new Date(c.startedAt).toLocaleString('zh-CN',{hour12:false})+'.'+String(c.startedAt%1000).padStart(3,'0')));

  wsOpen('cell-'+c.index, `#${c.index} ${标签(c).文}`, parts.join(''),
    c.sourceSeq !== undefined && !['system','compacted'].includes(c.kind)
      ? {session:S.sess, view:'used', scope:'self', seq:c.sourceSeq, ...(c.callId ? {callId:c.callId} : {})} : undefined);
}

/* ================= 当前节点统计：关键数值常驻页签行，详情按需展开 ================= */
let statsSession = null;
function closeStats(focus=false){
  const box = document.getElementById('node-stats'), button = document.getElementById('node-stats-toggle');
  if(!box || !button) return;
  const wasOpen = !box.hidden;
  box.hidden = true; button.setAttribute('aria-expanded','false');
  if(focus && wasOpen && !button.hidden && !button.disabled) button.focus();
}
function positionStats(){
  const box = document.getElementById('node-stats'), button = document.getElementById('node-stats-toggle');
  if(!box || box.hidden || !button) return;
  const r = button.getBoundingClientRect(), pad = 12;
  const below = innerHeight - r.bottom - pad - 4, above = r.top - pad - 4;
  const placeBelow = below >= Math.min(box.scrollHeight,240) || below >= above;
  box.style.maxHeight = Math.max(1, placeBelow ? below : above)+'px';
  box.style.left = Math.max(pad,Math.min(r.right-box.offsetWidth,innerWidth-box.offsetWidth-pad))+'px';
  box.style.top = (placeBelow ? r.bottom+4 : Math.max(pad,r.top-box.offsetHeight-4))+'px';
}
function initStats(){
  const box = document.getElementById('node-stats'), button = document.getElementById('node-stats-toggle');
  box.innerHTML = '<div class="stats-heading"><h3>节点统计</h3><button class="stats-close" type="button" aria-label="关闭节点统计" title="关闭">×</button></div><div id="node-stats-content"></div>';
  box.querySelector('.stats-close').onclick = () => closeStats(true);
  button.onclick = () => {
    if(!box.hidden){ closeStats(); return; }
    if(!数据在手()) return;
    开项目单(false);
    statsSession = S.sess; drawStats(D.载.stats);
    box.hidden = false; button.setAttribute('aria-expanded','true'); positionStats();
    box.querySelector('.stats-close').focus();
  };
  document.addEventListener('pointerdown', e => {
    if(!box.hidden && !box.contains(e.target) && !button.contains(e.target)) closeStats();
  },true);
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && !box.hidden){ e.preventDefault(); e.stopImmediatePropagation(); closeStats(true); }
  },true);
  box.addEventListener('keydown', e => {
    if(e.key !== 'Tab') return;
    const items = Array.from(box.querySelectorAll('button,summary')).filter(el => !el.disabled && el.getClientRects().length);
    const first = items[0], last = items[items.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });
  window.addEventListener('resize',positionStats);
}
function drawStats(st){
  const box = document.getElementById('node-stats-content');
  if(!box) return;
  const name = document.querySelector('#nplate b')?.textContent || shortId(S.sess);
  const caption = `<div class="stats-caption">当前节点 · ${esc(name)}${S.busy ? ' · 工作中' : ''}</div>`;
  if(!st || !st.steps){ box.innerHTML = caption + '<p class="stats-explain">还没有运行记录。</p>'; return; }
  const billed = (st.input||0) + (st.cacheRead||0) + (st.cacheWrite||0);
  const total = billed + (st.output||0), context = st.context;
  const number = n => typeof n === 'number' && Number.isFinite(n) ? n.toLocaleString('en-US') : '—';
  const time = n => typeof n === 'number' && Number.isFinite(n) ? dur(n) : '—';
  const row = (label,value,title='') => `<dt>${esc(label)}</dt><dd${title ? ` title="${esc(title)}"` : ''}>${value}</dd>`;
  const costOpen = box.querySelector('#stats-cost-detail')?.open;
  const focused = box.contains(document.activeElement) ? document.activeElement.id : null;
  box.innerHTML = caption
    + '<section class="stats-section"><h4>用量</h4><dl class="stats-values">'
    + row('上下文',number(context),'最近一次模型报告的上下文占用；未报告时显示 —')
    + row('累计 token',number(total),'计费输入（含缓存）与输出的累计总和')
    + row('节点费用',画钱(st['钱']),钱话(st['钱']))
    + '</dl><p class="stats-explain">上下文是最近一次报告的占用，累计是这个节点的历史用量。</p>'
    + `<details class="stats-details" id="stats-cost-detail"${costOpen ? ' open' : ''}><summary id="stats-cost-summary">费用明细</summary><p>${esc(钱话(st['钱']).replaceAll('**',''))}</p></details></section>`
    + '<section class="stats-section"><h4>运行</h4><dl class="stats-values">'
    + row('轮数 / 步数',number(st.turns)+' / '+number(st.steps))
    + row('LLM 用时',time(st.llmMs))
    + row('工具用时',time(st.toolMs))
    + row('平均首 token',st.ttftSteps > 0 ? time(st.ttftMs/st.ttftSteps) : '—')
    + row('平均生成速度',st.decodeMs > 0 ? (Math.round(st.decodeTokens/(st.decodeMs/1000)*10)/10)+' tok/s' : '—')
    + row('缓存命中',billed > 0 ? Math.round((st.cacheRead||0)/billed*100)+'%' : '—')
    + row('输入（含缓存）',number(billed))
    + row('输出',number(st.output))
    + '</dl><p class="stats-explain">耗时与速度来自已记录的步骤；工作中统计随记录更新。</p></section>';
  if(focused) document.getElementById(focused)?.focus({preventScroll:true});
}

/* ================= 活流:SSE 接进渲染器 =================
   服务端已经把 dsh 的会话事件翻译好了,这里只做两件事:
   ① 不是当前会话的帧丢掉  ② 该给渲染器的给渲染器,该我们自己管的自己管。
   轮次收尾(busy:false)重取一次历史 —— 于是「实时长出来的形态」与
   「重新加载后的形态」每一轮都对一次账(验收 4)。 */
function connect(){
  if(!S.sess || !window.EventSource || esrc?.session === S.sess) return;
  esrc?.close();
  esrc = new EventSource('api/stream?session='+encodeURIComponent(S.sess));
  esrc.session = S.sess;
  let receivedHello = false;
  esrc.onmessage = m => { try{
    const frame = JSON.parse(m.data);
    if(frame.type === 'blueprint.hello'){
      frame.reconnected = receivedHello; receivedHello = true;
    }
    feed(frame);
  }catch(_){ } };
  const currentSource = esrc;
  esrc.onerror = () => { if(esrc === currentSource) 暂停工作时间显示(); /* 重连后用服务端累计校准 */ };
}

/* 落档中的那几次 archive 调用(callId)。**只为了在收工那一帧认出它是 archive** ——
   `tool_execution_end` 身上没有工具名,所以开工那一刻记一笔。 */
const 落档中 = new Set();

function feed(f){
  globalThis.goalView?.event(f);
  globalThis.featuresView?.event(f);
  // 诊断帧不改变展示数据，尤其不能因陌生会话反复重取整棵树。
  if(f.type === 'blueprint.undrawn') return;
  if(f.type === 'blueprint.work-time'){
    if(数据在手() && D.载.工作时间?.project === f.project){
      D.载.工作时间 = 合并工作时间(f);
      paintTop();
    }
    return;
  }
  产物画廊?.event(f);
  /* 同一条 EventSource 再收到 hello 才是断线重连，需要补取当前数据。
     切节点新建连接的首声 hello 不重复取数；切节点那趟已在取历史。 */
  if(f.type === 'blueprint.hello'){
    /* 重启过 ＝ settings 可能改过（加了模型）：目录作废重取，不然新加的要刷新网页才看得见 */
    if(f.reconnected){ 目录 = null; 目录再问 = 0; 软刷新(); paintModels(); window.refreshComposerInfo?.(); }
    return;
  }
  if(f.type === 'blueprint.ask_seen'){
    落已读(f.session, f.rpcIds || []);
    return;
  }

  /* 「要你点头」先记账,**再**过会话这道筛子。
     顺序反了就会漏:一件等着你点头的事发生在另一个会话上,被筛掉之后
     那个会话会一直卡着,而这张脸上一点异常都看不出来 —— 那正是暗层。
     记下来,顶栏就会说「别处还有 N 件」,你至少知道该切过去。 */
  if(f.type === 'blueprint.ask'){
    /* **新来的才响。** 两种不算新:同一个 rpcId 再来一次(那是同一件事);
       服务端盖了 `补发` 章的(断线重连时它把还悬着的补一遍,不是刚发生的事 ——
       一开页面被几声铃泼一脸,下次你就把铃关了)。
       **章由发的人盖,不由这边掐表猜** —— 掐表会把重连头一秒里真来的那件也吞掉。 */
    const 已看 = S.asks.get(f.rpcId)?.seen || f.seen;
    // Desktop requests use the main-process OS sound; the browser keeps its own chime.
    if(!window.blueprintDesktop?.onAttention && !已看 && !f.补发 && !S.asks.has(f.rpcId)) 响('等你回应');
    S.asks.set(f.rpcId, {...f, seen:!!已看});
  }
  else if(f.type === 'blueprint.ask_done'){
    if(f.rpcId) S.asks.delete(f.rpcId);
    else for(const [id, x] of S.asks) if(x.approvalId === f.approvalId) S.asks.delete(id);
  }
  /* 树也要跟着重画：「有人在等你回话」那盏灯（判据第 6 条）是服务端从 pending 算的，
     不重取一次，一个正等你签字的节点会一直显示成「停止」。 */
  if(f.type === 'blueprint.ask' || f.type === 'blueprint.ask_done'){ paintAskBadge(); paintTop(); 软刷新('树'); }

  /* ---- 树是全项目的,所以这两种帧**不过会话这道筛子**（2026-09-05 用户报:
       「节点的拍子的显示不会动态变化,必须我刷新才会变化」）----

     下面那道筛子是给**对话流**的 —— 一次只看一条线,别人的话不该窜进你这一屏。
     可树不是一条线:二十格里随便哪一格落了一块料、走完一拍,树上那根拍子轨就该实心。
     筛子在前,于是**除了你正看着的那一格,谁动树都不知道**,只有手动刷新才对得上。
     （这不是弧的事:弧照常把下一拍递进去、料照常落柜,是这张脸没去重取。）

     认两样,都是机械信号:
     ① `blueprint.busy` —— 有人开跑或收工,卡的形态要变;
     ② **`archive` 那把工具收工** —— 柜子里多了一块,而拍子轨读的就是"这一拍的产物落柜没有"。
        拍子是在**一轮之内**往前走的,光认 busy 只能等到这一轮结束才看得见。
        `tool_execution_end` 那一帧身上没有工具名(只有 callId),所以开工那一刻记一笔。 */
  /* 后台在跑的东西变了(有人开跑/收工、后台工作册子动了)——
     **只有那一列开着的时候才去取**。关着的时候一个请求都不发。 */
  if(f.type === 'blueprint.在跑变了'){
    S.在跑几 = f['几'] | 0;
    画在跑钮();                                  /* 数字不等取数 —— 它本来就在帧上 */
    if(S.抽屉 === '在跑') 攒着取在跑();           /* 那一列开着才去取全表 */
    return;
  }
  if(f.type === 'blueprint.external_changed'){
    if(!f.session || f.session === S.sess) 刷新外部协助();
    return;
  }

  /* 帧上认不出是谁的（没带 session），按老规矩整份取 —— 宁可多取，不许漏 */
  const 别格的 = !!f.session && f.session !== S.sess;
  if(f.type === 'blueprint.busy') 软刷新(别格的 ? '树' : '全');
  /* 09-13 起落柜的不止 archive：submit（开人＋简报）、assign（草稿）、schedule（备忘录）、
     note（纸条）、braintrust（智囊原话）都往柜子里写，树要跟着动。 */
  else if(f.type === 'tool_execution_start' && ['archive','assign','submit','schedule','note','braintrust'].includes(f.toolName)) 落档中.add(f.toolCallId);
  /* 外脑挂在 Sub 托上（DESIGN_GUIDE 3.9）：开口、回话各刷一次树，那一行才亮起、落下 */
  else if(f.type === 'tool_execution_start' && f.toolName === 'brain'){ 落档中.add(f.toolCallId); 软刷新('树'); }
  else if(f.type === 'tool_execution_end' && 落档中.delete(f.toolCallId)) 软刷新(别格的 ? '树' : '全');

  /* 别的会话在跑:这一版一次只看一个,但名单要跟上(不然新会话看不见) */
  if(f.session && f.session !== S.sess){
    if(!S.sessions.some(s => s.id === f.session)) 软刷新('树');
    return;
  }
  /* ⚠️ **这儿没有"帧一来就开窗"那一段了**(2026-09-10 删)。
     preview 摆出来的东西,入口是**对话里那一行工具上那个「打开」**
     —— 理由写在 `stream-render.js` 的 `摆出了一屏` 那张表头上,这儿不讲第二遍。
     工具那一行照样在流里长出来(它是一次真的调用,不是暗管子)。 */

  switch(f.type){
    case 'blueprint.busy':
      S.busy = !!f.busy;
      if(f.busy && Number.isSafeInteger(f.turn))navOpenTurns.set(S.sess,f.turn);
      else if(!f.busy)navOpenTurns.delete(S.sess);
      更新轮导航([]);
      S['busy自'] = f.busy ? (f['自'] || Date.now()) : 0;
      paintTop();
      /* **活条在这一刻就挂上去,不等模型吐字。** 这一帧是 `turn/start` 发的,
         而「有字流过来了」要再等几十秒到几分钟 —— 那段空窗正是这根条要填的。 */
      在跑同步();
      window.paintComposer?.();
      /* **两头都要重画树，不是只在收尾那一头。**（2026-08-28 修，用户报的三条同一个根因）
         卡上那个状态是服务端算好发过来的 —— 轮次开跑的那一刻不重取一次，
         树上还是上一轮的样子：人已经在跑了，卡还写着「停止」，刷新网页才对。
         原来这儿是 `if(!f.busy) refresh()` ——「只在下班时更新的公告栏」。
         2026-09-05:取数那一半挪到上面的 `软刷新()` 去合并了(几十格同时动只取一次),
         这儿只留顶栏 —— 顶栏是本地状态,画它不要钱,不该等那几百毫秒。 */
      return;
    case 'blueprint.entry':
      /* 走 history() 而不是另写一条上屏路径 —— 实时与回放共用同一份翻译 */
      R.history([f.entry]);
      更新轮导航([f.entry]);
      return;
    /* 这一步吃进／交出的那几块料 —— **一步一排,不等这一轮结束**。
       服务端发的是拆好的印(`块印们()`),这儿只做 `词块化()` 那一层皮,
       跟刷新后重画走的是同一个函数。 */
    case 'blueprint.块排':
      R.块排({调用: f['调用'], seq: f.seq, 进: 词块化(f.进), 出: 词块化(f.出)});
      return;
    /* 「排着队 —— 还没被读到」那一行的撤回。发这一帧的时机由服务端定
       （那条消息真落成了 user/message），这里只执行,不判断。 */
    case 'blueprint.entry_drop':
      R.drop(f.seq);
      navEntries=navEntries.filter(e=>e.seq!==f.seq);更新轮导航([]);
      return;
    default:
      R.feed(f);
      if(f.type==='message_start' && Number.isSafeInteger(f.turn)){navOpenTurns.set(S.sess,f.turn);更新轮导航([]);}
      if(f.type==='message_end' && Number.isSafeInteger(f.seq))更新轮导航([{type:'message',seq:f.seq,turn:f.turn,message:f.message}]);
  }
}

/* 页签的键盘动作复用点击路径；重画后按稳定键找回焦点。 */
function wireTabKeys(bar, selector, dataKey){
  bar.addEventListener('keydown', e => {
    const tab = e.target.closest(selector);
    if(!tab || !bar.contains(tab)) return;
    const all = [...bar.querySelectorAll(selector)];
    let target = tab, index = all.indexOf(tab);
    if(e.key === 'ArrowRight') target = all[(index + 1) % all.length];
    else if(e.key === 'ArrowLeft') target = all[(index - 1 + all.length) % all.length];
    else if(e.key === 'Home') target = all[0];
    else if(e.key === 'End') target = all[all.length - 1];
    else if(e.key === 'Delete'){
      const close = tab.querySelector('.x');
      if(!close) return;
      e.preventDefault(); close.click();
      bar.querySelector(selector + '[aria-selected="true"]')?.focus();
      return;
    }
    else if(e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    const key = target.dataset[dataKey]; target.click();
    [...bar.querySelectorAll(selector)].find(t => t.dataset[dataKey] === key)?.focus();
  });
}

document.getElementById('dw-body').addEventListener('keydown', e => {
  const row = e.target.closest('#dw-tree .fz-row');
  if(!row || !['ArrowDown','ArrowUp','ArrowRight','ArrowLeft','Home','End','Enter',' '].includes(e.key)) return;
  e.preventDefault();
  const F = S.文件, i = Number(row.dataset.i), r = F.行们[i];
  F.焦 = r.路;
  if(e.key === 'Enter' || e.key === ' '){ row.click(); return; }
  if(e.key === 'ArrowRight' && r.节点.夹 && !F.开.has(r.路)){ 展开文件夹(r.路, true); return; }
  if(e.key === 'ArrowLeft' && r.节点.夹 && F.开.has(r.路)){ 展开文件夹(r.路, false); return; }
  let j = i;
  if(e.key === 'Home') j = 0;
  else if(e.key === 'End') j = F.行们.length-1;
  else if(e.key === 'ArrowLeft') j = F.行们.findIndex(n => n.节点 && n.路 === r.路.split('/').slice(0,-1).join('/'));
  else j += e.key === 'ArrowUp' ? -1 : 1;
  const step = j < i ? -1 : 1;
  while(j >= 0 && j < F.行们.length && !F.行们[j].节点) j += step;
  if(j < 0 || j >= F.行们.length) return;
  F.焦 = F.行们[j].路;
  const tree = document.getElementById('dw-tree'), y = j*文件行高;
  if(y < tree.scrollTop) tree.scrollTop = y;
  else if(y+文件行高 > tree.scrollTop+tree.clientHeight) tree.scrollTop = y+文件行高-tree.clientHeight;
  画文件视口();
  tree.querySelector(`[data-i="${j}"]`)?.focus({preventScroll:true});
});

});

/* ================= 新项目:建文件夹 → 开 Blueprint =================
   两步是**一个动作**,顺序不许换:先有文件夹,再有座位。
   反过来(先开会话后建文件夹)会留下一个没处放东西的空对话 —— 那正是这一版要去掉的。
   建文件夹与开座位在服务端一次做完(POST api/project,失败会把刚建的空文件夹删掉)。

   **这张表不发话。** 你填的那段描述由服务端落成柜子里的《初始用户要求》,
   Blueprint 睁眼那一刻它已经在出生包里了 —— 前端再补发一句就是第三份,
   而且是排在队尾、九分钟后才到的那一份（理由见 form.onsubmit 末尾那段）。 */
/* 「砖开着 / 流让位 / 输入条让位」这三件事**不在这儿** ——
   它们是 `脸` 那张表里「输入条与砖」那一格的事,坐标一换自己就对了。
   这里只剩这张表自己的活:填什么、送什么、送完怎么办。 */
/* 开一张新项目的表 ＝ **换一个坐标**,不是弹一个窗。
   顶栏、下拉、树、脚注、档案、统计、轨迹、流、输入条会**自己**跟着变 ——
   它们全在 `脸` 那张表里,`切到()` 会把它们挨个画一遍。
   所以这里一个 getElementById 都不该有,只剩「把光标放进名字框」这种真·局部的事。 */
function openNewProject(){

  $log.scrollTop = 0;
  /* 左边换成了新项目那一个节点 —— 把它摆到视野正中（上一个项目拖到哪儿跟它无关） */
  requestAnimationFrame(() => requestAnimationFrame(treeHome));
