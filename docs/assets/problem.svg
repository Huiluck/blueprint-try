<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif">
  <title>Intelligence in the middle, problems at both ends</title>
  <desc>One model call: limited context goes in, one linear sequence comes out. The problems are at both ends.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#EEF1F4" stroke-width="1"/>
    </pattern>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1D232A"/>
    </marker>
    <marker id="headsoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#59616B"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="#FAFBFC"/>
  <rect width="1200" height="580" fill="url(#grid)"/>

  <rect x="60" y="48" width="28" height="28" fill="#111418"/>
  <text x="74" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#F5F7FA">B</text>
  <text x="100" y="67" font-size="15" font-weight="600" fill="#1D232A">Blueprint<tspan dx="10" font-weight="400" fill="#59616B">Developer Handbook · Figure 1 · The problem</tspan></text>
  <text x="1140" y="67" text-anchor="end" font-size="11" fill="#68717B" font-family="'SF Mono', Menlo, monospace">Draft 2026-10-20</text>

  <text x="60" y="126" font-size="32" font-weight="600" fill="#1D232A">Intelligence in the middle, problems at both ends</text>

  <text x="80" y="212" font-size="18" font-weight="600" fill="#1D232A">Input</text>
  <text x="80" y="236" font-size="14" fill="#59616B">Is what it sees exactly what it needs?</text>
  <text x="700" y="212" font-size="18" font-weight="600" fill="#1D232A">Output</text>
  <text x="700" y="236" font-size="14" fill="#59616B">Can what it says become something that works?</text>

  <text x="80" y="340" font-size="12" fill="#68717B" font-family="'SF Mono', Menlo, monospace">context</text>
  <g>
    <rect x="80" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="100" y="352" width="16" height="36" fill="#D5DBE1"/>
    <rect x="120" y="352" width="16" height="36" fill="#D5DBE1"/>
    <rect x="140" y="352" width="16" height="36" fill="#D5DBE1"/>
    <rect x="160" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="180" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="200" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="220" y="352" width="16" height="36" fill="#D5DBE1"/>
    <rect x="240" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="260" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="281" y="353" width="14" height="34" fill="#EEF1F4" stroke="#1D232A" stroke-width="2"/>
    <rect x="300" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="320" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="340" y="352" width="16" height="36" fill="#D5DBE1"/>
    <rect x="360" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="380" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="400.5" y="352.5" width="15" height="35" fill="none" stroke="#59616B" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="420" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="440" y="352" width="16" height="36" fill="#3A434D"/>
    <rect x="460" y="352" width="16" height="36" fill="#D5DBE1"/>
    <rect x="480" y="352" width="16" height="36" fill="#3A434D"/>
  </g>

  <line x1="128" y1="392" x2="128" y2="428" stroke="#9AA4AF" stroke-width="1"/>
  <text x="128" y="446" text-anchor="middle" font-size="14" font-weight="600" fill="#1D232A">Efficiency</text>
  <text x="128" y="466" text-anchor="middle" font-size="12" fill="#59616B">Noise got in</text>
  <line x1="288" y1="392" x2="288" y2="428" stroke="#9AA4AF" stroke-width="1"/>
  <text x="288" y="446" text-anchor="middle" font-size="14" font-weight="600" fill="#1D232A">Weight</text>
  <text x="288" y="466" text-anchor="middle" font-size="12" fill="#59616B">Key parts buried</text>
  <line x1="408" y1="392" x2="408" y2="428" stroke="#9AA4AF" stroke-width="1"/>
  <text x="408" y="446" text-anchor="middle" font-size="14" font-weight="600" fill="#1D232A">Completeness</text>
  <text x="408" y="466" text-anchor="middle" font-size="12" fill="#59616B">Key parts missing</text>

  <line x1="502" y1="370" x2="538" y2="370" stroke="#1D232A" stroke-width="1.5" marker-end="url(#head)"/>

  <rect x="540" y="330" width="120" height="80" fill="#111418"/>
  <text x="600" y="377" text-anchor="middle" font-size="20" font-weight="600" fill="#F5F7FA">LLM</text>
  <text x="600" y="436" text-anchor="middle" font-size="12" fill="#59616B">The intelligence itself</text>
  <text x="600" y="454" text-anchor="middle" font-size="12" fill="#59616B">We leave it alone</text>

  <line x1="662" y1="370" x2="698" y2="370" stroke="#1D232A" stroke-width="1.5" marker-end="url(#head)"/>

  <text x="704" y="374" font-size="12" fill="#3A434D">Sure, the full plan:</text>
  <rect x="832.5" y="356.5" width="29" height="27" fill="none" stroke="#59616B" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M826 368C838 340 856 340 868 368" fill="none" stroke="#1D232A" stroke-width="1.5"/>
  <text x="872" y="374" font-size="12" fill="#3A434D">Follow it</text>

  <path d="M926 368C948 320 1016 320 1036 366" fill="none" stroke="#59616B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#headsoft)"/>
  <rect x="1040" y="354" width="60" height="32" fill="#FFFFFF" stroke="#1D232A" stroke-width="1.5"/>
  <text x="1070" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#1D232A">Done</text>

  <text x="770" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#1D232A">Linear</text>
  <text x="770" y="302" text-anchor="middle" font-size="12" fill="#59616B">One line: no parallel, no going back</text>
  <line x1="770" y1="308" x2="770" y2="358" stroke="#9AA4AF" stroke-width="1"/>
  <text x="988" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#1D232A">Instant finish</text>
  <text x="988" y="302" text-anchor="middle" font-size="12" fill="#59616B">Steps in between get skipped</text>
  <line x1="988" y1="308" x2="983" y2="326" stroke="#9AA4AF" stroke-width="1"/>

  <line x1="740" y1="378" x2="740" y2="428" stroke="#9AA4AF" stroke-width="1"/>
  <text x="740" y="446" text-anchor="middle" font-size="14" font-weight="600" fill="#1D232A">Text only</text>
  <text x="740" y="466" text-anchor="middle" font-size="12" fill="#59616B">Emits words only</text>
  <line x1="847" y1="386" x2="847" y2="428" stroke="#9AA4AF" stroke-width="1"/>
  <text x="847" y="446" text-anchor="middle" font-size="14" font-weight="600" fill="#1D232A">Too smooth</text>
  <text x="847" y="466" text-anchor="middle" font-size="12" fill="#59616B">Fluency hides gaps</text>

  <path d="M80 476V482H496V476" fill="none" stroke="#9AA4AF" stroke-width="1"/>
  <text x="288" y="498" text-anchor="middle" font-size="11" fill="#68717B">Problem 1 · Compression and recall</text>
  <text x="770" y="264" text-anchor="middle" font-size="11" fill="#68717B">Problem 2</text>
  <text x="988" y="264" text-anchor="middle" font-size="11" fill="#68717B">Problem 2</text>
  <text x="740" y="486" text-anchor="middle" font-size="11" fill="#68717B">Problem 3</text>
  <text x="847" y="486" text-anchor="middle" font-size="11" fill="#68717B">Problem 2</text>
  <line x1="60" y1="510" x2="1140" y2="510" stroke="#DDE2E7" stroke-width="1"/>
  <text x="60" y="540" font-size="13" fill="#59616B">The flaws at each end change as models improve. The structure doesn't: one call reads a limited context and emits one linear sequence.</text>
</svg>
